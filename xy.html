<html lang="en">

<title>Anush Decodes | x0s.link</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ══════════════════════════════════════════
   BASE / TOKENS
══════════════════════════════════════════ */
:root {
  --bg:        #000000;
  --card:      #0a0a0a;
  --card2:     #111111;
  --border:    #1a1a1a;
  --border2:   rgba(255,255,255,0.06);
  --accent:    #007aff;
  --text:      #ffffff;
  --muted:     #666666;
  --muted2:    #444444;
  --glass:     rgba(10,10,10,0.75);
  --radius:    14px;
  --ease:      cubic-bezier(0.4,0,0.2,1);
  --font:      'Space Grotesk', sans-serif;
}
.light-mode {
  --bg:     #ffffff;
  --card:   #f5f5f7;
  --card2:  #f0f0f2;
  --border: #e0e0e2;
  --border2:rgba(0,0,0,0.07);
  --text:   #000000;
  --muted:  #888888;
  --glass:  rgba(255,255,255,0.82);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.35s var(--ease), color 0.35s var(--ease);
}

::-webkit-scrollbar { display: none; }

/* ══════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════ */
@keyframes slideUp   { from { transform:translateY(18px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes pulse     { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
@keyframes fadeIn    { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

.page {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}

/* ══════════════════════════════════════════
   TOP BAR & DROPDOWN
══════════════════════════════════════════ */
.top-bar {
  position: sticky; top: 0; z-index: 80;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border2);
}
.light-mode .top-bar { background: rgba(255,255,255,0.72); border-bottom: 1px solid var(--border); }
.top-bar-brand { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.top-bar-brand span { color: var(--accent); }
.menu-btn { width: 36px; height: 36px; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); position: relative; }

.dropdown-menu {
  position: absolute; top: 50px; right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 6px; display: none; z-index: 100;
  min-width: 170px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: fadeIn 0.2s var(--ease);
}
.dropdown-menu.active { display: block; }
.menu-item {
  padding: 10px 14px; font-size: 0.75rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  border-radius: 10px; transition: 0.2s;
}
.menu-item:hover { background: var(--border); }
.menu-item i { color: var(--accent); font-size: 0.85rem; }

/* ══════════════════════════════════════════
   BANNER & PROFILE
══════════════════════════════════════════ */
.banner { width: 100%; height: 200px; position: relative; overflow: hidden; background: linear-gradient(135deg, #000814 0%, #001d3d 60%, #000000 100%); }
.banner-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; }
.banner-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%); }

.profile-section { padding: 0 20px; margin-top: -52px; position: relative; animation: slideUp 0.6s var(--ease) both; }

.follow-btn {
  position: absolute; right: 20px; top: 65px;
  padding: 10px 30px; background: rgba(255,255,255,0.9);
  color: #000; border: none; border-radius: 30px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.follow-btn.following { background: var(--card); color: var(--text); border: 1px solid var(--border); }

.avatar-wrap { width: 84px; height: 84px; position: relative; margin-bottom: 14px; }
.avatar-img { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; border: 1px solid var(--border); display: block; }

.name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.name { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.verified { color: var(--accent); font-size: 0.85rem; animation: pulse 2.5s infinite; }

.handle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.handle { font-size: 0.72rem; font-weight: 500; color: var(--accent); letter-spacing: 0.06em; font-family: 'Space Grotesk', monospace; }
.follower-stat { font-size: 0.72rem; color: var(--muted); display: flex; gap: 12px; }
.follower-stat b { color: var(--text); }

.bio { font-size: 0.82rem; color: var(--muted); font-weight: 300; line-height: 1.6; margin-bottom: 14px; }

/* ── BIO MUSIC — inline, no pill ── */
.bio-music-inline {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  cursor: pointer;
}
.bio-music-inline .bm-toggle {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 0.72rem;
  flex-shrink: 0;
}
.bio-music-inline .bm-label {
  font-size: 0.75rem; font-weight: 500; color: var(--text);
  white-space: nowrap;
}
.bio-music-inline .bm-eq {
  display: flex; align-items: flex-end; gap: 2px; height: 10px; flex-shrink: 0;
}
.bio-music-inline .bm-eq span {
  width: 2px; background: var(--accent); border-radius: 1px;
  animation: eqBar 0.8s infinite alternate;
}
.bio-music-inline .bm-eq span:nth-child(2) { animation-delay: 0.2s; }
.bio-music-inline .bm-eq span:nth-child(3) { animation-delay: 0.4s; }
.bio-music-inline .bm-eq.paused span { animation-play-state: paused; opacity: 0.3; }
@keyframes eqBar { from { height: 3px; opacity: 0.4; } to { height: 10px; opacity: 1; } }

.links-row { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
.link-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--text); font-size: 0.72rem; font-weight: 600; white-space: nowrap; transition: all 0.2s; }

/* ══════════════════════════════════════════
   POSTS GRID — 3:4 portrait
══════════════════════════════════════════ */
.posts-section { padding: 0 20px 100px; }
.section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 16px; display: block; }
.posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.post-thumb {
  aspect-ratio: 3/4;
  border-radius: 6px;
  overflow: hidden;
  background: var(--card);
  cursor: pointer;
  position: relative;
}
.post-thumb video, .post-thumb img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.3s var(--ease);
}
.post-thumb:active video, .post-thumb:active img { transform: scale(0.96); }

/* video icon badge */
.post-thumb .vid-badge {
  position: absolute; top: 6px; right: 6px;
  color: white; font-size: 0.65rem; opacity: 0.85;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
/* multi-image badge */
.post-thumb .multi-badge {
  position: absolute; top: 6px; right: 6px;
  color: white; font-size: 0.65rem; opacity: 0.85;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

/* ══════════════════════════════════════════
   INSTAGRAM-STYLE POST MODAL
══════════════════════════════════════════ */
.post-modal {
  position: fixed; inset: 0; z-index: 200;
  background: #000;
  display: none; flex-direction: column;
  opacity: 0;
  transition: opacity 0.25s var(--ease);
}
.post-modal.active { opacity: 1; display: flex; }

/* Header */
.pm-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: #000;
  flex-shrink: 0;
  z-index: 5;
}
.pm-header-left { display: flex; align-items: center; gap: 10px; }
.pm-avatar {
  width: 36px; height: 36px; border-radius: 10px; object-fit: cover;
  border: 1px solid var(--border);
}
.pm-name { font-size: 0.88rem; font-weight: 700; line-height: 1.1; }
.pm-verified { color: var(--accent); font-size: 0.72rem; margin-left: 4px; }
.pm-more { color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
.pm-close {
  width: 34px; height: 34px;
  background: rgba(255,255,255,0.08); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: white; cursor: pointer; font-size: 0.85rem;
}

/* Media area */
.pm-media-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #000;
  display: flex; align-items: center; justify-content: center;
}

/* Slider */
.pm-slider {
  display: flex;
  width: 100%; height: 100%;
  transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}
.pm-slide {
  min-width: 100%; height: 100%;
  position: relative; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.pm-slide img, .pm-slide video {
  width: 100%; height: 100%; object-fit: contain;
  display: block;
}

/* Dots */
.pm-dots {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 5px; z-index: 10;
}
.pm-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.35);
  transition: background 0.25s, transform 0.25s;
}
.pm-dot.active {
  background: #fff; transform: scale(1.3);
}

/* Footer */
.pm-footer {
  background: #000; padding: 10px 16px 14px; flex-shrink: 0;
}
.pm-actions {
  display: flex; align-items: center; gap: 18px; margin-bottom: 10px;
}
.pm-action-btn {
  color: var(--text); font-size: 1.3rem; cursor: pointer;
  transition: transform 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.pm-action-btn:active { transform: scale(0.85); }
.pm-action-btn.liked { color: #ed4956; }
.pm-bookmark { margin-left: auto; }
.pm-caption {
  font-size: 0.8rem; color: rgba(255,255,255,0.85); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ══════════════════════════════════════════
   MUSIC MODAL
══════════════════════════════════════════ */
.music-modal { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.88); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
.music-modal.active { display: flex; opacity: 1; }
.music-box { width: 82vw; max-width: 340px; background: #000; border: 1px solid var(--border); border-radius: 26px; overflow: hidden; padding: 24px 20px 28px; transform: scale(0.9); transition: 0.35s var(--ease); box-shadow: 0 30px 80px rgba(0,0,0,0.9); position: relative; }
.music-modal.active .music-box { transform: scale(1); }
.music-thumb-wrap { width: 100%; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; background: #0a0a14; position: relative; margin-bottom: 18px; }
.music-thumb { width: 100%; height: 100%; object-fit: cover; }
.music-play-big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.music-play-circle { width: 56px; height: 56px; border-radius: 50%; background: rgba(0,122,255,0.75); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: 0.2s; }
.music-title { font-size: 0.9rem; font-weight: 700; text-align: center; margin-bottom: 2px; }
.music-artist { font-size: 0.68rem; color: var(--muted); text-align: center; margin-bottom: 16px; }
.music-progress { width: 100%; height: 3px; -webkit-appearance: none; background: var(--border); border-radius: 2px; outline: none; margin-bottom: 6px; accent-color: var(--accent); }
.music-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid white; cursor: pointer; }
.music-times { display: flex; justify-content: space-between; font-size: 0.6rem; color: var(--muted); margin-bottom: 16px; font-family: monospace; }
.music-controls { display: flex; align-items: center; justify-content: center; gap: 28px; }
.music-ctrl { color: var(--muted); font-size: 0.9rem; cursor: pointer; }
.music-close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; background: rgba(255,255,255,0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; z-index: 10; }

.color-instagram { color: #e1306c; } .color-twitter { color: #ffffff; } .color-linkedin { color: #0077b5; } .color-discord { color: #5865f2; } .color-globe { color: var(--accent); }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════

  <!-- Header -->

<script>
/* ──────────────────────────────────────────
   UI & MENU
────────────────────────────────────────── */
function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdown-menu').classList.toggle('active'); }
function toggleDarkMode() { document.body.classList.toggle('light-mode'); document.getElementById('dropdown-menu').classList.remove('active'); }
window.onclick = function() { document.getElementById('dropdown-menu').classList.remove('active'); }

/* ──────────────────────────────────────────
   POSTS DATA
────────────────────────────────────────── */
const GITHUB_POST_FILES = [
  { files: ["file_00000000862871fab1161995ce9f104e.png", "XOS_STAMP_1776237339190.png"], type: "image", caption: "Deep logic toggle." },
  { files: ["lv_7587788892909276421_20260417222425.mp4"], type: "video", caption: "✨✨" }
];

/* ──────────────────────────────────────────
   FOLLOW
────────────────────────────────────────── */
let followerBase = parseInt(localStorage.getItem('anush_followers') || "1200");
let isFollowing = localStorage.getItem('is_following') === 'true';
function updateFollowUI() {
  const countEl = document.getElementById('follower-count');
  const btn = document.getElementById('follow-btn');
  countEl.innerText = followerBase >= 1000 ? (followerBase/1000).toFixed(1) + 'k' : followerBase;
  if(isFollowing) { btn.innerText = "Following"; btn.classList.add('following'); }
  else { btn.innerText = "Follow"; btn.classList.remove('following'); }
}
function toggleFollow() {
  if(!isFollowing) { followerBase++; isFollowing = true; } else { followerBase--; isFollowing = false; }
  localStorage.setItem('anush_followers', followerBase);
  localStorage.setItem('is_following', isFollowing);
  updateFollowUI();
}

/* ──────────────────────────────────────────
   POSTS GRID RENDER — 3:4
────────────────────────────────────────── */
let gridIntervals = [];
function renderPosts() {
  const grid = document.getElementById('posts-grid');
  gridIntervals.forEach(clearInterval); gridIntervals = [];
  grid.innerHTML = GITHUB_POST_FILES.map((post, i) => {
    const isVideo = post.type === 'video';
    const isMulti = post.files.length > 1;
    return `
      <div class="post-thumb" onclick="openPost(${i})">
        ${isVideo
          ? `<video src="${post.files[0]}" muted autoplay loop playsinline></video><span class="vid-badge"><i class="fa-solid fa-video"></i></span>`
          : `<img src="${post.files[0]}" id="img-thumb-${i}" loading="lazy">
             ${isMulti ? `<span class="multi-badge"><i class="fa-solid fa-clone"></i></span>` : ''}`
        }
      </div>`;
  }).join('');

  GITHUB_POST_FILES.forEach((post, i) => {
    if (post.files.length > 1 && post.type === 'image') {
      let fi = 0;
      gridIntervals.push(setInterval(() => {
        fi = (fi + 1) % post.files.length;
        const el = document.getElementById(`img-thumb-${i}`);
        if (el) { el.style.opacity = 0; setTimeout(() => { el.src = post.files[fi]; el.style.opacity = 1; }, 150); el.style.transition = 'opacity 0.15s'; }
      }, 2200));
    }
  });
}

/* ──────────────────────────────────────────
   POST MODAL — Instagram style
────────────────────────────────────────── */
let currentPostIdx = -1;
let currentSlide = 0;
let touchStartX = 0, touchStartY = 0;
let isDragging = false, dragStartX = 0, dragDelta = 0;
let likedPosts = {}, bookmarkedPosts = {};

function openPost(idx) {
  currentPostIdx = idx;
  currentSlide = 0;
  buildSlider();
  updateDots();
  updateCaption();

  const modal = document.getElementById('post-modal');
  modal.style.display = 'flex';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { modal.classList.add('active'); });
  });

  // prevent body scroll
  document.body.style.overflow = 'hidden';

  // update like/bookmark state
  updateLikeUI();
  updateBookmarkUI();
}

function buildSlider() {
  const post = GITHUB_POST_FILES[currentPostIdx];
  const slider = document.getElementById('pm-slider');
  slider.innerHTML = '';
  slider.style.transform = 'translateX(0)';

  post.files.forEach((file, i) => {
    const slide = document.createElement('div');
    slide.className = 'pm-slide';
    const isVid = post.type === 'video' || file.endsWith('.mp4') || file.endsWith('.mov');
    if (isVid) {
      const vid = document.createElement('video');
      vid.src = file;
      vid.autoplay = true;
      vid.loop = true;
      vid.playsinline = true;
      vid.controls = false;
      // *** AUDIO ON — user already clicked ***
      vid.muted = false;
      slide.appendChild(vid);
    } else {
      const img = document.createElement('img');
      img.src = file;
      img.alt = '';
      img.draggable = false;
      slide.appendChild(img);
    }
    slider.appendChild(slide);
  });

  // Dots
  const dotsEl = document.getElementById('pm-dots');
  dotsEl.innerHTML = '';
  if (post.files.length > 1) {
    post.files.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'pm-dot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(dot);
    });
  }

  // Swipe listeners
  const wrap = document.getElementById('pm-media-wrap');
  wrap.ontouchstart = onSwipeStart;
  wrap.ontouchmove = onSwipeMove;
  wrap.ontouchend = onSwipeEnd;
}

function goToSlide(idx) {
  const post = GITHUB_POST_FILES[currentPostIdx];
  if (idx < 0 || idx >= post.files.length) return;
  currentSlide = idx;
  const slider = document.getElementById('pm-slider');
  slider.style.transform = `translateX(-${currentSlide * 100}%)`;
  updateDots();

  // play/pause videos
  const slides = slider.querySelectorAll('.pm-slide');
  slides.forEach((slide, i) => {
    const vid = slide.querySelector('video');
    if (!vid) return;
    if (i === currentSlide) { vid.muted = false; vid.play().catch(()=>{}); }
    else { vid.pause(); }
  });
}

function updateDots() {
  document.querySelectorAll('.pm-dot').forEach((d, i) => {
    d.classList.toggle('active', i === currentSlide);
  });
}

function updateCaption() {
  document.getElementById('pm-caption').innerText = GITHUB_POST_FILES[currentPostIdx].caption;
}

function onSwipeStart(e) {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
  isDragging = true; dragDelta = 0;
  const slider = document.getElementById('pm-slider');
  slider.style.transition = 'none';
}
function onSwipeMove(e) {
  if (!isDragging) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dy) > Math.abs(dx) + 8) { isDragging = false; return; }
  e.preventDefault();
  dragDelta = dx;
  const slider = document.getElementById('pm-slider');
  const baseX = -currentSlide * 100;
  slider.style.transform = `translateX(calc(${baseX}% + ${dx}px))`;
}
function onSwipeEnd(e) {
  if (!isDragging) return;
  isDragging = false;
  const slider = document.getElementById('pm-slider');
  slider.style.transition = 'transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  const post = GITHUB_POST_FILES[currentPostIdx];
  if (dragDelta < -50 && currentSlide < post.files.length - 1) goToSlide(currentSlide + 1);
  else if (dragDelta > 50 && currentSlide > 0) goToSlide(currentSlide - 1);
  else goToSlide(currentSlide);
}

function closePostModal() {
  const modal = document.getElementById('post-modal');
  modal.classList.remove('active');
  document.body.style.overflow = '';
  // pause all videos
  modal.querySelectorAll('video').forEach(v => v.pause());
  setTimeout(() => { modal.style.display = 'none'; }, 280);
}

// Like & Bookmark
function toggleLike() {
  likedPosts[currentPostIdx] = !likedPosts[currentPostIdx];
  updateLikeUI();
}
function updateLikeUI() {
  const btn = document.getElementById('pm-like-btn');
  const icon = document.getElementById('pm-like-icon');
  if (likedPosts[currentPostIdx]) {
    btn.classList.add('liked');
    icon.className = 'fa-solid fa-heart';
  } else {
    btn.classList.remove('liked');
    icon.className = 'fa-regular fa-heart';
  }
}
function toggleBookmark() {
  bookmarkedPosts[currentPostIdx] = !bookmarkedPosts[currentPostIdx];
  updateBookmarkUI();
}
function updateBookmarkUI() {
  const icon = document.getElementById('pm-bm-icon');
  icon.className = bookmarkedPosts[currentPostIdx] ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark';
}

/* Close modal on backdrop (outside media+footer) */
document.getElementById('post-modal').addEventListener('click', function(e) {
  if (e.target === this) closePostModal();
});

/* ──────────────────────────────────────────
   YOUTUBE MUSIC
────────────────────────────────────────── */
let ytPlayer, ytReady = false, progressTimer;
const YT_ID = 'h4OAXvDRZTY';

function openMusicPlayer() {
  const bioAudio = document.getElementById('bio-audio');
  if (!bioAudio.paused) { bioAudio.pause(); document.getElementById('bio-play-icon').className = 'fa-solid fa-play'; document.getElementById('bio-eq').classList.add('paused'); }
  const modal = document.getElementById('music-modal');
  modal.style.display = 'flex'; setTimeout(() => modal.classList.add('active'), 10);
  document.getElementById('music-thumb').src = `https://img.youtube.com/vi/${YT_ID}/maxresdefault.jpg`;
  document.getElementById('yt-open-link').href = `https://youtu.be/${YT_ID}`;
  loadYTAPI().then(() => {
    if (!ytPlayer) {
      ytPlayer = new YT.Player('youtube-player-container', {
        height:'0', width:'0', videoId: YT_ID,
        playerVars: { playsinline:1, controls:0, autoplay:1 },
        events: { onReady: onYTReady, onStateChange: onYTStateChange }
      });
    } else { ytPlayer.loadVideoById(YT_ID); ytPlayer.playVideo(); }
  });
}
function loadYTAPI() {
  return new Promise(resolve => {
    if (window.YT && window.YT.Player) { resolve(); return; }
    const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag); window.onYouTubeIframeAPIReady = resolve;
  });
}
function onYTReady() { ytReady = true; ytPlayer.playVideo(); document.getElementById('music-duration').textContent = formatTime(ytPlayer.getDuration()); clearInterval(progressTimer); progressTimer = setInterval(updateYTProgress, 500); }
function onYTStateChange(e) { const icon = document.getElementById('music-play-icon'); if (e.data === 1) icon.className = 'fa-solid fa-pause'; else icon.className = 'fa-solid fa-play'; }
function updateYTProgress() { if (!ytPlayer || !ytReady) return; const cur = ytPlayer.getCurrentTime(), dur = ytPlayer.getDuration(); if (dur > 0) { document.getElementById('music-progress').value = (cur/dur)*100; document.getElementById('music-current').textContent = formatTime(cur); document.getElementById('music-duration').textContent = formatTime(dur); } }
function formatTime(s) { if (!s || isNaN(s)) return '0:00'; return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
function closeMusicModal() { const modal = document.getElementById('music-modal'); modal.classList.remove('active'); setTimeout(() => modal.style.display = 'none', 300); if (ytPlayer) ytPlayer.pauseVideo(); clearInterval(progressTimer); }

document.getElementById('music-play-pause').addEventListener('click', () => { if (!ytPlayer) return; ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); });
document.getElementById('music-progress').addEventListener('input', e => { if (!ytPlayer || !ytReady) return; ytPlayer.seekTo((e.target.value/100)*ytPlayer.getDuration(), true); });
document.getElementById('music-prev').addEventListener('click', () => ytPlayer?.seekTo(0, true));
document.getElementById('music-next').addEventListener('click', () => ytPlayer?.seekTo(0, true));

/* ──────────────────────────────────────────
   BIO MUSIC TOGGLE
────────────────────────────────────────── */
function toggleBioMusic(e) {
  if (e) e.stopPropagation();
  const audio = document.getElementById('bio-audio');
  const icon = document.getElementById('bio-play-icon');
  const eq = document.getElementById('bio-eq');
  if (audio.paused) { audio.play(); icon.className = 'fa-solid fa-pause'; eq.classList.remove('paused'); }
  else { audio.pause(); icon.className = 'fa-solid fa-play'; eq.classList.add('paused'); }
}
