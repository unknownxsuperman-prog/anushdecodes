<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>x0s.link — Disha Local Engine Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* xos1 Design System Specifications */
    :root {
      --xos-bg: #000000;
      --xos-accent: #007aff;
      --xos-card: rgba(10, 10, 10, 0.85);
      --xos-border: #1a1a1a;
      --xos-font: 'Space Grotesk', sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--xos-bg);
      color: #ffffff;
      font-family: var(--xos-font);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-y: auto;
    }

    .xos-panel {
      width: 100%;
      max-width: 480px;
      background: var(--xos-card);
      border: 1px solid var(--xos-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: translateY(20px);
      opacity: 0;
    }

    @keyframes slideUp {
      to { transform: translateY(0); opacity: 1; }
    }

    .xos-badge {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--xos-accent);
      background: rgba(0, 122, 255, 0.1);
      border: 1px solid rgba(0, 122, 255, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: #555;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .xos-input {
      width: 100%;
      background: #000000;
      border: 1px solid var(--xos-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-family: var(--xos-font);
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .xos-input:focus {
      border-color: var(--xos-accent);
      box-shadow: 0 0 0 1px rgba(0, 122, 255, 0.3);
    }

    select.xos-input {
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .xos-btn {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-family: var(--xos-font);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.32, 0.72, 0, 1);
      margin-top: 8px;
    }

    .xos-btn:active {
      transform: scale(0.97);
    }

    /* Autocomplete Suggestion Box */
    .suggest-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #050505;
      border: 1px solid var(--xos-border);
      border-radius: 12px;
      z-index: 100;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.9);
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .suggest-item {
      padding: 12px 16px;
      font-size: 0.8rem;
      color: #ccc;
      cursor: pointer;
      border-bottom: 1px solid #111;
      transition: background 0.15s, color 0.15s;
    }

    .suggest-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    /* Results Layout */
    .results-container {
      margin-top: 24px;
      display: none;
      border-top: 1px solid var(--xos-border);
      padding-top: 24px;
    }

    .result-card {
      background: #000000;
      border: 1px solid var(--xos-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      position: relative;
    }

    .result-card-bg-id {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      font-size: 3rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.02);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="xos-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <div>
        <h2 style="margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em;">Disha Match Engine</h2>
        <div style="font-size: 0.65rem; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;">Local Prediction Data</div>
      </div>
      <span class="xos-badge">V2.0.1 LOCAL</span>
    </div>

    <div class="form-group">
      <label class="form-label">1. Target Branch</label>
      <input type="text" id="inputBranch" class="xos-input" placeholder="Search branch (e.g., Computer Science)..." autocomplete="off">
      <div id="branchSuggestBox" class="suggest-box"></div>
    </div>

    <div class="form-group">
      <label class="form-label">2. Reserved Category</label>
      <select id="inputCategory" class="xos-input">
        <option value="">Initializing database...</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">3. Predicted Rank</label>
      <input type="number" id="inputRank" class="xos-input" placeholder="Enter your CET Rank..." min="1">
    </div>

    <button class="xos-btn" onclick="executeEngine()">Initialize Search →</button>

    <div id="resultsArea" class="results-container"></div>
  </div>

  <script>
    // 1. Load the mock data directly into the window object
    window.XOS_CUTOFF = [
      {
        id: 'E001',
        name: 'University of Visvesvaraya College of Engineering (A State Autonomous Public University on IIT Model) K R Circle',
        location: 'Bangalore',
        branches: {
          'ARTIFICIAL INTELLIGENCE AND DATA SCIENCE': { '2AH': 7355, '2ARH': 8509, 'GMH': 4660, 'SCH': 28831 },
          'CIVIL ENGINEERING': { '2AH': 79951, '3BH': 55203, 'GMH': 51179, 'GMRH': 56590, 'SCH': 72918, 'STH': 87234 },
          'COMPUTER SCIENCE AND ENGINEERING': { '1H': 10002, '2AH': 7006, '2BH': 12574, '3BRH': 7815, 'GMH': 4194, 'SCH': 23603, 'STH': 21880 },
          'ELECTRICAL & ELECTRONICS ENGINEERING': { '2AH': 24278, '3AH': 25706, '3BH': 21491, 'GMH': 16955, 'SCH': 58352, 'SCKH': 64263, 'STRH': 68382 },
          'ELECTRONICS AND COMMUNICATION ENGG': { '1H': 16862, '2AH': 10863, '2AKH': 13797, '2BH': 18030, 'GMH': 8383, 'GMRH': 11722, 'SCH': 42709 },
          'INFORMATION SCIENCE AND ENGINEERING': { '2AH': 7979, 'GMH': 5195, 'GMRH': 8180, 'SCH': 33451 },
          'MECHANICAL ENGINEERING': { '2AH': 62155, '3AH': 54534, 'GMH': 40568, 'GMKH': 53438, 'GMRH': 55401, 'SCH': 104840, 'SCRH': 174727, 'STH': 100551 }
        }
      }
    ];

    // System State
    const Engine = { branches: [], categories: [] };

    // 2. Initialize Engine Data on Load
    function bootEngine() {
      const bSet = new Set(), cSet = new Set();
      
      window.XOS_CUTOFF.forEach(college => {
        Object.keys(college.branches).forEach(branch => {
          bSet.add(branch);
          Object.keys(college.branches[branch]).forEach(cat => cSet.add(cat));
        });
      });

      Engine.branches = Array.from(bSet).sort();
      Engine.categories = Array.from(cSet).sort();

      // Populate Category Dropdown
      const catSelect = document.getElementById('inputCategory');
      catSelect.innerHTML = `<option value="">Select your category...</option>` + 
        Engine.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // 3. Branch Autocomplete Logic
    const branchInput = document.getElementById('inputBranch');
    const suggestBox = document.getElementById('branchSuggestBox');

    branchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toUpperCase();
      if (!q) { suggestBox.style.display = 'none'; return; }
      
      const matches = Engine.branches.filter(b => b.includes(q)).slice(0, 4);
      if (!matches.length) {
        suggestBox.innerHTML = `<div class="suggest-item" style="color:#555;cursor:default;">No records found</div>`;
      } else {
        suggestBox.innerHTML = matches.map(m => `
          <div class="suggest-item" onclick="selectBranch('${m}')">${m}</div>
        `).join('');
      }
      suggestBox.style.display = 'block';
    });

    branchInput.addEventListener('blur', () => {
      setTimeout(() => suggestBox.style.display = 'none', 200);
    });

    window.selectBranch = function(val) {
      branchInput.value = val;
      suggestBox.style.display = 'none';
    };

    // 4. Execution Core (Find ±2000 Mathces)
    window.executeEngine = function() {
      const targetBranch = branchInput.value.trim().toUpperCase();
      const targetCat = document.getElementById('inputCategory').value;
      const userRank = parseInt(document.getElementById('inputRank').value, 10);
      const resultsArea = document.getElementById('resultsArea');

      if (!targetBranch || !targetCat || isNaN(userRank)) {
        resultsArea.innerHTML = `<div style="color: #ef4444; font-size: 0.8rem; text-align: center;">⚠️ Please complete all fields to execute search.</div>`;
        resultsArea.style.display = 'block';
        return;
      }

      const matches = [];
      const RANGE = 2000;

      window.XOS_CUTOFF.forEach(c => {
        Object.keys(c.branches).forEach(b => {
          if (!b.includes(targetBranch)) return;
          const cutoff = c.branches[b][targetCat];
          if (cutoff == null) return;

          const diff = cutoff - userRank;
          if (Math.abs(diff) <= RANGE) {
            matches.push({ id: c.id, name: c.name, loc: c.location, branch: b, cutoff, diff });
          }
        });
      });

      matches.sort((a, b) => Math.abs(a.diff) - Math.abs(b.diff));

      // 5. Render Layout
      resultsArea.style.display = 'block';
      if (!matches.length) {
        resultsArea.innerHTML = `<div style="text-align:center; color:#555; font-size:0.8rem; padding: 20px 0;">No college matches found within ±2000 rank range.</div>`;
        return;
      }

      resultsArea.innerHTML = `
        <div style="font-size: 0.6rem; font-weight: 700; color: #555; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px;">
          Retrieved Results (${matches.length})
        </div>
        ${matches.map(m => `
          <div class="result-card">
            <div class="result-card-bg-id">${m.id}</div>
            <div style="font-size: 0.6rem; font-weight: 700; color: #555; letter-spacing: 0.1em; margin-bottom: 4px;">${m.id} · ${m.loc.toUpperCase()}</div>
            <div style="font-size: 0.85rem; font-weight: 600; color: #fff; line-height: 1.3; margin-bottom: 12px; padding-right: 40px;">${m.name}</div>
            <div style="font-size: 0.7rem; color: #888; margin-bottom: 12px;">${m.branch}</div>
            
            <div style="display: flex; justify-content: space-between; border-top: 1px solid #111; padding-top: 12px;">
              <div>
                <div style="font-size: 0.55rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em;">Cutoff Data</div>
                <div style="font-size: 1.1rem; font-weight: 700; color: #fff; margin-top: 2px;">${m.cutoff.toLocaleString('en-IN')}</div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 0.55rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em;">Target Variance</div>
                <div style="font-size: 0.9rem; font-weight: 700; color: ${m.diff >= 0 ? '#666' : '#aaa'}; margin-top: 4px;">
                  ${m.diff >= 0 ? '+' : ''}${m.diff}
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      `;
    };

    // Initialize the systems on script load
    bootEngine();
  </script>
</body>
</html>
