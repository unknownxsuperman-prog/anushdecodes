<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Favourites · x0s</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#090909;--card:#141414;--card2:#1b1b1b;
  --border:#232323;--border2:rgba(255,255,255,.06);
  --accent:#007aff;--text:#fff;--muted:#666;--muted2:#3a3a3a;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.32,.72,0,1);
  --font:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{display:none;}

@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,.25)}50%{box-shadow:0 0 0 8px rgba(0,122,255,0)}}
@keyframes eqBar{from{height:2px}to{height:10px}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ── PAGE ── */
.page{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:120px;}

/* ── WALLPAPER ── */
.wallpaper{width:100%;height:36vh;min-height:200px;max-height:280px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0a0a1a 0%,#0d1b2a 50%,#050510 100%);}
.wallpaper-img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75;}
.wallpaper-fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,9,.0) 0%,rgba(9,9,9,.0) 45%,rgba(9,9,9,.65) 78%,rgba(9,9,9,1) 100%);}

/* ── TOP BAR ── */
.top-bar{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;gap:12px;background:rgba(9,9,9,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04);z-index:20;}
.back-btn{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.85);font-size:.82rem;flex-shrink:0;transition:background .15s;}
.back-btn:active{background:rgba(0,0,0,.65);}
.top-title{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;color:#fff;flex:1;}
.top-edit-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.7);font-size:.8rem;transition:all .15s;}
.top-edit-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.top-edit-btn:active{transform:scale(.9);}

/* ── CONTENT ── */
.content{padding:0 16px;margin-top:-56px;position:relative;z-index:10;}

/* ── TABS ── */
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:4px;margin-bottom:20px;animation:slideUp .44s var(--spring) both;}
.tab{flex:1;text-align:center;padding:10px 0;font-size:.72rem;font-weight:600;color:rgba(255,255,255,.32);cursor:pointer;border-radius:12px;transition:all .2s var(--ease);letter-spacing:.02em;user-select:none;}
.tab.active{background:rgba(255,255,255,.09);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.tab:active{transform:scale(.96);}
.tab i{margin-right:5px;font-size:.68rem;}

/* ── PANEL ── */
.panel{display:none;}
.panel.active{display:block;animation:slideUp .36s var(--spring) both;}

/* ── SUB TABS ── */
.sub-tabs{display:flex;gap:3px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:3px;margin-bottom:16px;}
.sub-tab{flex:1;text-align:center;padding:8px 0;font-size:.65rem;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border-radius:9px;transition:all .2s;user-select:none;}
.sub-tab.active{background:rgba(255,255,255,.08);color:#fff;}
.sub-tab:active{transform:scale(.95);}

/* ── SECTION LABEL ── */
.section-lbl{display:block;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:rgba(255,255,255,.18);margin:20px 0 12px 2px;}
.section-lbl:first-of-type{margin-top:0;}

/* ── GRID ── */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.grid-1{display:grid;grid-template-columns:1fr;gap:8px;}

/* ── CARD ── */
.card{background:#141414;border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;transition:transform .15s,border-color .15s;animation:rowIn .32s var(--ease) both;}
.card:active{transform:scale(.96);border-color:rgba(255,255,255,.12);}

/* poster — 2:3 ratio for movies/anime/series */
.card .poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--card2);}
/* square art for music */
.card .art{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--card2);}

.card .art-wrap{position:relative;overflow:hidden;}
/* shimmer on load */
.card .art-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);transform:translateX(-100%);animation:shimmer 1.8s ease infinite;}
.card .art-loaded .art-wrap::after,.card .art-loaded .poster-wrap::after{animation:none;display:none;}

.card .poster-wrap{position:relative;overflow:hidden;}
.card .poster-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,9,.7) 0%,rgba(9,9,9,.0) 50%);}

.card .badge{position:absolute;top:7px;left:7px;padding:2px 8px;border-radius:6px;font-size:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.75);z-index:3;}
.card .badge.movie{background:rgba(255,200,50,.2);border-color:rgba(255,200,50,.15);color:#ffd866;}
.card .badge.series{background:rgba(50,200,255,.2);border-color:rgba(50,200,255,.15);color:#66d9ff;}
.card .badge.anime{background:rgba(255,70,150,.22);border-color:rgba(255,70,150,.18);color:#ff6b9d;}
.card .badge.music{background:rgba(0,200,150,.2);border-color:rgba(0,200,150,.15);color:#4dd9b0;}

.card .rating{position:absolute;bottom:8px;right:8px;padding:2px 8px;border-radius:6px;font-size:.52rem;font-weight:700;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.75);z-index:3;}

.card .play-btn{position:absolute;bottom:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;z-index:3;transition:background .18s,transform .18s;}
.card .play-btn:active{transform:scale(.85);}
.card .play-btn.playing{background:var(--accent);border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite;}

.card .info{padding:10px 10px 12px;}
.card .title{font-size:.74rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.card .sub{font-size:.6rem;color:rgba(255,255,255,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.card .meta{font-size:.54rem;font-weight:600;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

/* remove btn shown in edit mode */
.card .remove-btn{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,59,48,.85);display:none;align-items:center;justify-content:center;color:#fff;font-size:.62rem;z-index:10;transition:transform .15s;}
.card .remove-btn:active{transform:scale(.85);}
.edit-mode .card .remove-btn{display:flex;}
.edit-mode .card .play-btn,.edit-mode .card .rating{display:none;}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:12px;color:rgba(255,255,255,.2);text-align:center;}
.empty i{font-size:2rem;opacity:.25;}
.empty p{font-size:.78rem;}
.empty-sub{font-size:.62rem;color:rgba(255,255,255,.14);margin-top:4px;}

/* ── SEARCH OVERLAY ── */
@keyframes searchUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes searchDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
.search-overlay{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;}
.search-overlay.open{display:flex;animation:searchUp .42s var(--spring) forwards;}
.search-overlay.closing{display:flex;animation:searchDown .34s var(--spring) forwards;}

.search-top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(9,9,9,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.search-back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.82rem;cursor:pointer;}
.search-bar{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 13px;transition:border-color .2s;}
.search-bar:focus-within{border-color:rgba(255,255,255,.2);}
.search-bar i{color:rgba(255,255,255,.3);font-size:.82rem;flex-shrink:0;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:var(--font);font-size:.88rem;caret-color:#fff;}
.search-input::placeholder{color:rgba(255,255,255,.25);}

.search-type-tabs{display:flex;gap:3px;padding:10px 16px 8px;flex-shrink:0;}
.search-type-tab{flex:1;text-align:center;padding:8px 0;font-size:.64rem;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border-radius:10px;border:1px solid rgba(255,255,255,.06);transition:all .2s;}
.search-type-tab.active{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.12);}
.search-type-tab:active{transform:scale(.96);}

.search-results{flex:1;overflow-y:auto;padding:8px 16px 40px;}
.search-result-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:opacity .15s;animation:rowIn .24s var(--ease) both;}
.search-result-item:active{opacity:.7;}
.search-result-img{width:48px;height:64px;border-radius:9px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid rgba(255,255,255,.06);}
.search-result-img.square{height:48px;border-radius:10px;}
.search-result-info{flex:1;min-width:0;}
.search-result-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-result-sub{font-size:.64rem;color:rgba(255,255,255,.38);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-result-meta{font-size:.58rem;color:rgba(255,255,255,.2);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;}
.search-add-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:.72rem;flex-shrink:0;cursor:pointer;transition:all .15s;}
.search-add-btn:active{transform:scale(.88);}
.search-add-btn.added{background:rgba(0,200,100,.15);border-color:rgba(0,200,100,.2);color:#4dda90;}
.search-loading{padding:32px;text-align:center;color:rgba(255,255,255,.25);font-size:.78rem;}

/* ── MUSIC PLAYER BAR ── */
.player-bar{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  max-width:440px;width:calc(100% - 32px);
  background:rgba(20,20,20,.94);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,.07);border-radius:20px;
  padding:10px 14px 10px 12px;
  display:flex;align-items:center;gap:12px;
  z-index:200;box-shadow:0 4px 32px rgba(0,0,0,.7);
  animation:slideUp .48s var(--spring) both;
  transition:transform .32s var(--ease),opacity .32s var(--ease);
}
.player-bar.hidden{transform:translateX(-50%) translateY(90px);opacity:0;pointer-events:none;}
.player-bar .pb-art{width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--card2);border:1px solid rgba(255,255,255,.06);}
.player-bar .pb-info{flex:1;min-width:0;}
.player-bar .pb-title{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-bar .pb-artist{font-size:.6rem;color:rgba(255,255,255,.38);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-bar .pb-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.player-bar .pb-btn{background:none;border:none;color:rgba(255,255,255,.55);font-size:.82rem;cursor:pointer;padding:4px;display:flex;align-items:center;transition:color .15s,transform .15s;}
.player-bar .pb-btn:active{transform:scale(.82);}
.player-bar .pb-play{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:.72rem;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;}
.player-bar .pb-play:active{transform:scale(.88);}
.player-bar .pb-time{font-size:.5rem;font-weight:600;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:34px;text-align:right;}
.player-bar .pb-progress{position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:0 0 20px 20px;overflow:hidden;}
.player-bar .pb-track{width:100%;height:100%;background:rgba(255,255,255,.07);}
.player-bar .pb-fill{height:100%;width:0%;background:#fff;transition:width .3s linear;}
</style>
</head>
<body>
<div class="page" id="app">

  <!-- WALLPAPER -->
  <div class="wallpaper">
    <img class="wallpaper-img" id="wallpaper-img" src="" alt="">
    <div class="wallpaper-fade"></div>
    <div class="top-bar">
      <div class="back-btn" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="top-title">Favourites <span style="font-size:.6rem;font-weight:500;color:rgba(255,255,255,.28);letter-spacing:.06em;text-transform:uppercase;"> · x0s</span></div>
      <div class="top-edit-btn" id="edit-btn" onclick="toggleEditMode()"><i class="fa-solid fa-pen"></i></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" data-tab="music" onclick="switchTab('music')"><i class="fa-solid fa-music"></i>Music</div>
      <div class="tab" data-tab="shows" onclick="switchTab('shows')"><i class="fa-solid fa-film"></i>Shows</div>
    </div>

    <!-- PANEL: MUSIC -->
    <div class="panel active" id="panel-music">
      <span class="section-lbl">Top Tracks</span>
      <div class="grid-3" id="music-tracks-grid"></div>
      <span class="section-lbl">Albums</span>
      <div class="grid-3" id="music-albums-grid"></div>
    </div>

    <!-- PANEL: SHOWS -->
    <div class="panel" id="panel-shows">
      <div class="sub-tabs">
        <div class="sub-tab active" data-sub="movies" onclick="switchSub('movies')">Movies</div>
        <div class="sub-tab" data-sub="series" onclick="switchSub('series')">Series</div>
        <div class="sub-tab" data-sub="anime" onclick="switchSub('anime')">Anime</div>
      </div>
      <div class="grid-2" id="shows-grid"></div>
    </div>

  </div>

  <!-- PLAYER BAR -->
  <div class="player-bar hidden" id="player-bar">
    <div class="pb-progress"><div class="pb-track"><div class="pb-fill" id="pb-fill"></div></div></div>
    <img class="pb-art" id="pb-art" src="" alt="">
    <div class="pb-info"><div class="pb-title" id="pb-title">—</div><div class="pb-artist" id="pb-artist">—</div></div>
    <div class="pb-time" id="pb-time">0:00</div>
    <div class="pb-controls">
      <button class="pb-btn" onclick="prevTrack()"><i class="fa-solid fa-backward"></i></button>
      <button class="pb-play" id="pb-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="pb-play-icon"></i></button>
      <button class="pb-btn" onclick="nextTrack()"><i class="fa-solid fa-forward"></i></button>
    </div>
  </div>

</div>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="search-overlay">
  <div class="search-top">
    <div class="search-back" onclick="closeSearch()"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="search-input" id="search-input" type="text" placeholder="Search…" autocomplete="off" oninput="onSearchInput(this.value)">
    </div>
  </div>
  <div class="search-type-tabs" id="search-type-tabs">
    <div class="search-type-tab active" data-stype="tracks" onclick="switchSearchType('tracks')">Tracks</div>
    <div class="search-type-tab" data-stype="albums" onclick="switchSearchType('albums')">Albums</div>
    <div class="search-type-tab" data-stype="movies" onclick="switchSearchType('movies')">Movies</div>
    <div class="search-type-tab" data-stype="series" onclick="switchSearchType('series')">Series</div>
    <div class="search-type-tab" data-stype="anime" onclick="switchSearchType('anime')">Anime</div>
  </div>
  <div class="search-results" id="search-results">
    <div class="empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add</p></div>
  </div>
</div>

<audio id="audio-player" preload="none"></audio>

<script>
/* ════════════════════════════════
   XOS FAVOURITES
   Music: iTunes API
   Movies/Series/Anime: TMDB API
════════════════════════════════ */

/* ── STATE ── */
let editMode = false;
let currentTab = 'music';
let currentSub = 'movies';
let searchType = 'tracks';
let searchOpen = false;
let searchTimer = null;

// Music player
const audio = document.getElementById('audio-player');
let queue = [];
let currentIdx = -1;
let isPlaying = false;
let progressTimer = null;

/* ── STORAGE ── */

  get(k){ try{ return JSON.parse(localStorage.getItem('xos_fav_'+k)||'[]'); }catch{ return []; } },

};

    {id:'t3',title:'Starboy',artist:'The Weeknd',artwork:'https://is1-ssl.mzstatic.com/image/thumb/Music111/v4/4c/bd/0a/4cbd0a3d-e56f-f5a3-7bd7-9ab1e9bfca7e/00602557598438.rgb.jpg/400x400bb.jpg',stream:'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview122/v4/89/ab/8d/89ab8d0d-8fb5-cb14-b1c7-fdab0c2d1ddd/mzaf_4478413399508591521.plus.aac.ep.m4a',year:2016,genre:'R&B'}
  ],

function getData(k){ const d=LS.get(k); return d.length?d:DEFAULTS[k]||[]; }
function saveData(k,v){ LS.set(k,v); }

/* ── TABS ── */
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.id==='panel-'+tab));
  if(tab==='shows') renderShows();
  // Update search type tabs visibility
  updateSearchTypeTabs();
}

function switchSub(sub){
  currentSub=sub;
  document.querySelectorAll('.sub-tab').forEach(el=>el.classList.toggle('active',el.dataset.sub===sub));
  renderShows();
}

function updateSearchTypeTabs(){
  // handled by search overlay
}

/* ── RENDER MUSIC ── */
function renderMusic(){
  const tracks=getData('tracks');
  const tg=document.getElementById('music-tracks-grid');
  tg.innerHTML=tracks.length?tracks.map((t,i)=>`
    <div class="card" style="animation-delay:${i*35}ms" onclick="handleTrackClick(${i})">
      <div class="art-wrap">
        <img class="art" src="${t.artwork}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x400/141414/444?text=♪'">
        <div class="badge music">${t.genre||'Track'}</div>
        <div class="play-btn ${currentIdx===i&&isPlaying?'playing':''}" id="pBtn-${i}" onclick="event.stopPropagation();toggleTrack(${i})">
          <i class="fa-solid ${currentIdx===i&&isPlaying?'fa-pause':'fa-play'}" id="pIcon-${i}"></i>
        </div>
        <div class="remove-btn" onclick="event.stopPropagation();removeItem('tracks',${i})"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="info"><div class="title">${t.title}</div><div class="sub">${t.artist}</div><div class="meta">${t.year}</div></div>
    </div>`).join('')
    :`<div class="empty" style="grid-column:1/-1"><i class="fa-solid fa-music"></i><p>No tracks yet</p><div class="empty-sub">Tap + to add</div></div>`;

  const albums=getData('albums');
  const ag=document.getElementById('music-albums-grid');
  ag.innerHTML=albums.length?albums.map((a,i)=>`
    <div class="card" style="animation-delay:${i*35}ms">
      <div class="art-wrap">
        <img class="art" src="${a.artwork}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x400/141414/444?text=💿'">
        <div class="badge music">${a.trackCount||'?'} tracks</div>
        <div class="remove-btn" onclick="event.stopPropagation();removeItem('albums',${i})"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="info"><div class="title">${a.title}</div><div class="sub">${a.artist}</div><div class="meta">${a.year}</div></div>
    </div>`).join('')
    :`<div class="empty" style="grid-column:1/-1"><i class="fa-solid fa-compact-disc"></i><p>No albums yet</p></div>`;
}

/* ── RENDER SHOWS ── */
function renderShows(){
  const data=getData(currentSub);
  const grid=document.getElementById('shows-grid');
  const typeClass=currentSub==='movies'?'movie':currentSub==='series'?'series':'anime';
  grid.innerHTML=data.length?data.map((item,i)=>`
    <div class="card" style="animation-delay:${i*40}ms">
      <div class="poster-wrap">
        <img class="poster" src="${item.artwork}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x600/141414/444?text=🎬'">
        <div class="badge ${typeClass}">${typeClass.charAt(0).toUpperCase()+typeClass.slice(1)}</div>
        <div class="rating">⭐ ${item.rating||'—'}</div>
        <div class="remove-btn" onclick="event.stopPropagation();removeItem('${currentSub}',${i})"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="info"><div class="title">${item.title}</div><div class="sub">${item.subtitle}</div><div class="meta">${item.year}</div></div>
    </div>`).join('')
    :`<div class="empty" style="grid-column:1/-1"><i class="fa-solid fa-film"></i><p>No ${currentSub} yet</p><div class="empty-sub">Tap + to search & add</div></div>`;
}

/* ── EDIT MODE ── */
function toggleEditMode(){
  editMode=!editMode;
  document.getElementById('content').classList.toggle('edit-mode',editMode);
  const btn=document.getElementById('edit-btn');
  btn.classList.toggle('active',editMode);
  btn.innerHTML=editMode?'<i class="fa-solid fa-check"></i>':'<i class="fa-solid fa-pen"></i>';
  if(!editMode) return;
  // open search when entering edit mode
  openSearch();
}

function removeItem(key,idx){
  const data=getData(key);
  data.splice(idx,1);
  saveData(key,data);
  if(key==='tracks'||key==='albums') renderMusic();
  else renderShows();
}

/* ── SEARCH OVERLAY ── */
function openSearch(){
  // Set search type based on current tab/sub
  if(currentTab==='music') switchSearchType('tracks');
  else switchSearchType(currentSub==='movies'?'movies':currentSub==='series'?'series':'anime');
  searchOpen=true;
  const el=document.getElementById('search-overlay');
  el.style.display='flex';
  el.classList.remove('closing');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  setTimeout(()=>document.getElementById('search-input').focus(),400);
}

function closeSearch(){
  searchOpen=false;
  const el=document.getElementById('search-overlay');
  el.classList.remove('open');
  el.classList.add('closing');
  document.getElementById('search-input').value='';
  setTimeout(()=>{el.style.display='none';el.classList.remove('closing');},360);
}

function switchSearchType(type){
  searchType=type;
  document.querySelectorAll('.search-type-tab').forEach(el=>el.classList.toggle('active',el.dataset.stype===type));
  // re-search with current query
  const q=document.getElementById('search-input').value.trim();
  if(q) doSearch(q);
  else document.getElementById('search-results').innerHTML='<div class="empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add</p></div>';
}

function onSearchInput(val){
  clearTimeout(searchTimer);
  if(!val.trim()){document.getElementById('search-results').innerHTML='<div class="empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add</p></div>';return;}
  document.getElementById('search-results').innerHTML='<div class="search-loading">Searching…</div>';
  searchTimer=setTimeout(()=>doSearch(val.trim()),420);
}

function hasTmdbKey(){
  return TMDB_KEY && TMDB_KEY !== TMDB_PLACEHOLDER_KEY && !/^your[_-]?tmdb[_-]?key$/i.test(TMDB_KEY);
}

function encodeForInline(value){
  return encodeURIComponent(JSON.stringify(value)).replace(/'/g,'%27');
}

async function searchTmdbShows(q,type){
  if(!hasTmdbKey()) throw new Error('Missing TMDB key');
  const typeMap={movies:'movie',series:'tv',anime:'tv'};
  const tmdbType=typeMap[type]||'movie';
  const animeQuery=type==='anime'?q+' anime':q;
  const r=await fetch(`https://api.themoviedb.org/3/search/${tmdbType}?api_key=${TMDB_KEY}&query=${encodeURIComponent(animeQuery)}&include_adult=false`);
  const d=await r.json();
  if(!r.ok||d.success===false) throw new Error(d.status_message||'TMDB search failed');
  return (d.results||[]).slice(0,10).map(item=>{
    const year=item.release_date?item.release_date.substring(0,4):(item.first_air_date?item.first_air_date.substring(0,4):'');
    return {
      id:'tmdb_'+item.id,
      title:item.title||item.name||'—',
      subtitle:item.overview?item.overview.substring(0,40)+'...':'',
      artwork:item.poster_path?TMDB_IMG+item.poster_path:'https://placehold.co/48x64/141414/444?text=🎬',
      year:year,
      rating:item.vote_average?item.vote_average.toFixed(1):'—',
      type:type
    };
  });
}

async function searchPublicShows(q,type){
  if(type==='movies'){
    const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=movie&entity=movie&limit=10`);
    const d=await r.json();
    return (d.results||[]).map(item=>({
      id:'itunes_movie_'+item.trackId,
      title:item.trackName||'—',
      subtitle:item.primaryGenreName||'',
      artwork:(item.artworkUrl100||'').replace('100x100','400x600')||'https://placehold.co/48x64/141414/444?text=🎬',
      year:item.releaseDate?item.releaseDate.substring(0,4):'',
      rating:item.contentAdvisoryRating||'—',
      type:type
    }));
  }
  if(type==='anime'){
    const r=await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=10`);
    const d=await r.json();
    return (d.data||[]).map(item=>({
      id:'jikan_'+item.mal_id,
      title:item.title_english||item.title||'—',
      subtitle:(item.synopsis||'').substring(0,40)+(item.synopsis&&item.synopsis.length>40?'...':''),
      artwork:item.images?.jpg?.image_url||'https://placehold.co/48x64/141414/444?text=🎬',
      year:item.year||((item.aired?.from||'').substring(0,4)),
      rating:item.score?item.score.toFixed(1):'—',
      type:type
    }));
  }
  const r=await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
  const d=await r.json();
  return (d||[]).slice(0,10).map(({show})=>({
    id:'tvmaze_'+show.id,
    title:show.name||'—',
    subtitle:(show.genres||[]).slice(0,2).join(', '),
    artwork:show.image?.medium||show.image?.original||'https://placehold.co/48x64/141414/444?text=🎬',
    year:show.premiered?show.premiered.substring(0,4):'',
    rating:show.rating?.average?show.rating.average.toFixed(1):'—',
    type:type
  }));
}

async function searchShows(q,type){
  try{
    return await searchTmdbShows(q,type);
  }catch(e){
    return searchPublicShows(q,type);
  }
}

async function doSearch(q){
  const res=document.getElementById('search-results');
  try{
    if(searchType==='tracks'||searchType==='albums'){
      const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=${searchType==='albums'?'album':'song'}&limit=10&media=music`);
      const d=await r.json();
      if(!d.results||!d.results.length){res.innerHTML='<div class="empty"><i class="fa-solid fa-face-meh"></i><p>No results</p></div>';return;}
      const existing=getData(searchType==='albums'?'albums':'tracks').map(x=>x.id);
      res.innerHTML=d.results.map((item,i)=>{
        const isTrack=searchType==='tracks';
        const id=String(item.trackId||item.collectionId);
        const already=existing.includes(id)||existing.includes('i'+id);
        const art=(item.artworkUrl100||'').replace('100x100','400x400');
        const title=item.trackName||item.collectionName||'—';
        const sub=item.artistName||'—';
        const meta=isTrack?(item.primaryGenreName||''):`${item.trackCount||'?'} tracks`;
        const year=item.releaseDate?item.releaseDate.substring(0,4):'';
        const stream=item.previewUrl||'';
        return `<div class="search-result-item" style="animation-delay:${i*30}ms">
          <img class="search-result-img square" src="${art}" alt="" onerror="this.src='https://placehold.co/48x48/141414/444?text=♪'">
          <div class="search-result-info">
            <div class="search-result-title">${title}</div>
            <div class="search-result-sub">${sub}</div>
            <div class="search-result-meta">${meta} ${year?'· '+year:''}</div>
          </div>
          <div class="search-add-btn ${already?'added':''}" onclick="addMusicItem('${searchType}','${encodeForInline({id:id,title:title,artist:sub,artwork:art,stream:stream,year:year,genre:item.primaryGenreName||'',trackCount:item.trackCount||0})}',this)">
            <i class="fa-solid ${already?'fa-check':'fa-plus'}"></i>
          </div>
        </div>`;
      }).join('');
    } else {
      const results=await searchShows(q,searchType);
      if(!results.length){res.innerHTML='<div class="empty"><i class="fa-solid fa-face-meh"></i><p>No results</p></div>';return;}
      const existing=getData(searchType).map(x=>x.id);
      res.innerHTML=results.map((item,i)=>{
        const already=existing.includes(item.id);
        return `<div class="search-result-item" style="animation-delay:${i*30}ms">
          <img class="search-result-img" src="${item.artwork}" alt="" onerror="this.src='https://placehold.co/48x64/141414/444?text=🎬'">
          <div class="search-result-info">
            <div class="search-result-title">${item.title}</div>
            <div class="search-result-sub">⭐ ${item.rating}</div>
            <div class="search-result-meta">${searchType} ${item.year?'· '+item.year:''}</div>
          </div>
          <div class="search-add-btn ${already?'added':''}" onclick="addShowItem('${searchType}','${encodeForInline(item)}',this)">
            <i class="fa-solid ${already?'fa-check':'fa-plus'}"></i>
          </div>
        </div>`;
      }).join('');
    }
  }catch(e){res.innerHTML=`<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Search failed</p></div>`;}
}

function addMusicItem(type,encoded,btn){
  if(btn.classList.contains('added')) return;
  const item=JSON.parse(decodeURIComponent(encoded));
  const key=type==='albums'?'albums':'tracks';
  const data=getData(key);
  data.push(item);
  saveData(key,data);
  btn.classList.add('added');
  btn.innerHTML='<i class="fa-solid fa-check"></i>';
  renderMusic();
}

function addShowItem(type,encoded,btn){
  if(btn.classList.contains('added')) return;
  const item=JSON.parse(decodeURIComponent(encoded));
  const data=getData(type);
  data.push(item);
  saveData(type,data);
  btn.classList.add('added');
  btn.innerHTML='<i class="fa-solid fa-check"></i>';
  if(currentTab==='shows'&&currentSub===type) renderShows();
}

/* ── MUSIC PLAYER ── */
function handleTrackClick(i){
  if(editMode) return;
  toggleTrack(i);
}

function toggleTrack(i){
  const tracks=getData('tracks');
  if(!tracks[i]) return;
  if(currentIdx===i&&isPlaying){pausePlayer();return;}
  if(currentIdx===i&&!isPlaying){resumePlayer();return;}
  currentIdx=i;
  queue=tracks;
  loadTrack(tracks[i]);
}

function loadTrack(t){
  audio.src=t.stream;
  audio.load();
  audio.play().catch(()=>{});
  isPlaying=true;
  document.getElementById('pb-art').src=t.artwork||'';
  document.getElementById('pb-title').textContent=t.title;
  document.getElementById('pb-artist').textContent=t.artist;
  document.getElementById('pb-play-icon').className='fa-solid fa-pause';
  document.getElementById('player-bar').classList.remove('hidden');
  updatePlayBtns();
  startProgress();
}

function pausePlayer(){
  audio.pause(); isPlaying=false;
  document.getElementById('pb-play-icon').className='fa-solid fa-play';
  updatePlayBtns(); clearInterval(progressTimer);
}

function resumePlayer(){
  audio.play().catch(()=>{}); isPlaying=true;
  document.getElementById('pb-play-icon').className='fa-solid fa-pause';
  updatePlayBtns(); startProgress();
}

function togglePlay(){
  if(currentIdx===-1){toggleTrack(0);return;}
  isPlaying?pausePlayer():resumePlayer();
}

function nextTrack(){
  if(!queue.length) return;
  currentIdx=(currentIdx+1)%queue.length;
  loadTrack(queue[currentIdx]);
}

function prevTrack(){
  if(!queue.length) return;
  currentIdx=(currentIdx-1+queue.length)%queue.length;
  loadTrack(queue[currentIdx]);
}

function updatePlayBtns(){
  document.querySelectorAll('.play-btn').forEach((el,_)=>{
    const i=parseInt(el.id.replace('pBtn-',''));
    const active=i===currentIdx&&isPlaying;
    el.classList.toggle('playing',active);
    const icon=document.getElementById('pIcon-'+i);
    if(icon) icon.className='fa-solid '+(active?'fa-pause':'fa-play');
  });
}

function startProgress(){
  clearInterval(progressTimer);
  progressTimer=setInterval(()=>{
    if(!audio.duration||isNaN(audio.duration)) return;
    const pct=(audio.currentTime/audio.duration)*100;
    document.getElementById('pb-fill').style.width=pct+'%';
    document.getElementById('pb-time').textContent=fmtTime(audio.currentTime);
  },250);
}

function fmtTime(s){
  if(!s||isNaN(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

audio.addEventListener('ended',nextTrack);

/* ── BACK ── */
function goBack(){
  if(searchOpen){closeSearch();return;}
  if(window.history.length>1) window.history.back();
  else window.location.href='anush-decodes.html';
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded',()=>{
  renderMusic();
  renderShows();
});
