<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Favourites · x0s</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ── EXACT MATCH WITH ANUSH-DECODES ── */
:root{
  --bg:#090909;--card:#141414;--card2:#1b1b1b;
  --border:#232323;--border2:rgba(255,255,255,.06);
  --accent:#007aff;--text:#fff;--muted:#666;--muted2:#3a3a3a;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.32,.72,0,1);
  --font:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{display:none;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes eqBar{from{height:2px}to{height:10px}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes searchUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes searchDown{from{transform:translateY(0)}to{transform:translateY(100%)}}

/* ── WALLPAPER same as profile ── */
.wallpaper{
  width:100%;height:36vh;min-height:200px;max-height:280px;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0a0a1a 0%,#0d1b2a 50%,#050510 100%);
}
.wallpaper img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72;}
.wallpaper-fade{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(9,9,9,0) 0%,rgba(9,9,9,0) 45%,rgba(9,9,9,.65) 78%,rgba(9,9,9,1) 100%);
}

/* ── TOP BAR over wallpaper ── */
.top-bar{
  position:absolute;top:0;left:0;right:0;
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  z-index:20;
}
.tb-back{
  width:36px;height:36px;border-radius:10px;
  background:rgba(0,0,0,.38);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.85);font-size:.82rem;flex-shrink:0;
  transition:background .15s;
}
.tb-back:active{background:rgba(0,0,0,.65);}
.tb-title{flex:1;font-size:1.05rem;font-weight:700;letter-spacing:-.02em;color:#fff;}
.tb-edit{
  width:36px;height:36px;border-radius:10px;
  background:rgba(0,0,0,.38);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.7);font-size:.8rem;
  transition:all .18s;
}
.tb-edit.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tb-edit:active{transform:scale(.9);}

/* ── CONTENT floats up like profile card ── */
.content{
  padding:0 16px;
  margin-top:-56px;
  position:relative;z-index:10;
  padding-bottom:120px;
}

/* ── TABS — same glass as profile stats ── */
.tabs{
  display:flex;gap:3px;
  background:#0f0f0f;
  border:1px solid rgba(255,255,255,.055);
  border-radius:18px;padding:4px;
  margin-bottom:20px;
  animation:slideUp .44s var(--spring) both;
  box-shadow:0 2px 4px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.5);
}
.tab{
  flex:1;text-align:center;padding:11px 0;
  font-size:.72rem;font-weight:600;letter-spacing:.02em;
  color:rgba(255,255,255,.28);cursor:pointer;
  border-radius:14px;transition:all .2s var(--ease);user-select:none;
}
.tab i{margin-right:5px;font-size:.66rem;}
.tab.active{background:#141414;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 12px rgba(0,0,0,.4);}
.tab:active{transform:scale(.96);}

.panel{display:none;}
.panel.active{display:block;animation:slideUp .36s var(--spring) both;}

/* ── SUB TABS ── */
.sub-tabs{
  display:flex;gap:3px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.05);
  border-radius:12px;padding:3px;
  margin-bottom:18px;
}
.sub-tab{
  flex:1;text-align:center;padding:8px 0;
  font-size:.65rem;font-weight:600;
  color:rgba(255,255,255,.28);cursor:pointer;
  border-radius:9px;transition:all .2s;user-select:none;
}
.sub-tab.active{background:rgba(255,255,255,.08);color:#fff;}
.sub-tab:active{transform:scale(.95);}

/* ── SECTION LABEL same as profile ── */
.section-lbl{
  display:block;font-size:.58rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.22em;
  color:rgba(255,255,255,.18);margin:20px 0 12px 2px;
}
.section-lbl:first-child{margin-top:0;}

/* ── GRIDS ── */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}

/* ── CARD — matches profile card design language ── */
.item-card{
  background:#141414;
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;overflow:hidden;cursor:pointer;
  position:relative;
  transition:transform .15s var(--ease),border-color .15s;
  animation:rowIn .32s var(--ease) both;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.item-card:active{transform:scale(.96);border-color:rgba(255,255,255,.1);}

/* art — square for music */
.card-art-wrap{position:relative;overflow:hidden;}
.card-art{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--card2);}
/* poster — 2:3 for shows */
.card-poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--card2);}

/* gradient on poster */
.card-poster-wrap{position:relative;overflow:hidden;}
.card-poster-wrap::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(9,9,9,.72) 0%,transparent 55%);
  pointer-events:none;
}

/* badge top-left */
.card-badge{
  position:absolute;top:7px;left:7px;z-index:3;
  padding:2px 8px;border-radius:6px;
  font-size:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.7);
}
.card-badge.music{background:rgba(0,200,150,.18);border-color:rgba(0,200,150,.14);color:#4dd9b0;}
.card-badge.movie{background:rgba(255,200,50,.16);border-color:rgba(255,200,50,.12);color:#ffd866;}
.card-badge.series{background:rgba(50,200,255,.18);border-color:rgba(50,200,255,.14);color:#66d9ff;}
.card-badge.anime{background:rgba(255,70,150,.2);border-color:rgba(255,70,150,.16);color:#ff6b9d;}

/* rating bottom-right */
.card-rating{
  position:absolute;bottom:8px;right:8px;z-index:3;
  padding:2px 8px;border-radius:6px;font-size:.52rem;font-weight:700;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.72);
}

/* play btn bottom-right for music */
.card-play{
  position:absolute;bottom:8px;right:8px;z-index:3;
  width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.66rem;cursor:pointer;
  transition:background .18s,transform .15s;
}
.card-play:active{transform:scale(.85);}
.card-play.playing{background:var(--accent);border-color:var(--accent);}

/* remove btn — visible in edit mode */
.card-remove{
  position:absolute;top:6px;right:6px;z-index:10;
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,59,48,.9);
  display:none;align-items:center;justify-content:center;
  color:#fff;font-size:.58rem;cursor:pointer;
  transition:transform .15s;
}
.card-remove:active{transform:scale(.85);}
.edit-mode .card-remove{display:flex;}
.edit-mode .card-play,.edit-mode .card-rating{opacity:0;pointer-events:none;}

/* card info */
.card-info{padding:9px 10px 11px;}
.card-title{font-size:.72rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.card-sub{font-size:.58rem;color:rgba(255,255,255,.35);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:.52rem;font-weight:600;color:rgba(255,255,255,.18);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

/* ── EMPTY ── */
.empty{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:48px 20px;gap:10px;
  color:rgba(255,255,255,.18);text-align:center;
  grid-column:1/-1;
}
.empty i{font-size:1.8rem;opacity:.2;}
.empty p{font-size:.76rem;}
.empty span{font-size:.6rem;color:rgba(255,255,255,.1);margin-top:2px;}

/* ── ADD BUTTON ── */
.add-fab{
  position:fixed;bottom:20px;right:20px;z-index:80;
  width:52px;height:52px;border-radius:16px;
  background:#fff;color:#090909;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;cursor:pointer;
  box-shadow:0 4px 20px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.4);
  transition:transform .18s var(--spring),opacity .18s;
  animation:slideUp .5s var(--spring) .2s both;
}
.add-fab:active{transform:scale(.9);}
.add-fab.hidden{opacity:0;pointer-events:none;transform:scale(.8);}

/* ── PLAYER BAR ── */
.player-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:420px;
  background:rgba(20,20,20,.95);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,.07);border-radius:20px;
  padding:10px 14px 10px 12px;
  display:flex;align-items:center;gap:12px;
  z-index:90;
  box-shadow:0 4px 32px rgba(0,0,0,.7);
  transition:transform .32s var(--ease),opacity .32s var(--ease);
}
.player-bar.hidden{transform:translateX(-50%) translateY(90px);opacity:0;pointer-events:none;}
.pb-progress{position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:0 0 20px 20px;overflow:hidden;background:rgba(255,255,255,.06);}
.pb-fill{height:100%;width:0%;background:#fff;border-radius:0 0 20px 20px;transition:width .3s linear;}
.pb-art{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid rgba(255,255,255,.06);}
.pb-info{flex:1;min-width:0;}
.pb-title{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pb-artist{font-size:.58rem;color:rgba(255,255,255,.36);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pb-time{font-size:.5rem;font-weight:600;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:30px;text-align:right;}
.pb-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.pb-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:.8rem;cursor:pointer;padding:4px;display:flex;align-items:center;transition:color .15s,transform .15s;}
.pb-btn:active{transform:scale(.82);}
.pb-play{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.92);color:#090909;font-size:.7rem;
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s;
}
.pb-play:active{transform:scale(.88);}

/* ── SEARCH OVERLAY — same as college search in profile ── */
.search-overlay{
  position:fixed;inset:0;z-index:900;background:var(--bg);
  display:none;flex-direction:column;
}
.search-overlay.open{display:flex;animation:searchUp .42s var(--spring) forwards;}
.search-overlay.closing{display:flex;animation:searchDown .34s var(--spring) forwards;}

.search-top{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:rgba(9,9,9,.8);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
.search-back{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.82rem;cursor:pointer;flex-shrink:0;
}
.search-bar{
  flex:1;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:10px 13px;transition:border-color .2s;
}
.search-bar:focus-within{border-color:rgba(255,255,255,.2);}
.search-bar i{color:rgba(255,255,255,.28);font-size:.82rem;flex-shrink:0;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:var(--font);font-size:.88rem;caret-color:#fff;}
.search-input::placeholder{color:rgba(255,255,255,.22);}

.search-type-row{
  display:flex;gap:3px;padding:10px 16px 8px;flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;
}
.s-type{
  flex-shrink:0;padding:7px 14px;
  font-size:.65rem;font-weight:600;
  color:rgba(255,255,255,.3);cursor:pointer;
  border-radius:10px;border:1px solid rgba(255,255,255,.06);
  transition:all .18s;white-space:nowrap;
}
.s-type.active{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.12);}
.s-type:active{transform:scale(.95);}

.search-results{flex:1;overflow-y:auto;padding:4px 16px 40px;}
.s-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;animation:rowIn .22s var(--ease) both;
}
.s-item:last-child{border-bottom:none;}
.s-item:active{opacity:.7;}
.s-img{width:46px;height:62px;border-radius:9px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid rgba(255,255,255,.06);}
.s-img.sq{height:46px;border-radius:10px;}
.s-info{flex:1;min-width:0;}
.s-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-sub{font-size:.62rem;color:rgba(255,255,255,.35);margin-top:3px;}
.s-meta{font-size:.56rem;color:rgba(255,255,255,.18);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;}
.s-add{
  width:30px;height:30px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.5);font-size:.72rem;flex-shrink:0;
  cursor:pointer;transition:all .15s;
}
.s-add:active{transform:scale(.88);}
.s-add.added{background:rgba(0,200,100,.14);border-color:rgba(0,200,100,.2);color:#4dda90;}
.s-loading{padding:32px;text-align:center;color:rgba(255,255,255,.2);font-size:.76rem;}
.s-empty{display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:10px;color:rgba(255,255,255,.18);}
.s-empty i{font-size:1.8rem;opacity:.2;}
.s-empty p{font-size:.76rem;}
</style>
</head>
<body>

<div class="page" id="page">

  <!-- WALLPAPER — same as profile -->
  <div class="wallpaper">
    <img id="wp-img" src="" alt="">
    <div class="wallpaper-fade"></div>
    <div class="top-bar">
      <div class="tb-back" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="tb-title">Favourites</div>
      <div class="tb-edit" id="tb-edit" onclick="toggleEdit()"><i class="fa-solid fa-pen"></i></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" data-tab="music" onclick="switchTab('music')"><i class="fa-solid fa-music"></i>Music</div>
      <div class="tab" data-tab="shows" onclick="switchTab('shows')"><i class="fa-solid fa-clapperboard"></i>Shows</div>
    </div>

    <!-- MUSIC PANEL -->
    <div class="panel active" id="panel-music">
      <span class="section-lbl">Tracks</span>
      <div class="grid-3" id="grid-tracks"></div>
      <span class="section-lbl">Albums</span>
      <div class="grid-3" id="grid-albums"></div>
    </div>

    <!-- SHOWS PANEL -->
    <div class="panel" id="panel-shows">
      <div class="sub-tabs">
        <div class="sub-tab active" data-sub="movies" onclick="switchSub('movies')">Movies</div>
        <div class="sub-tab" data-sub="series" onclick="switchSub('series')">Series</div>
        <div class="sub-tab" data-sub="anime" onclick="switchSub('anime')">Anime</div>
      </div>
      <div class="grid-2" id="grid-shows"></div>
    </div>

  </div>

  <!-- ADD FAB -->
  <div class="add-fab" id="add-fab" onclick="openSearch()"><i class="fa-solid fa-plus"></i></div>

  <!-- PLAYER BAR -->
  <div class="player-bar hidden" id="player-bar">
    <div class="pb-progress"><div class="pb-fill" id="pb-fill"></div></div>
    <img class="pb-art" id="pb-art" src="" alt="">
    <div class="pb-info"><div class="pb-title" id="pb-title">—</div><div class="pb-artist" id="pb-artist">—</div></div>
    <div class="pb-time" id="pb-time">0:00</div>
    <div class="pb-controls">
      <button class="pb-btn" onclick="prevTrack()"><i class="fa-solid fa-backward"></i></button>
      <button class="pb-play" id="pb-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="pb-icon"></i></button>
      <button class="pb-btn" onclick="nextTrack()"><i class="fa-solid fa-forward"></i></button>
    </div>
  </div>

</div>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="search-overlay">
  <div class="search-top">
    <div class="search-back" onclick="closeSearch()"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="search-input" id="s-input" type="text" placeholder="Search…" autocomplete="off" oninput="onSearch(this.value)">
    </div>
  </div>
  <div class="search-type-row">
    <div class="s-type active" data-stype="tracks" onclick="switchSType('tracks')">Tracks</div>
    <div class="s-type" data-stype="albums" onclick="switchSType('albums')">Albums</div>
    <div class="s-type" data-stype="movies" onclick="switchSType('movies')">Movies</div>
    <div class="s-type" data-stype="series" onclick="switchSType('series')">Series</div>
    <div class="s-type" data-stype="anime" onclick="switchSType('anime')">Anime</div>
  </div>
  <div class="search-results" id="s-results">
    <div class="s-empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add favourites</p></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script src="xos-favourites-data.js"></script>
<script>
/* ════════════════════════════════
   XOS FAVOURITES ENGINE
════════════════════════════════ */
const params = new URLSearchParams(location.search);
const USERID = params.get('user') || 'nikhil';

// Seed defaults on first load
window.XOS_FAV.seedDefaults(USERID);

// State
let currentTab = 'music';
let currentSub = 'movies';
let sType = 'tracks';
let editMode = false;
let searchOpen = false;
let sTimer = null;

// Music player state
const audio = document.getElementById('audio');
let queue = [], qIdx = -1, playing = false, pTimer = null;

/* ── WALLPAPER ── */
(function(){
  // Try to get banner from profiles
  const banner = localStorage.getItem(`xos_edit_banner_${USERID}`) ||
    (window.XOS_PROFILES && window.XOS_PROFILES[USERID]?.banner) || '';
  const wp = document.getElementById('wp-img');
  if(banner){ wp.src=JSON.parse(banner)||banner; }
  else {
    const fallbacks=['https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80','https://images.unsplash.com/photo-1470071459604-7b5ec3d8b6d4?w=800&q=80'];
    wp.src=fallbacks[Math.floor(Math.random()*fallbacks.length)];
  }
})();

/* ── TABS ── */
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.id==='panel-'+t));
  if(t==='shows') renderShows();
  else renderMusic();
}
function switchSub(s){
  currentSub=s;
  document.querySelectorAll('.sub-tab').forEach(el=>el.classList.toggle('active',el.dataset.sub===s));
  renderShows();
}

/* ── RENDER MUSIC ── */
function renderMusic(){
  renderTracks(); renderAlbums();
}
function renderTracks(){
  const tracks = window.XOS_FAV.get(USERID,'tracks');
  const el = document.getElementById('grid-tracks');
  el.innerHTML = tracks.length ? tracks.map((t,i)=>`
    <div class="item-card" style="animation-delay:${i*30}ms">
      <div class="card-art-wrap">
        <img class="card-art" src="${t.artwork}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x400/141414/444?text=♪'">
        <div class="card-badge music">${t.genre||'Track'}</div>
        <div class="card-play ${qIdx===i&&playing?'playing':''}" id="cp-${i}" onclick="event.stopPropagation();playTrack(${i})">
          <i class="fa-solid ${qIdx===i&&playing?'fa-pause':'fa-play'}"></i>
        </div>
        <div class="card-remove" onclick="event.stopPropagation();removeItem('tracks','${t.id}')"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="card-info">
        <div class="card-title">${t.title}</div>
        <div class="card-sub">${t.artist}</div>
        <div class="card-meta">${t.year||''}</div>
      </div>
    </div>`).join('')
    : '<div class="empty"><i class="fa-solid fa-music"></i><p>No tracks yet</p><span>Tap + to add</span></div>';
}
function renderAlbums(){
  const albums = window.XOS_FAV.get(USERID,'albums');
  const el = document.getElementById('grid-albums');
  el.innerHTML = albums.length ? albums.map((a,i)=>`
    <div class="item-card" style="animation-delay:${i*30}ms">
      <div class="card-art-wrap">
        <img class="card-art" src="${a.artwork}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x400/141414/444?text=💿'">
        <div class="card-badge music">${a.trackCount?a.trackCount+' tracks':'Album'}</div>
        <div class="card-remove" onclick="event.stopPropagation();removeItem('albums','${a.id}')"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="card-info">
        <div class="card-title">${a.title}</div>
        <div class="card-sub">${a.artist}</div>
        <div class="card-meta">${a.year||''}</div>
      </div>
    </div>`).join('')
    : '<div class="empty"><i class="fa-solid fa-compact-disc"></i><p>No albums yet</p></div>';
}

/* ── RENDER SHOWS ── */
function renderShows(){
  const data = window.XOS_FAV.get(USERID, currentSub);
  const el = document.getElementById('grid-shows');
  const typeClass = currentSub==='movies'?'movie':currentSub==='series'?'series':'anime';
  el.innerHTML = data.length ? data.map((item,i)=>`
    <div class="item-card" style="animation-delay:${i*35}ms">
      <div class="card-poster-wrap">
        <img class="card-poster" src="${item.artwork}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x600/141414/444?text=🎬'">
        <div class="card-badge ${typeClass}">${typeClass.charAt(0).toUpperCase()+typeClass.slice(1)}</div>
        <div class="card-rating">⭐ ${item.rating||'—'}</div>
        <div class="card-remove" onclick="event.stopPropagation();removeItem('${currentSub}','${item.id}')"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="card-info">
        <div class="card-title">${item.title}</div>
        <div class="card-sub">${item.subtitle||''}</div>
        <div class="card-meta">${item.year||''}</div>
      </div>
    </div>`).join('')
    : `<div class="empty"><i class="fa-solid fa-film"></i><p>No ${currentSub} yet</p><span>Tap + to add</span></div>`;
}

/* ── EDIT MODE ── */
function toggleEdit(){
  editMode=!editMode;
  document.getElementById('content').classList.toggle('edit-mode',editMode);
  const btn=document.getElementById('tb-edit');
  btn.classList.toggle('active',editMode);
  btn.innerHTML=editMode?'<i class="fa-solid fa-check"></i>':'<i class="fa-solid fa-pen"></i>';
  document.getElementById('add-fab').classList.toggle('hidden',!editMode);
  if(editMode) openSearch();
}

function removeItem(type,id){
  window.XOS_FAV.remove(USERID,type,id);
  if(type==='tracks'||type==='albums') renderMusic();
  else renderShows();
}

/* ── SEARCH ── */
function openSearch(){
  // auto set search type based on tab/sub
  if(currentTab==='music') switchSType('tracks');
  else switchSType(currentSub);
  searchOpen=true;
  const el=document.getElementById('search-overlay');
  el.style.display='flex';el.classList.remove('closing');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  setTimeout(()=>document.getElementById('s-input').focus(),400);
  history.pushState({modal:'search'},'');
}
function closeSearch(){
  if(!searchOpen) return;
  searchOpen=false;
  const el=document.getElementById('search-overlay');
  el.classList.remove('open');el.classList.add('closing');
  history.back();
  setTimeout(()=>{el.style.display='none';el.classList.remove('closing');document.getElementById('s-input').value='';},360);
}
function switchSType(t){
  sType=t;
  document.querySelectorAll('.s-type').forEach(el=>el.classList.toggle('active',el.dataset.stype===t));
  const q=document.getElementById('s-input').value.trim();
  if(q) doSearch(q);
  else document.getElementById('s-results').innerHTML='<div class="s-empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add favourites</p></div>';
}
function onSearch(val){
  clearTimeout(sTimer);
  const el=document.getElementById('s-results');
  if(!val.trim()){el.innerHTML='<div class="s-empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add favourites</p></div>';return;}
  el.innerHTML='<div class="s-loading">Searching…</div>';
  sTimer=setTimeout(()=>doSearch(val.trim()),420);
}
async function doSearch(q){
  const el=document.getElementById('s-results');
  try{
    if(sType==='tracks'||sType==='albums'){
      const entity=sType==='albums'?'album':'song';
      const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=${entity}&limit=10&media=music`);
      const d=await r.json();
      const results=d.results||[];
      if(!results.length){el.innerHTML='<div class="s-empty"><i class="fa-solid fa-face-meh"></i><p>No results</p></div>';return;}
      el.innerHTML=results.map((item,i)=>{
        const isTrack=sType==='tracks';
        const id='it_'+String(isTrack?item.trackId:item.collectionId);
        const already=window.XOS_FAV.has(USERID,sType,id);
        const art=(item.artworkUrl100||'').replace('100x100','400x400');
        const title=isTrack?item.trackName:item.collectionName||'—';
        const sub=item.artistName||'—';
        const meta=isTrack?(item.primaryGenreName||''):`${item.trackCount||'?'} tracks`;
        const year=item.releaseDate?item.releaseDate.substring(0,4):'';
        const data=JSON.stringify({id,title,artist:sub,artwork:art,stream:item.previewUrl||'',year,genre:item.primaryGenreName||'',trackCount:item.trackCount||0});
        return `<div class="s-item" style="animation-delay:${i*28}ms">
          <img class="s-img sq" src="${art}" alt="" onerror="this.src='https://placehold.co/46x46/141414/444?text=♪'">
          <div class="s-info"><div class="s-title">${esc(title)}</div><div class="s-sub">${esc(sub)}</div><div class="s-meta">${esc(meta)}${year?' · '+year:''}</div></div>
          <div class="s-add ${already?'added':''}" onclick="addItem('${sType}','${encodeURIComponent(data)}',this)"><i class="fa-solid ${already?'fa-check':'fa-plus'}"></i></div>
        </div>`;
      }).join('');
    } else {
      const typeMap={movies:'movie',series:'tv',anime:'tv'};
      const tmdbType=typeMap[sType]||'movie';
      const query=sType==='anime'?q+' anime':q;
      const r=await fetch(`https://api.themoviedb.org/3/search/${tmdbType}?api_key=4f4e4e4f4e4e4f4e4f4e4f4e4f4e4f4e&query=${encodeURIComponent(query)}&include_adult=false`);
      const d=await r.json();
      const results=(d.results||[]).slice(0,10);
      if(!results.length){el.innerHTML='<div class="s-empty"><i class="fa-solid fa-face-meh"></i><p>No results</p></div>';return;}
      el.innerHTML=results.map((item,i)=>{
        const id='tmdb_'+item.id;
        const already=window.XOS_FAV.has(USERID,sType,id);
        const title=item.title||item.name||'—';
        const year=(item.release_date||item.first_air_date||'').substring(0,4);
        const rating=item.vote_average?item.vote_average.toFixed(1):'—';
        const art=item.poster_path?`https://image.tmdb.org/t/p/w342${item.poster_path}`:'https://placehold.co/46x62/141414/444?text=🎬';
        const sub=item.overview?(item.overview.substring(0,50)+'…'):'';
        const data=JSON.stringify({id,title,subtitle:sub,artwork:art,year,rating,type:sType});
        return `<div class="s-item" style="animation-delay:${i*28}ms">
          <img class="s-img" src="${art}" alt="" onerror="this.src='https://placehold.co/46x62/141414/444?text=🎬'">
          <div class="s-info"><div class="s-title">${esc(title)}</div><div class="s-sub">⭐ ${rating}</div><div class="s-meta">${sType}${year?' · '+year:''}</div></div>
          <div class="s-add ${already?'added':''}" onclick="addItem('${sType}','${encodeURIComponent(data)}',this)"><i class="fa-solid ${already?'fa-check':'fa-plus'}"></i></div>
        </div>`;
      }).join('');
    }
  }catch(e){el.innerHTML='<div class="s-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Search failed</p></div>';}
}

function addItem(type,encoded,btn){
  if(btn.classList.contains('added')) return;
  const item=JSON.parse(decodeURIComponent(encoded));
  window.XOS_FAV.add(USERID,type,item);
  btn.classList.add('added');
  btn.innerHTML='<i class="fa-solid fa-check"></i>';
  if(type==='tracks'||type==='albums') renderMusic();
  else if(currentTab==='shows'&&currentSub===type) renderShows();
}

function esc(s){ return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ── MUSIC PLAYER ── */
function playTrack(i){
  const tracks=window.XOS_FAV.get(USERID,'tracks');
  if(!tracks[i]) return;
  if(qIdx===i&&playing){pauseAudio();return;}
  if(qIdx===i&&!playing){resumeAudio();return;}
  qIdx=i; queue=tracks;
  loadTrack(tracks[i]);
}

function loadTrack(t){
  audio.src=t.stream||''; audio.load();
  audio.play().catch(()=>{});
  playing=true;
  document.getElementById('pb-art').src=t.artwork||'';
  document.getElementById('pb-title').textContent=t.title||'—';
  document.getElementById('pb-artist').textContent=t.artist||'—';
  document.getElementById('pb-icon').className='fa-solid fa-pause';
  document.getElementById('player-bar').classList.remove('hidden');
  document.getElementById('add-fab').style.bottom='88px';
  startProg(); updatePlayBtns();
}

function pauseAudio(){audio.pause();playing=false;document.getElementById('pb-icon').className='fa-solid fa-play';clearInterval(pTimer);updatePlayBtns();}
function resumeAudio(){audio.play().catch(()=>{});playing=true;document.getElementById('pb-icon').className='fa-solid fa-pause';startProg();updatePlayBtns();}
function togglePlay(){if(qIdx===-1){playTrack(0);return;}playing?pauseAudio():resumeAudio();}
function nextTrack(){if(!queue.length)return;qIdx=(qIdx+1)%queue.length;loadTrack(queue[qIdx]);}
function prevTrack(){if(!queue.length)return;qIdx=(qIdx-1+queue.length)%queue.length;loadTrack(queue[qIdx]);}

function updatePlayBtns(){
  document.querySelectorAll('[id^="cp-"]').forEach(el=>{
    const i=parseInt(el.id.replace('cp-',''));
    const active=i===qIdx&&playing;
    el.classList.toggle('playing',active);
    el.innerHTML=`<i class="fa-solid ${active?'fa-pause':'fa-play'}"></i>`;
  });
}

function startProg(){
  clearInterval(pTimer);
  pTimer=setInterval(()=>{
    if(!audio.duration||isNaN(audio.duration))return;
    const pct=(audio.currentTime/audio.duration)*100;
    document.getElementById('pb-fill').style.width=pct+'%';
    document.getElementById('pb-time').textContent=fmt(audio.currentTime);
  },250);
}
function fmt(s){if(!s||isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
audio.addEventListener('ended',nextTrack);

/* ── BACK ── */
function goBack(){
  if(searchOpen){closeSearch();return;}
  if(history.length>1) history.back();
  else location.href='anush-decodes.html?user='+USERID;
}
window.addEventListener('popstate',()=>{if(searchOpen){closeSearch();return;}});

/* ── INIT ── */
document.addEventListener('DOMContentLoaded',()=>{
  renderMusic();
  renderShows();
  document.getElementById('add-fab').classList.remove('hidden');
});
</script>
</body>
</html>
