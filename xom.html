<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>XOS Music</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#000;--card:#0a0a0a;--card2:#111;--border:#1a1a1a;--border2:rgba(255,255,255,.07);
  --accent:#007aff;--text:#fff;--muted:#666;--muted2:#333;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.32,.72,0,1);
  --font:'Space Grotesk',sans-serif;--nav-h:70px;--mini-h:70px;--top-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;overflow:hidden;}
::-webkit-scrollbar{display:none;}

/* ── KEYFRAMES ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes eqBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.94)}}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:80;
  height:var(--top-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border2);
}
.top-brand{font-size:1.38rem;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;}
.top-brand i{color:var(--accent);font-size:1rem;}
.top-right{display:flex;align-items:center;gap:6px;}
.top-icon{
  width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.82rem;cursor:pointer;transition:.15s;
}
.top-icon:active{background:rgba(255,255,255,.1);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:80;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border2);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 14px;cursor:pointer;color:var(--muted);
  font-size:.56rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  transition:.18s;
}
.nav-item i{font-size:1.18rem;transition:.18s;}
.nav-item.active{color:var(--text);}
.nav-item:active{transform:scale(.88);}

/* ── PAGES ── */
.page{
  position:fixed;top:var(--top-h);left:0;right:0;
  bottom:calc(var(--nav-h) + var(--mini-h) + 8px);
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  display:none;
}
.page.active{display:block;animation:fadeUp .28s var(--ease);}

/* ══════════════════════════
   HOME PAGE
══════════════════════════ */

/* mood pills */
.mood-row{
  display:flex;gap:8px;padding:16px 16px 10px;
  overflow-x:auto;scrollbar-width:none;
}
.mood-chip{
  padding:8px 18px;border-radius:99px;
  background:var(--card);border:1px solid var(--border);
  font-size:.75rem;font-weight:600;color:var(--muted);
  white-space:nowrap;cursor:pointer;transition:.18s;flex-shrink:0;
}
.mood-chip.active{background:#fff;color:#000;border-color:#fff;}
.mood-chip:active{opacity:.7;}

/* section label */
.sec-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;
}
.sec-title{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;}
.sec-more{font-size:.72rem;color:var(--accent);font-weight:600;cursor:pointer;}

/* featured horiz scroll — tall cards */
.feat-row{
  display:flex;gap:12px;padding:0 16px 20px;
  overflow-x:auto;scrollbar-width:none;
  scroll-snap-type:x mandatory;
}
.feat-card{
  flex-shrink:0;width:72vw;max-width:290px;
  aspect-ratio:3/4;border-radius:22px;overflow:hidden;
  position:relative;cursor:pointer;scroll-snap-align:start;
  transition:transform .18s;background:var(--card);
}
.feat-card:active{transform:scale(.97);}
.feat-card img{width:100%;height:100%;object-fit:cover;display:block;}
.feat-gradient{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.88) 0%,transparent 55%);
}
.feat-info{position:absolute;bottom:16px;left:16px;right:16px;}
.feat-title{font-size:.95rem;font-weight:700;margin-bottom:3px;line-height:1.3;}
.feat-sub{font-size:.68rem;color:rgba(255,255,255,.6);}
.feat-play{
  position:absolute;top:12px;right:12px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.8rem;
}

/* album/song card */
.card-row{
  display:flex;gap:12px;padding:0 16px 20px;
  overflow-x:auto;scrollbar-width:none;
}
.alb-card{width:130px;flex-shrink:0;cursor:pointer;transition:transform .18s;}
.alb-card:active{transform:scale(.95);}
.alb-art{
  width:130px;height:130px;border-radius:14px;overflow:hidden;
  background:var(--card);margin-bottom:8px;position:relative;
}
.alb-art img{width:100%;height:100%;object-fit:cover;display:block;}
.alb-art-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:.18s;border-radius:14px;
}
.alb-card:active .alb-art-overlay{opacity:1;}
.alb-name{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alb-sub{font-size:.62rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* song list row */
.song-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;cursor:pointer;transition:background .14s;
}
.song-row:active{background:rgba(255,255,255,.04);}
.song-art{
  width:50px;height:50px;border-radius:10px;overflow:hidden;
  background:var(--card);flex-shrink:0;
}
.song-art img{width:100%;height:100%;object-fit:cover;display:block;}
.song-meta{flex:1;min-width:0;}
.song-name{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-artist{font-size:.66rem;color:var(--muted);margin-top:2px;}
.song-dur{font-size:.62rem;color:var(--muted2);font-family:monospace;flex-shrink:0;}
.song-more{color:var(--muted);font-size:.75rem;padding:6px;cursor:pointer;flex-shrink:0;}

/* now playing row eq */
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:14px;flex-shrink:0;}
.eq span{width:2.5px;background:var(--accent);border-radius:2px;transform-origin:bottom;
  animation:eqBar .7s infinite ease-in-out;}
.eq span:nth-child(1){animation-delay:0s;}
.eq span:nth-child(2){animation-delay:.15s;}
.eq span:nth-child(3){animation-delay:.3s;}
.eq.paused span{animation-play-state:paused;transform:scaleY(.3);}

/* artist round */
.artist-row{display:flex;gap:14px;padding:0 16px 20px;overflow-x:auto;scrollbar-width:none;}
.art-card{width:90px;flex-shrink:0;text-align:center;cursor:pointer;}
.art-img{
  width:90px;height:90px;border-radius:50%;overflow:hidden;
  background:var(--card);margin-bottom:7px;border:2px solid var(--border);
}
.art-img img{width:100%;height:100%;object-fit:cover;display:block;}
.art-name{font-size:.7rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* skeleton */
.skel{
  background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
  border-radius:10px;
}

/* ══════════════════════════
   SEARCH PAGE
══════════════════════════ */
.search-top{padding:14px 16px 0;}
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.07);border:1px solid var(--border2);
  border-radius:14px;padding:12px 14px;
}
.search-bar i{color:var(--muted);flex-shrink:0;font-size:.85rem;}
.search-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:.88rem;font-family:var(--font);
  caret-color:var(--accent);
}
.search-input::placeholder{color:var(--muted);}
.search-x{color:var(--muted);font-size:.78rem;cursor:pointer;opacity:0;transition:.18s;flex-shrink:0;}
.search-x.v{opacity:1;}

/* suggestions dropdown */
.suggest-box{
  position:absolute;top:calc(100% + 8px);left:16px;right:16px;
  background:rgba(12,12,12,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border2);border-radius:18px;
  overflow:hidden;z-index:200;
  box-shadow:0 20px 50px rgba(0,0,0,.8);
  display:none;
}
.suggest-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;cursor:pointer;transition:background .14s;
  border-bottom:1px solid var(--border2);
}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:active{background:rgba(255,255,255,.05);}
.suggest-img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--card);}
.suggest-name{font-size:.8rem;font-weight:600;}
.suggest-artist{font-size:.65rem;color:var(--muted);margin-top:1px;}
.suggest-icon{color:var(--muted);font-size:.72rem;flex-shrink:0;}

/* genre grid */
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px;}
.genre-tile{
  height:86px;border-radius:18px;
  display:flex;align-items:flex-end;padding:12px;
  cursor:pointer;overflow:hidden;position:relative;
  transition:transform .18s;
}
.genre-tile:active{transform:scale(.96);}
.genre-name{font-size:.84rem;font-weight:700;position:relative;z-index:1;}
.genre-tile::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04),transparent);
}

/* results list in search */
.results-list{padding:10px 0 0;}
.results-label{font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:4px 16px 10px;}

/* ══════════════════════════
   LIBRARY PAGE
══════════════════════════ */
.lib-wrap{padding:16px;}
.lib-sec-title{
  font-size:.62rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;
}
.lib-add{
  width:26px;height:26px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.68rem;cursor:pointer;
}
.pl-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border2);cursor:pointer;
}
.pl-art{
  width:52px;height:52px;border-radius:12px;overflow:hidden;
  background:var(--card);flex-shrink:0;position:relative;
}
.pl-art img{width:100%;height:100%;object-fit:cover;display:block;}
.pl-art.icon-art{
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;
}
.pl-meta{flex:1;}
.pl-name{font-size:.84rem;font-weight:600;margin-bottom:2px;}
.pl-sub{font-size:.65rem;color:var(--muted);}
.pl-chevron{color:var(--muted2);font-size:.72rem;flex-shrink:0;}

/* liked songs row */
.liked-gradient{background:linear-gradient(135deg,#1e3a8a,#7c3aed);}

/* ══════════════════════════
   MINI PLAYER
══════════════════════════ */
.mini-player{
  position:fixed;
  left:8px;right:8px;
  bottom:calc(var(--nav-h) + 8px);
  z-index:70;
  height:var(--mini-h);
  background:rgba(22,22,24,.96);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  display:none;
  align-items:center;
  padding:0 14px;gap:12px;
  cursor:pointer;
  box-shadow:0 10px 40px rgba(0,0,0,.7);
  transition:transform .18s;
}
.mini-player:active{transform:scale(.98);}
.mini-art{
  width:46px;height:46px;border-radius:10px;
  overflow:hidden;flex-shrink:0;background:var(--card);
}
.mini-art img{width:100%;height:100%;object-fit:cover;display:block;}
.mini-meta{flex:1;min-width:0;}
.mini-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:.64rem;color:var(--muted);margin-top:2px;}
.mini-controls{display:flex;align-items:center;gap:4px;}
.mini-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:.9rem;cursor:pointer;
  border-radius:10px;transition:.15s;
}
.mini-btn:active{background:rgba(255,255,255,.1);}
.mini-prog-wrap{
  position:absolute;bottom:0;left:14px;right:14px;
  height:2px;background:rgba(255,255,255,.1);border-radius:1px;overflow:hidden;
}
.mini-prog-bar{height:100%;background:var(--accent);border-radius:1px;width:0%;transition:width .5s linear;}

/* ══════════════════════════
   FULL PLAYER
══════════════════════════ */
.full-player{
  position:fixed;inset:0;z-index:300;
  background:var(--bg);
  display:none;flex-direction:column;
  transform:translateY(100%);
  will-change:transform;
  overflow:hidden;
}
.full-player.open{display:flex;animation:slideUp .42s var(--spring) forwards;}
.full-player.closing{display:flex;animation:slideDown .36s var(--spring) forwards;}

.fp-blurbg{
  position:absolute;inset:-30px;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(50px) saturate(1.6);opacity:.22;
  transition:background-image .5s;
}

.fp-inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:0 24px 32px;overflow:hidden;}

/* handle */
.fp-handle{
  width:36px;height:4px;background:rgba(255,255,255,.2);
  border-radius:2px;margin:12px auto 6px;flex-shrink:0;cursor:grab;
}

/* header row */
.fp-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0 18px;flex-shrink:0;
}
.fp-down{
  width:36px;height:36px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:.85rem;cursor:pointer;transition:.15s;
}
.fp-down:active{background:rgba(255,255,255,.12);}
.fp-hdr-center{text-align:center;}
.fp-hdr-label{font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.fp-hdr-title{font-size:.76rem;font-weight:600;color:var(--text);margin-top:2px;}

/* art */
.fp-art{
  width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;
  background:var(--card);flex-shrink:0;
  box-shadow:0 28px 70px rgba(0,0,0,.8);
  margin-bottom:22px;
}
.fp-art img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s;}

/* info + action row */
.fp-info-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.fp-song-meta{flex:1;min-width:0;}
.fp-song-title{font-size:1.2rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fp-song-artist{font-size:.78rem;color:var(--muted);margin-top:4px;}
.fp-side-btns{display:flex;gap:8px;flex-shrink:0;margin-left:12px;margin-top:2px;}
.fp-side-btn{
  width:34px;height:34px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.8rem;cursor:pointer;transition:.15s;
}
.fp-side-btn:active{background:rgba(255,255,255,.14);}
.fp-side-btn.liked{color:#ff3b5c;}
.fp-side-btn.liked i{animation:heartPop .38s var(--ease);}

/* progress */
.fp-seek{
  width:100%;height:4px;-webkit-appearance:none;
  background:rgba(255,255,255,.15);border-radius:2px;
  outline:none;cursor:pointer;accent-color:#fff;
  margin-bottom:5px;
}
.fp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;}
.fp-times{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);font-family:monospace;margin-bottom:20px;}

/* controls */
.fp-ctrls{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.fp-ctrl{
  width:46px;height:46px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.92rem;cursor:pointer;transition:.15s;
}
.fp-ctrl:active{background:rgba(255,255,255,.14);}
.fp-ctrl.on{color:var(--text);background:rgba(255,255,255,.1);}
.fp-play{
  width:64px;height:64px;border-radius:20px;
  background:#fff;color:#000;font-size:1.25rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.18s;
  box-shadow:0 8px 28px rgba(255,255,255,.18);
}
.fp-play:active{transform:scale(.92);}

/* bottom pills */
.fp-pills{display:flex;gap:8px;}
.fp-pill{
  flex:1;padding:12px 0;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;
}
.fp-pill:active{background:rgba(255,255,255,.12);}
.fp-pill i{font-size:.78rem;}

/* toast */
.toast{
  position:fixed;top:calc(var(--top-h) + 10px);left:50%;
  transform:translateX(-50%) translateY(-10px);
  background:rgba(22,22,24,.95);border:1px solid var(--border2);
  border-radius:12px;padding:9px 18px;
  font-size:.76rem;font-weight:600;
  opacity:0;transition:.28s;pointer-events:none;z-index:500;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ══════ FULL PLAYER ══════ -->
<div class="full-player" id="full-player">
  <div class="fp-blurbg" id="fp-blurbg"></div>
  <div class="fp-inner">
    <div class="fp-handle" id="fp-handle"></div>

    <div class="fp-header">
      <div class="fp-down" onclick="closePlayer()"><i class="fa-solid fa-chevron-down"></i></div>
      <div class="fp-hdr-center">
        <div class="fp-hdr-label">Now Playing</div>
        <div class="fp-hdr-title" id="fp-hdr-title">—</div>
      </div>
      <div class="fp-down" style="opacity:0;pointer-events:none;"></div>
    </div>

    <div class="fp-art"><img id="fp-art-img" src="" alt=""></div>

    <div class="fp-info-row">
      <div class="fp-song-meta">
        <div class="fp-song-title" id="fp-song-title">—</div>
        <div class="fp-song-artist" id="fp-song-artist">—</div>
      </div>
      <div class="fp-side-btns">
        <div class="fp-side-btn" id="fp-like-btn" onclick="toggleLike()"><i class="fa-regular fa-heart"></i></div>
        <div class="fp-side-btn" onclick="shareNow()"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
      </div>
    </div>

    <input type="range" class="fp-seek" id="fp-seek" min="0" max="100" value="0" oninput="seekAudio(this.value)">
    <div class="fp-times"><span id="fp-cur">0:00</span><span id="fp-dur">0:30</span></div>

    <div class="fp-ctrls">
      <div class="fp-ctrl" id="ctrl-shuffle" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></div>
      <div class="fp-ctrl" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></div>

<script>
/* ══════════════════════════════════════
   DATA
══════════════════════════════════════ */
const MOODS=['Feel good','Romance','Relax','Energize','Focus','Party','Chill','Workout'];

const FEATURED=[
  {title:'Guns and Roses',artist:'Thaman S',art:'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/8e/b3/0e/8eb30e9a-3773-de30-5e9c-8d21fe820eb5/cover.jpg/400x400bb.jpg',query:'guns roses thaman'},

  {title:'Pushpa 2',artist:'Devi Sri Prasad',art:'https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/08/90/3d/08903d7f-95ac-2e89-0e3f-8d23c06e3f96/cover.jpg/400x400bb.jpg',query:'pushpa devi sri prasad'},

const TRENDING_QUERIES=['Kesariya','Husn Hania Anu Malik','Softly Karan Aujla','APT Bruno Mars','Die With A Smile','Espresso Sabrina','Levitating Dua Lipa','Blinding Lights'];

const ARTISTS=[
  {name:'Anirudh',img:'https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages116/v4/45/e0/de/45e0de3d-c2ce-3ef8-b4b1-f5ef7d4d7636/mi_image.png/200x200bb.jpg'},
  {name:'Arijit Singh',img:'https://is1-ssl.mzstatic.com/image/thumb/Features125/v4/8c/87/37/8c87377c-0b0f-f888-cbf3-e3aaf87e9d85/mzl.myzwakge.jpg/200x200bb.jpg'},
  {name:'A.R. Rahman',img:'https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages116/v4/70/8e/eb/708eeb9c-3218-7756-adc7-2eb2a8df8fe9/mi_image.png/200x200bb.jpg'},
  {name:'Pritam',img:'https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages126/v4/63/fc/e1/63fce19c-f0e8-0eb2-1c87-9bfa3e5f7afa/mi_image.png/200x200bb.jpg'},
  {name:'Dua Lipa',img:'https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages116/v4/00/83/08/0083084e-acbe-0f62-6527-4d57f8ebb5df/mi_image.png/200x200bb.jpg'},
  {name:'The Weeknd',img:'https://is1-ssl.mzstatic.com/image/thumb/AMCArtistImages116/v4/87/15/6b/87156b72-8ae3-3b5e-f96f-ea7a0c6a2f40/mi_image.png/200x200bb.jpg'},
];

const GENRES=[
  {name:'Bollywood',color:'linear-gradient(135deg,#7c2d12,#dc2626)'},
  {name:'Pop',color:'linear-gradient(135deg,#1e3a8a,#7c3aed)'},
  {name:'Hip Hop',color:'linear-gradient(135deg,#064e3b,#059669)'},
  {name:'Lo-fi',color:'linear-gradient(135deg,#1e1b4b,#4338ca)'},
  {name:'Tamil',color:'linear-gradient(135deg,#7c2d12,#b45309)'},
  {name:'Romance',color:'linear-gradient(135deg,#831843,#db2777)'},
  {name:'Workout',color:'linear-gradient(135deg,#1c1917,#78350f)'},
  {name:'Devotional',color:'linear-gradient(135deg,#14532d,#ca8a04)'},
];

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let currentTrack=null, queue=[], queueIdx=0;
let isPlaying=false, isShuffle=false, isRepeat=false;
let likedTracks=JSON.parse(localStorage.getItem('xos_liked')||'[]');
let recentTracks=JSON.parse(localStorage.getItem('xos_recent')||'[]');
let playerOpen=false;

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  buildMoods();
  buildFeatured();
  buildKeepListening();
  buildArtists();
  buildGenres();
  fetchTrending();
  updateLibrary();
  initSwipeDown();
  updateLikedCount();
});

/* ══════════════════════════════════════
   BUILD HOME
══════════════════════════════════════ */
function buildMoods(){
  const el=document.getElementById('mood-row');
  el.innerHTML=MOODS.map((m,i)=>
    `<div class="mood-chip${i===0?' active':''}" onclick="onMood(this,'${m}')">${m}</div>`
  ).join('');
}
function onMood(el,mood){
  document.querySelectorAll('.mood-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  fetchAndPopulateKeep(mood);
}

function buildFeatured(){
  const el=document.getElementById('feat-row');
  el.innerHTML=FEATURED.map((f,i)=>`
    <div class="feat-card" onclick="searchAndPlay('${f.query}','${f.title}')">
      <img src="${f.art}" alt="" onerror="this.style.opacity='.3'">
      <div class="feat-gradient"></div>
      <div class="feat-play"><i class="fa-solid fa-play" style="margin-left:2px;"></i></div>
      <div class="feat-info">
        <div class="feat-title">${f.title}</div>
        <div class="feat-sub">${f.artist}</div>
      </div>
    </div>
  `).join('');
}

function buildKeepListening(){
  fetchAndPopulate('trending indian songs 2024','keep-row');
}

function fetchAndPopulate(query, targetId, limit=8){
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=${limit}`)
    .then(r=>r.json())
    .then(d=>{
      const el=document.getElementById(targetId);
      if(!el||!d.results) return;
      el.innerHTML=d.results.map(t=>`
        <div class="alb-card" onclick="loadTrack(${JSON.stringify(t).replace(/"/g,'&quot;')})">
          <div class="alb-art">
            <img src="${t.artworkUrl100.replace('100x100','300x300')}" alt="" onerror="this.style.opacity='.3'">
            <div class="alb-art-overlay"><i class="fa-solid fa-play" style="color:#fff;font-size:1.2rem;"></i></div>
          </div>
          <div class="alb-name">${t.trackName}</div>
          <div class="alb-sub">${t.artistName}</div>
        </div>
      `).join('');
      if(targetId==='keep-row') queue=d.results;
    }).catch(()=>{});
}

function fetchAndPopulateKeep(mood){
  fetchAndPopulate(`${mood} songs hindi`,  'keep-row', 8);
}

function fetchTrending(){
  const query=TRENDING_QUERIES[Math.floor(Math.random()*TRENDING_QUERIES.length)];
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent('top hits 2024 india')}&entity=song&limit=6`)
    .then(r=>r.json())
    .then(d=>{
      const el=document.getElementById('trending-list');
      if(!el||!d.results) return;
      el.innerHTML=d.results.map((t,i)=>{
        const isNow=currentTrack&&currentTrack.trackId===t.trackId;
        return `<div class="song-row" id="trow-${t.trackId}" onclick='loadTrack(${JSON.stringify(t).replace(/'/g,"&#39;")})'>
          <div class="song-art"><img src="${t.artworkUrl60}" alt=""></div>
          <div class="song-meta">
            <div class="song-name">${t.trackName}</div>
            <div class="song-artist">${t.artistName}</div>
          </div>
          ${isNow?`<div class="eq${isPlaying?'':' paused'}"><span></span><span></span><span></span></div>`:`<div class="song-dur">${fmtMs(t.trackTimeMillis)}</div>`}
          <div class="song-more" onclick="event.stopPropagation();showToast('More options')"><i class="fa-solid fa-ellipsis-vertical"></i></div>
        </div>`;
      }).join('');
    }).catch(()=>{});
}

function buildArtists(){
  const el=document.getElementById('artist-row');
  el.innerHTML=ARTISTS.map(a=>`
    <div class="art-card" onclick="searchAndPlay('${a.name}','${a.name}')">
      <div class="art-img"><img src="${a.img}" alt="" onerror="this.style.display='none'"></div>
      <div class="art-name">${a.name}</div>
    </div>
  `).join('');
}

function buildGenres(){
  const el=document.getElementById('genre-grid');
  el.innerHTML=GENRES.map(g=>`
    <div class="genre-tile" style="background:${g.color};" onclick="searchByGenre('${g.name}')">
      <div class="genre-name">${g.name}</div>
    </div>
  `).join('');
}

/* ══════════════════════════════════════
   SEARCH — iTunes API
══════════════════════════════════════ */
let debounce=null;

function onSearchInput(val){
  const x=document.getElementById('search-x');
  x.classList.toggle('v', val.length>0);
  clearTimeout(debounce);
  if(val.length<2){
    hideSuggest();
    hideResults();
    return;
  }
  debounce=setTimeout(()=>fetchSuggestions(val), 280);
}

function fetchSuggestions(q){
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=5`)
    .then(r=>r.json())
    .then(d=>renderSuggestions(d.results||[]))
    .catch(()=>{});
}

function renderSuggestions(tracks){
  const box=document.getElementById('suggest-box');
  if(!tracks.length){box.style.display='none';return;}
  box.innerHTML=tracks.map(t=>`
    <div class="suggest-item" onclick="selectSuggestion('${t.trackName.replace(/'/g,"&#39;")} ${t.artistName.replace(/'/g,"&#39;")}')">
      <img class="suggest-img" src="${t.artworkUrl30}" alt="">
      <div style="flex:1;min-width:0;">
        <div class="suggest-name">${t.trackName}</div>
        <div class="suggest-artist">${t.artistName}</div>
      </div>
      <i class="fa-solid fa-arrow-up-left suggest-icon"></i>
    </div>
  `).join('');
  box.style.display='block';
}

function selectSuggestion(query){
  document.getElementById('search-input').value=query;
  hideSuggest();
  fetchResults(query);
}

function fetchResults(q){
  document.getElementById('genre-section').style.display='none';
  document.getElementById('search-results').style.display='block';
  document.getElementById('results-list').innerHTML=`<div style="text-align:center;padding:30px;color:var(--muted);"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=20`)
    .then(r=>r.json())
    .then(d=>{
      queue=d.results||[];
      renderResultsList(queue);
    }).catch(()=>{});
}

function renderResultsList(tracks){
  const el=document.getElementById('results-list');
  if(!tracks.length){el.innerHTML=`<div style="text-align:center;padding:30px;color:var(--muted);">No results found</div>`;return;}
  el.innerHTML=tracks.map((t,i)=>`
    <div class="song-row" onclick='loadTrackFromQueue(${i})'>
      <div class="song-art"><img src="${t.artworkUrl60}" alt=""></div>
      <div class="song-meta">
        <div class="song-name">${t.trackName}</div>
        <div class="song-artist">${t.artistName}</div>
      </div>
      <div class="song-dur">${fmtMs(t.trackTimeMillis)}</div>
      <div class="song-more" onclick="event.stopPropagation();showToast('More')"><i class="fa-solid fa-ellipsis-vertical"></i></div>
    </div>
  `).join('');
}

function loadTrackFromQueue(idx){
  queueIdx=idx;
  loadTrack(queue[idx]);
}

function clearSearch(){
  document.getElementById('search-input').value='';
  document.getElementById('search-x').classList.remove('v');
  hideSuggest();
  hideResults();
}
function hideSuggest(){document.getElementById('suggest-box').style.display='none';}
function hideResults(){
  document.getElementById('search-results').style.display='none';
  document.getElementById('genre-section').style.display='block';
}

function searchByGenre(genre){
  switchPage('search');
  document.getElementById('search-input').value=genre;
  document.getElementById('search-x').classList.add('v');
  fetchResults(genre+' songs');
}

function searchAndPlay(query, label){
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=10`)
    .then(r=>r.json())
    .then(d=>{
      if(d.results&&d.results.length){
        queue=d.results; queueIdx=0;
        loadTrack(d.results[0]);
      }
    }).catch(()=>{});
}

document.addEventListener('click',e=>{
  if(!document.getElementById('search-input').contains(e.target))
    hideSuggest();
});

/* ══════════════════════════════════════
   AUDIO ENGINE — iTunes 30s preview
══════════════════════════════════════ */
const engine=new Audio();
engine.preload='none';
let progressTimer=null;

engine.addEventListener('play',()=>{ isPlaying=true; updatePlayIcons(); });
engine.addEventListener('pause',()=>{ isPlaying=false; updatePlayIcons(); clearInterval(progressTimer); });
engine.addEventListener('ended',()=>{
  if(isRepeat){ engine.currentTime=0; engine.play(); return; }
  nextTrack();
});
engine.addEventListener('timeupdate',()=>{
  if(!engine.duration) return;
  const pct=(engine.currentTime/engine.duration)*100;
  document.getElementById('fp-seek').value=pct;
  document.getElementById('mini-prog').style.width=pct+'%';
  document.getElementById('fp-cur').textContent=fmtSec(engine.currentTime);
  document.getElementById('fp-dur').textContent=fmtSec(engine.duration);
});
engine.addEventListener('loadedmetadata',()=>{
  document.getElementById('fp-dur').textContent=fmtSec(engine.duration);
});

function startProgress(){
  clearInterval(progressTimer);
  progressTimer=setInterval(()=>{
    if(!engine.duration||engine.paused) return;
    const pct=(engine.currentTime/engine.duration)*100;
    document.getElementById('fp-seek').value=pct;
    document.getElementById('mini-prog').style.width=pct+'%';
    document.getElementById('fp-cur').textContent=fmtSec(engine.currentTime);
  },500);
}

function seekAudio(val){
  if(!engine.duration) return;
  engine.currentTime=(val/100)*engine.duration;
}

/* ══════════════════════════════════════
   PLAYBACK CONTROLS
══════════════════════════════════════ */
function loadTrack(track){
  if(!track) return;
  currentTrack=track;

  const idx=queue.findIndex(t=>t.trackId===track.trackId);
  if(idx>=0) queueIdx=idx;

  const art=track.artworkUrl100
    ?track.artworkUrl100.replace('100x100','600x600')
    :'';

  // update full player UI
  document.getElementById('fp-art-img').src=art;
  document.getElementById('fp-blurbg').style.backgroundImage=`url(${art})`;
  document.getElementById('fp-hdr-title').textContent=track.collectionName||track.trackName;
  document.getElementById('fp-song-title').textContent=track.trackName;
  document.getElementById('fp-song-artist').textContent=track.artistName;

  // update mini player
  document.getElementById('mini-art-img').src=art;
  document.getElementById('mini-title').textContent=track.trackName;
  document.getElementById('mini-artist').textContent=track.artistName;
  document.getElementById('mini-player').style.display='flex';

  // reset progress
  document.getElementById('fp-seek').value=0;
  document.getElementById('fp-cur').textContent='0:00';
  document.getElementById('fp-dur').textContent='0:00';
  document.getElementById('mini-prog').style.width='0%';

  updateLikeUI();
  addToRecent(track);
  updateLibrary();

  // play audio preview
  if(track.previewUrl){
    engine.src=track.previewUrl;
    engine.load();
    engine.play().catch(()=>{ showToast('Tap play ▶'); });
    startProgress();
  } else {
    showToast('No preview available');
  }
}

function togglePlay(){
  if(!currentTrack) return;
  if(engine.paused){ engine.play().catch(()=>{}); }
  else{ engine.pause(); }
}

function updatePlayIcons(){
  const icon=isPlaying?'fa-pause':'fa-play';
  document.getElementById('fp-play-icon').className=`fa-solid ${icon}`;
  document.getElementById('mini-play-icon').className=`fa-solid ${icon}`;
}

function nextTrack(){
  if(!queue.length) return;
  if(isShuffle) queueIdx=Math.floor(Math.random()*queue.length);
  else queueIdx=(queueIdx+1)%queue.length;
  loadTrack(queue[queueIdx]);
}

function prevTrack(){
  if(engine.currentTime>3){ engine.currentTime=0; return; }
  if(!queue.length) return;
  queueIdx=(queueIdx-1+queue.length)%queue.length;
  loadTrack(queue[queueIdx]);
}

function toggleShuffle(){
  isShuffle=!isShuffle;
  document.getElementById('ctrl-shuffle').classList.toggle('on',isShuffle);
  showToast(isShuffle?'Shuffle on':'Shuffle off');
}
function toggleRepeat(){
  isRepeat=!isRepeat;
  document.getElementById('ctrl-repeat').classList.toggle('on',isRepeat);
  showToast(isRepeat?'Repeat on':'Repeat off');
}

/* ══════════════════════════════════════
   LIKE
══════════════════════════════════════ */
function toggleLike(){
  if(!currentTrack) return;
  const id=currentTrack.trackId;
  const idx=likedTracks.findIndex(t=>t.trackId===id);
  if(idx>=0) likedTracks.splice(idx,1);
  else likedTracks.unshift(currentTrack);
  localStorage.setItem('xos_liked',JSON.stringify(likedTracks));
  updateLikeUI();
  updateLikedCount();
  showToast(idx>=0?'Removed from Liked':'Added to Liked ❤️');
}

function updateLikeUI(){
  if(!currentTrack) return;
  const liked=likedTracks.some(t=>t.trackId===currentTrack.trackId);
  const btn=document.getElementById('fp-like-btn');
  btn.classList.toggle('liked',liked);
  btn.querySelector('i').className=liked?'fa-solid fa-heart':'fa-regular fa-heart';
}

function updateLikedCount(){
  document.getElementById('liked-count').textContent=`${likedTracks.length} songs`;
}

/* ══════════════════════════════════════
   RECENT
══════════════════════════════════════ */
function addToRecent(track){
  recentTracks=recentTracks.filter(t=>t.trackId!==track.trackId);
  recentTracks.unshift(track);
  recentTracks=recentTracks.slice(0,20);
  localStorage.setItem('xos_recent',JSON.stringify(recentTracks));
}

function updateLibrary(){
  const el=document.getElementById('lib-recent');
  const sub=document.getElementById('recent-sub');
  if(sub) sub.textContent=`${recentTracks.length} songs`;
  if(!el) return;
  el.innerHTML=recentTracks.slice(0,8).map(t=>`
    <div class="song-row" onclick='loadTrack(${JSON.stringify(t).replace(/'/g,"&#39;")})'>
      <div class="song-art"><img src="${t.artworkUrl60}" alt=""></div>
      <div class="song-meta">
        <div class="song-name">${t.trackName}</div>
        <div class="song-artist">${t.artistName}</div>
      </div>
      <div class="song-dur">${fmtMs(t.trackTimeMillis)}</div>
    </div>
  `).join('');
}

/* ══════════════════════════════════════
   FULL PLAYER OPEN / CLOSE
══════════════════════════════════════ */
function openPlayer(){
  if(playerOpen) return;
  playerOpen=true;
  const el=document.getElementById('full-player');
  el.style.display='flex';
  el.classList.remove('closing');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  history.pushState({modal:'player'},'');
}

function closePlayer(fromPop){
  if(!playerOpen) return;
  playerOpen=false;
  const el=document.getElementById('full-player');
  el.classList.remove('open');
  el.classList.add('closing');
  if(!fromPop) history.back();
  setTimeout(()=>{el.style.display='none';el.classList.remove('closing');},380);
}

window.addEventListener('popstate',e=>{
  if(playerOpen) closePlayer(true);
});

/* ── swipe down to close ── */
function initSwipeDown(){
  const fp=document.getElementById('full-player');
  const handle=document.getElementById('fp-handle');
  let sy=0,dragging=false;
  fp.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;dragging=true;fp.style.transition='none';},{passive:true});
  fp.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dy=e.touches[0].clientY-sy;
    if(dy<0)return;
    fp.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  fp.addEventListener('touchend',e=>{
    if(!dragging)return;dragging=false;
    const dy=e.changedTouches[0].clientY-sy;
    fp.style.transition='';
    if(dy>100){fp.style.transform='';closePlayer();}
    else{fp.style.transform='';}
  },{passive:true});
}

/* ══════════════════════════════════════
   NAVIGATION
══════════════════════════════════════ */
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.getElementById(`nav-${page}`)?.classList.add('active');
}

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
function fmtSec(s){
  if(!s||isNaN(s))return'0:00';
  return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function fmtMs(ms){return fmtSec((ms||0)/1000);}

function shareNow(){
  if(navigator.share&&currentTrack)
    navigator.share({title:currentTrack.trackName,text:`Listening to ${currentTrack.trackName} by ${currentTrack.artistName} on XOS Music`});
  else showToast('Link copied!');
}

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
</script>
