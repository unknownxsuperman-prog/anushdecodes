<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Anush Decodes | x0s.link</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ══════════════════════════════════════════
   BASE / TOKENS
══════════════════════════════════════════ */
:root {
  --bg:        #000000;
  --card:      #0a0a0a;
  --card2:     #111111;
  --border:    #1a1a1a;
  --border2:   rgba(255,255,255,0.06);
  --accent:    #007aff;
  --text:      #ffffff;
  --muted:     #666666;
  --muted2:    #444444;
  --glass:     rgba(10,10,10,0.75);
  --font:      'Space Grotesk', sans-serif;
  
  /* Metallic Gold Gradient */
  --gold-shine: linear-gradient(
    45deg, 
    #BF953F 0%, 
    #FCF6BA 25%, 
    #B38728 50%, 
    #FBF5B7 75%, 
    #AA771C 100%
  );
}

.light-mode {
  --bg:     #ffffff;
  --card:   #f5f5f7;
  --card2:  #f0f0f2;
  --border: #e0e0e2;
  --border2:rgba(0,0,0,0.07);
  --text:   #000000;
  --muted:  #888888;
  --glass:  rgba(255,255,255,0.82);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.35s ease, color 0.35s ease;
}

/* ══════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════ */
@keyframes slideUp   { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes pulse     { 0%,100% { transform:scale(1); } 50% { transform:scale(0.92); } }
@keyframes shimmer   { 0% { left: -100%; } 100% { left: 100%; } }
@keyframes rotate    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.page { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

/* ══════════════════════════════════════════
   TOP BAR
══════════════════════════════════════════ */
.top-bar {
  position: sticky; top: 0; z-index: 80;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border2);
}
.top-bar-brand { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.top-bar-brand span { color: var(--accent); }
.menu-btn { width: 36px; height: 36px; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }

.dropdown-menu {
  position: absolute; top: 50px; right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 6px; display: none; z-index: 100;
  min-width: 170px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.dropdown-menu.active { display: block; }
.menu-item { padding: 10px 14px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-radius: 10px; transition: 0.2s; }
.menu-item:hover { background: var(--border); }
.menu-item i { color: var(--accent); }

/* ══════════════════════════════════════════
   BANNER & PROFILE
══════════════════════════════════════════ */
.banner { width: 100%; height: 200px; position: relative; overflow: hidden; background: linear-gradient(135deg, #000814 0%, #001d3d 60%, #000000 100%); }
.banner-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; }
.banner-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%); }

.profile-section { padding: 0 20px; margin-top: -52px; position: relative; animation: slideUp 0.6s cubic-bezier(0.4,0,0.2,1) both; }

.follow-btn {
  position: absolute; right: 20px; top: 65px;
  padding: 10px 30px; background: rgba(255,255,255,0.9);
  color: #000; border: none; border-radius: 30px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.follow-btn:active { transform: scale(0.95); }

/* SHINY GOLDEN BADGE CORE */
.avatar-wrap { width: 84px; height: 84px; position: relative; margin-bottom: 14px; }
.avatar-img { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; border: 1px solid var(--border); }

.pfp-badge {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  background: var(--bg);
  border-radius: 50%;
  border: 1.5px solid var(--bg);
  overflow: hidden; /* Clips the shimmer */
  animation: pulse 3s infinite ease-in-out;
}

/* The Icon with Gold Gradient */
.pfp-badge i.fa-certificate {
  font-size: 18px;
  position: absolute;
  background: var(--gold-shine);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 1px rgba(184, 134, 11, 0.5));
}

.pfp-badge i.fa-check {
  font-size: 8px;
  color: #000000;
  position: relative;
  z-index: 6;
  font-weight: 900;
}

/* The Shimmer Effect Layer */
.pfp-badge::after {
  content: "";
  position: absolute;
  top: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    120deg,
    rgba(255, 255, 255, 0) 30%,
    rgba(255, 255, 255, 0.8) 50%,
    rgba(255, 255, 255, 0) 70%
  );
  animation: shimmer 2s infinite linear;
  z-index: 7;
  pointer-events: none;
}

.name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.name { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }

.handle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.handle { font-size: 0.72rem; font-weight: 500; color: var(--accent); letter-spacing: 0.06em; }
.follower-stat { font-size: 0.72rem; color: var(--muted); display: flex; gap: 12px; }
.follower-stat b { color: var(--text); }

.bio { font-size: 0.82rem; color: var(--muted); font-weight: 300; line-height: 1.6; margin-bottom: 14px; }

/* Bio Music */
.bio-music { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 6px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 99px; }
.bio-music-play { width: 24px; height: 24px; background: rgba(0,122,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 0.58rem; cursor: pointer; }
.bio-music-label { font-size: 0.7rem; font-weight: 500; color: var(--text); }

.links-row { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.link-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--text); font-size: 0.72rem; font-weight: 600; white-space: nowrap; transition: 0.2s; }
.link-pill:active { transform: scale(0.96); }

/* ══════════════════════════════════════════
   POSTS
══════════════════════════════════════════ */
.posts-section { padding: 0 20px 100px; }
.section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 16px; display: block; }
.posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.post-thumb { aspect-ratio: 1/1; border-radius: 6px; overflow: hidden; background: var(--card); }
.post-thumb video, .post-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* ══════════════════════════════════════════
   MODALS
══════════════════════════════════════════ */
.music-modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.88); backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; transition: 0.3s; }
.music-modal.active { display: flex; }
.music-box { width: 82vw; max-width: 340px; background: #000; border: 1px solid var(--border); border-radius: 26px; padding: 24px 20px 28px; position: relative; }
.music-thumb-wrap { width: 100%; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; position: relative; margin-bottom: 18px; }
.music-play-circle { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
.music-title { font-size: 0.9rem; font-weight: 700; text-align: center; }
.music-artist { font-size: 0.68rem; color: var(--muted); text-align: center; margin-bottom: 16px; }
.music-progress { width: 100%; accent-color: var(--accent); margin-bottom: 16px; }

.color-instagram { color: #e1306c; } .color-twitter { color: #ffffff; } .color-linkedin { color: #0077b5; } .color-discord { color: #5865f2; }
</style>
</head>
<body>

<audio id="bio-audio" src="2FilesMerged_14032026.mp3" loop preload="auto"></audio>
<div id="youtube-player-container" style="display:none;position:absolute;"></div>

<div class="music-modal" id="music-modal" onclick="closeMusicModal()">
  <div class="music-box" onclick="event.stopPropagation()">
    <div class="music-thumb-wrap">
      <img id="music-thumb" style="width:100%;height:100%;object-fit:cover;">
      <div class="music-play-circle" id="music-play-pause"><i class="fa-solid fa-play" id="music-play-icon"></i></div>
    </div>
    <div class="music-title">Wait a Minute!</div>
    <div class="music-artist">Willow</div>
    <input type="range" class="music-progress" id="music-progress" value="0">
  </div>
</div>

<div class="page">
  <div class="top-bar">
    <div class="top-bar-brand">x<span>0</span>s.link</div>
    <div class="menu-btn" onclick="toggleMenu(event)"><i class="fa-solid fa-ellipsis-vertical"></i></div>
    <div class="dropdown-menu" id="dropdown-menu">
      <div class="menu-item" onclick="toggleDarkMode()">Appearance <i class="fa-solid fa-circle-half-stroke"></i></div>
    </div>
  </div>

  <div class="banner">
    <img class="banner-img" src="Picsart_26-04-18_23-43-21-546.jpg">
    <div class="banner-overlay"></div>
  </div>

  <section class="profile-section">
    <button class="follow-btn" id="follow-btn" onclick="toggleFollow()">Follow</button>
    
    <div class="avatar-wrap">
      <img class="avatar-img" src="Screenshot_20260418-234611.png">
      <div class="pfp-badge">
        <i class="fa-solid fa-certificate"></i>
        <i class="fa-solid fa-check"></i>
      </div>
    </div>

    <div class="name-row">
      <h1 class="name">Anush Decodes</h1>
    </div>
    
    <div class="handle-row">
      <div class="handle">anush@x0s</div>
      <div class="follower-stat">
        <span><b>350</b> following</span>
        <span><b id="follower-count">1.2k</b> followers</span>
      </div>
    </div>

    <p class="bio">Decoding logic at the kernel level.<br>Building the future one commit at a time.</p>

    <div class="bio-music">
      <div class="bio-music-play" onclick="toggleBioMusic(event)"><i class="fa-solid fa-play" id="bio-play-icon"></i></div>
      <div class="bio-music-label" onclick="openMusicPlayer()">Wait a Minute! • Willow</div>
    </div>

    <div class="links-row" id="links-row"></div>
  </section>

  <section class="posts-section">
    <span class="section-label">Posts</span>
    <div class="posts-grid" id="posts-grid"></div>
  </section>
</div>

<script>
/* UI LOGIC */
function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdown-menu').classList.toggle('active'); }
function toggleDarkMode() { document.body.classList.toggle('light-mode'); }
window.onclick = function() { document.getElementById('dropdown-menu').classList.remove('active'); }

/* FOLLOW LOGIC */
let followerBase = 1200;
let isFollowing = false;
function updateFollowUI() {
  document.getElementById('follower-count').innerText = (followerBase/1000).toFixed(1) + 'k';
  document.getElementById('follow-btn').innerText = isFollowing ? "Following" : "Follow";
}
function toggleFollow() { isFollowing = !isFollowing; followerBase += isFollowing ? 1 : -1; updateFollowUI(); }

/* RENDERING */
const LINKS = [
  { icon: 'fa-brands fa-instagram', label: 'Instagram', url: '#', color: 'color-instagram' },
  { icon: 'fa-brands fa-x-twitter', label: 'X', url: '#', color: 'color-twitter' },
  { icon: 'fa-brands fa-linkedin-in', label: 'LinkedIn', url: '#', color: 'color-linkedin' }
];
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('links-row').innerHTML = LINKS.map(l => `<a href="${l.url}" class="link-pill"><i class="${l.icon} ${l.color}"></i>${l.label}</a>`).join('');
  updateFollowUI();
});

/* MUSIC MODAL */
function openMusicPlayer() { 
  document.getElementById('music-modal').classList.add('active');
  document.getElementById('music-thumb').src = 'https://img.youtube.com/vi/h4OAXvDRZTY/maxresdefault.jpg';
}
function closeMusicModal() { document.getElementById('music-modal').classList.remove('active'); }
function toggleBioMusic(e) { e.stopPropagation(); const audio = document.getElementById('bio-audio'); const icon = document.getElementById('bio-play-icon'); if (audio.paused) { audio.play(); icon.className = 'fa-solid fa-pause'; } else { audio.pause(); icon.className = 'fa-solid fa-play'; } }
</script>
</body>
</html>
