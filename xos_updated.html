<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="page-title">XOS Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/xbit-proton/fa-arattai@latest/arattai.css">
    <style>
        :root {
            --bg: #000;--card: #0a0a0a;--card2: #111;--border: #1a1a1a;--border2: rgba(255,255,255,.06);
            --accent: #007aff;--text: #fff;--muted: #666;--muted2: #444;--glass: rgba(10,10,10,.75);
            --ease: cubic-bezier(.4,0,.2,1);--font: 'Space Grotesk',sans-serif;
            --badge-blue:#1d9bf0;--badge-green:#25D366;
        }
        .light-mode {--bg:#fff;--card:#f5f5f7;--card2:#f0f0f2;--border:#e0e0e2;--border2:rgba(0,0,0,.07);--text:#000;--muted:#888;--glass:rgba(255,255,255,.82);}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;transition:background .35s var(--ease),color .35s var(--ease);}
        ::-webkit-scrollbar{display:none;}

        /* ═══ ANIMATIONS ═══ */
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(.95)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes shimmer{0%{left:-100%}100%{left:200%}}
        @keyframes eqBar{from{height:2px}to{height:10px}}
        @keyframes likeHeartPop{0%{transform:scale(1)}30%{transform:scale(1.55)}60%{transform:scale(.88)}100%{transform:scale(1)}}
        @keyframes muteFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
        @keyframes dtFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}55%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
        @keyframes pfpIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
        @keyframes pfpOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.88)}}

        /* ═══ INDUSTRIAL BADGE ANIMATIONS ═══ */
        @keyframes goldRotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        @keyframes goldPulse{0%,100%{box-shadow:0 0 0 0 rgba(252,209,80,.0),0 0 6px 1px rgba(252,209,80,.18)}50%{box-shadow:0 0 0 2.5px rgba(252,209,80,.12),0 0 10px 3px rgba(252,209,80,.28)}}
        @keyframes bluePulse{0%,100%{box-shadow:0 0 0 0 rgba(29,155,240,.0),0 0 5px 1px rgba(29,155,240,.2)}50%{box-shadow:0 0 0 2px rgba(29,155,240,.18),0 0 8px 2px rgba(29,155,240,.32)}}
        @keyframes greenPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.0),0 0 5px 1px rgba(37,211,102,.18)}50%{box-shadow:0 0 0 2px rgba(37,211,102,.15),0 0 8px 2px rgba(37,211,102,.28)}}
        @keyframes badgeShimmer{0%{left:-120%}100%{left:160%}}
        @keyframes badgeAppear{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.18) rotate(4deg)}80%{transform:scale(.94)}100%{transform:scale(1) rotate(0deg);opacity:1}}

        /* ═══ GLASS OVERLAY ANIMATIONS ═══ */
        @keyframes glassSlideUp{from{transform:translateY(100%) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        @keyframes glassSlideDown{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(105%) scale(.96);opacity:0}}
        @keyframes liquidIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes rowFadeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
        @keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12px,-18px) scale(1.06)}}
        @keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14px,10px) scale(1.04)}}
        @keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8px,14px) scale(.96)}}

        /* ═══ LAYOUT ═══ */
        .page{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
        .top-bar{position:sticky;top:0;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(0,0,0,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);}
        .light-mode .top-bar{background:rgba(255,255,255,.72);border-bottom:1px solid var(--border);}
        .top-bar-brand{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:-.03em;color:#fff;line-height:1;}
        .top-bar-brand span{color:#fff;}
        .floating-menu-wrap{position:absolute;top:0;right:20px;z-index:90;}
        .floating-menu-wrap .menu-btn{background:rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);color:#fff;}
        .floating-menu-wrap .dropdown-menu{top:46px;}
        .menu-btn{width:36px;height:36px;background:var(--glass);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);position:relative;}
        .dropdown-menu{position:absolute;top:50px;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;display:none;z-index:100;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadeIn .2s var(--ease);}
        .dropdown-menu.active{display:block;}
        .menu-item{padding:10px 14px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-radius:10px;transition:.2s;}
        .menu-item:hover{background:var(--border);}
        .menu-item i{color:var(--accent);font-size:.85rem;}
        .banner{width:100%;height:200px;position:relative;overflow:hidden;background:linear-gradient(135deg,#000814 0%,#001d3d 60%,#000 100%);}
        .banner-img{width:100%;height:100%;object-fit:cover;opacity:.55;}
        .banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,var(--bg) 100%);}
        .profile-section{padding:0 20px;margin-top:-52px;position:relative;animation:slideUp .6s var(--ease) both;}
        .follow-btn{position:absolute;right:20px;top:65px;padding:10px 30px;background:rgba(255,255,255,.9);color:#000;border:none;border-radius:30px;font-size:.85rem;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 4px 15px rgba(0,0,0,.4);font-family:var(--font);outline:none;-webkit-appearance:none;}
        .follow-btn.following{background:var(--card);color:var(--text);border:1px solid var(--border);}
        .avatar-wrap{width:84px;height:84px;position:relative;margin-bottom:14px;cursor:pointer;}
        .avatar-wrap:active .avatar-img{transform:scale(.94);opacity:.85;}
        .avatar-img{width:100%;height:100%;border-radius:20px;object-fit:cover;border:1px solid var(--border);display:block;transition:transform .18s var(--ease),opacity .18s var(--ease);}

        /* ═══════════════════════════════════════════
           INDUSTRIAL VERIFICATION BADGES — REDESIGNED
        ═══════════════════════════════════════════ */

        /* GOLD / PREMIUM badge */
        .pfp-badge{
            position:absolute;bottom:-4px;right:-4px;
            width:22px;height:22px;
            display:flex;align-items:center;justify-content:center;
            z-index:5;border-radius:50%;
            cursor:default;
            animation:badgeAppear .5s cubic-bezier(.32,.72,0,1) both;
        }
        /* Gold ring outer glow */
        .pfp-badge.badge-gold,
        .pfp-badge:not(.badge-blue):not(.badge-green):not(.badge-none){
            background: conic-gradient(
                #BF953F 0%, #FCF6BA 18%, #B38728 36%,
                #FBF5B7 52%, #AA771C 68%, #FFD700 84%, #BF953F 100%
            );
            border:1.5px solid rgba(255,215,0,.35);
            animation:goldPulse 2.5s ease-in-out infinite, badgeAppear .5s cubic-bezier(.32,.72,0,1) both;
            box-shadow:
                0 0 0 1px rgba(252,209,80,.15),
                0 0 8px 2px rgba(252,209,80,.22),
                inset 0 1px 0 rgba(255,255,255,.35);
        }
        .pfp-badge.badge-gold::before,
        .pfp-badge:not(.badge-blue):not(.badge-green):not(.badge-none)::before{
            content:'';position:absolute;inset:2px;border-radius:50%;
            background:radial-gradient(circle at 40% 35%,#fffbe6 0%,#e8c24a 55%,#a07020 100%);
            z-index:0;
        }
        .pfp-badge .badge-icon-gold{
            position:relative;z-index:2;
            font-size:9px;color:#2a1a00;font-weight:900;
            text-shadow:0 .5px 0 rgba(255,255,255,.4);
        }
        /* Shimmer sweep on gold */
        .pfp-badge.badge-gold::after,
        .pfp-badge:not(.badge-blue):not(.badge-green):not(.badge-none)::after{
            content:'';position:absolute;top:-2px;left:-120%;width:60%;height:calc(100% + 4px);
            background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);
            border-radius:50%;
            animation:badgeShimmer 2.8s 1s infinite ease-in-out;
            z-index:3;pointer-events:none;overflow:hidden;
        }

        /* BLUE / Twitter-style badge */
        .pfp-badge.badge-blue{
            background:linear-gradient(145deg,#1da1f2 0%,#0d8bd9 50%,#1a7fc4 100%);
            border:1.5px solid rgba(29,161,242,.4);
            animation:bluePulse 2.8s ease-in-out infinite, badgeAppear .5s cubic-bezier(.32,.72,0,1) both;
            box-shadow:
                0 0 0 1px rgba(29,155,240,.2),
                0 0 7px 2px rgba(29,155,240,.28),
                inset 0 1px 0 rgba(255,255,255,.28);
        }
        .pfp-badge.badge-blue::before{
            content:'';position:absolute;inset:2px;border-radius:50%;
            background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.22) 0%,transparent 70%);
            z-index:0;
        }
        .pfp-badge.badge-blue .badge-icon-blue{
            position:relative;z-index:2;
            font-size:9px;color:#fff;font-weight:900;
            text-shadow:0 1px 2px rgba(0,0,100,.3);
        }
        .pfp-badge.badge-blue::after{
            content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
            background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.4) 50%,transparent 80%);
            border-radius:50%;
            animation:badgeShimmer 3.2s 1.5s infinite ease-in-out;
            z-index:3;pointer-events:none;
        }

        /* GREEN / WhatsApp-style badge */
        .pfp-badge.badge-green{
            background:linear-gradient(145deg,#2dd465 0%,#1da84a 50%,#17913e 100%);
            border:1.5px solid rgba(37,211,102,.4);
            animation:greenPulse 2.8s ease-in-out infinite, badgeAppear .5s cubic-bezier(.32,.72,0,1) both;
            box-shadow:
                0 0 0 1px rgba(37,211,102,.18),
                0 0 7px 2px rgba(37,211,102,.24),
                inset 0 1px 0 rgba(255,255,255,.24);
        }
        .pfp-badge.badge-green::before{
            content:'';position:absolute;inset:2px;border-radius:50%;
            background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.2) 0%,transparent 70%);
            z-index:0;
        }
        .pfp-badge.badge-green .badge-icon-green{
            position:relative;z-index:2;
            font-size:9px;color:#fff;font-weight:900;
            text-shadow:0 1px 2px rgba(0,60,0,.3);
        }
        .pfp-badge.badge-green::after{
            content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
            background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.38) 50%,transparent 80%);
            border-radius:50%;
            animation:badgeShimmer 3.6s 2s infinite ease-in-out;
            z-index:3;pointer-events:none;
        }

        .pfp-badge.badge-none{display:none;}

        /* Sheet verified inline badges — same industrial system */
        .sheet-verified{
            display:inline-flex;align-items:center;justify-content:center;
            width:14px;height:14px;border-radius:50%;
            position:relative;overflow:hidden;
            vertical-align:middle;margin-left:5px;
            flex-shrink:0;
        }
        .sheet-verified .badge-icon-gold,.sheet-verified .badge-icon-blue,.sheet-verified .badge-icon-green{
            font-size:7px;font-weight:900;position:relative;z-index:2;
        }
        .sheet-verified:not(.badge-blue):not(.badge-green):not(.badge-none){
            background: conic-gradient(#BF953F 0%,#FCF6BA 18%,#B38728 36%,#FBF5B7 52%,#AA771C 68%,#FFD700 84%,#BF953F 100%);
            border:1px solid rgba(255,215,0,.35);
            box-shadow:0 0 5px 1px rgba(252,209,80,.22);
            animation:goldPulse 2.5s ease-in-out infinite;
        }
        .sheet-verified:not(.badge-blue):not(.badge-green):not(.badge-none)::before{
            content:'';position:absolute;inset:1.5px;border-radius:50%;
            background:radial-gradient(circle at 40% 35%,#fffbe6 0%,#e8c24a 55%,#a07020 100%);
            z-index:0;
        }
        .sheet-verified:not(.badge-blue):not(.badge-green):not(.badge-none) .badge-icon-gold{color:#2a1a00;}
        .sheet-verified.badge-blue{
            background:linear-gradient(145deg,#1da1f2 0%,#0d8bd9 50%,#1a7fc4 100%);
            border:1px solid rgba(29,161,242,.4);
            box-shadow:0 0 5px 1px rgba(29,155,240,.28);
            animation:bluePulse 2.8s ease-in-out infinite;
        }
        .sheet-verified.badge-blue .badge-icon-blue{color:#fff;}
        .sheet-verified.badge-green{
            background:linear-gradient(145deg,#2dd465 0%,#1da84a 50%,#17913e 100%);
            border:1px solid rgba(37,211,102,.4);
            box-shadow:0 0 5px 1px rgba(37,211,102,.24);
            animation:greenPulse 2.8s ease-in-out infinite;
        }
        .sheet-verified.badge-green .badge-icon-green{color:#fff;}
        .sheet-verified.badge-none{display:none;}

        /* ═══ PROFILE LAYOUT ═══ */
        .name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
        .name{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;}
        .handle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
        .handle{font-size:.72rem;font-weight:500;color:var(--accent);letter-spacing:.06em;}

        /* ═══ FOLLOWER STAT — tap targets ═══ */
        .follower-stat{font-size:.72rem;color:var(--muted);display:flex;gap:12px;}
        .follower-stat span{cursor:pointer;transition:color .2s;position:relative;padding:4px 2px;border-radius:6px;}
        .follower-stat span:hover{color:var(--text);}
        .follower-stat b{color:var(--text);}

        .bio{font-size:.82rem;color:var(--muted);font-weight:300;line-height:1.6;margin-bottom:14px;}
        .bio-music{display:inline-flex;align-items:center;gap:9px;margin-bottom:14px;width:fit-content;max-width:100%;}
        .bio-music-play{background:transparent;border:none;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:.7rem;flex-shrink:0;cursor:pointer;transition:opacity .15s;padding:0;outline:none;-webkit-appearance:none;}
        .bio-music-play:active{opacity:.5;}
        .bio-music-label{font-size:.78rem;font-weight:400;color:var(--muted);white-space:nowrap;cursor:pointer;}
        .bio-music-eq{display:flex;align-items:flex-end;gap:2.5px;height:12px;flex-shrink:0;margin-left:2px;}
        .bio-music-eq span{width:2.5px;background:#fff;border-radius:2px;min-height:2px;transition:opacity .3s;}
        .bio-music-eq span:nth-child(1){animation:eqBar .7s .0s infinite alternate ease-in-out;}
        .bio-music-eq span:nth-child(2){animation:eqBar .7s .15s infinite alternate ease-in-out;}
        .bio-music-eq span:nth-child(3){animation:eqBar .7s .3s infinite alternate ease-in-out;}
        .bio-music-eq span:nth-child(4){animation:eqBar .7s .1s infinite alternate ease-in-out;}
        .bio-music-eq.paused span{animation-play-state:paused;opacity:.25;}
        .links-row{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
        .link-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-size:.72rem;font-weight:600;white-space:nowrap;transition:.2s;}
        .posts-section{padding:0 16px 100px;}
        .section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);margin-bottom:14px;display:block;}
        .posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
        .post-thumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;position:relative;transition:transform .15s var(--ease),opacity .15s;}
        .post-thumb:active{transform:scale(.96);opacity:.85;}
        .post-thumb video,.post-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease);}
        .post-thumb:hover video,.post-thumb:hover img{transform:scale(1.04);}
        .post-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45) 0%,transparent 45%);pointer-events:none;border-radius:10px;}
        .vid-badge{position:absolute;top:7px;right:7px;z-index:2;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 6px;font-size:.55rem;font-weight:700;color:#fff;letter-spacing:.06em;}
        .multi-badge{position:absolute;top:7px;left:7px;z-index:2;color:#fff;font-size:.75rem;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));}

        /* ═══ POST MODAL ═══ */
        .post-modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);display:none;flex-direction:column;align-items:center;justify-content:flex-end;transition:background .32s var(--ease);overscroll-behavior:contain;}
        .post-modal-backdrop.active{background:rgba(0,0,0,.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
        .post-modal-sheet{width:100%;max-width:480px;background:#090909;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .42s cubic-bezier(.32,.72,0,1);border:1px solid rgba(255,255,255,.07);border-bottom:none;position:relative;will-change:transform;touch-action:pan-y;}
        .post-modal-backdrop.active .post-modal-sheet{transform:translateY(0);}
        .sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
        .sheet-media{width:100%;background:#000;aspect-ratio:3/4;position:relative;overflow:hidden;flex-shrink:0;}
        .sheet-media img,.sheet-media video{width:100%;height:100%;object-fit:cover;display:block;}
        .mute-tap-zone{position:absolute;inset:0;z-index:6;cursor:pointer;display:none;}
        .mute-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);width:54px;height:54px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;pointer-events:none;opacity:0;z-index:20;border:1px solid rgba(255,255,255,.18);}
        .mute-indicator.flash{animation:muteFlash .7s var(--ease) forwards;}
        .sheet-media-toprow{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);z-index:10;pointer-events:none;}
        .sheet-close-btn{width:32px;height:32px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:.82rem;border:1px solid rgba(255,255,255,.12);transition:background .2s;pointer-events:all;}
        .sheet-close-btn:active{background:rgba(255,255,255,.22);}
        .sheet-counter{font-size:.62rem;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.1);pointer-events:none;}
        .sheet-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;pointer-events:none;}
        .sheet-dot{height:5px;border-radius:3px;background:rgba(255,255,255,.35);transition:background .25s,width .25s,transform .25s;width:5px;}
        .sheet-dot.active{background:#fff;transform:scale(1.2);width:14px;}
        .dt-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.55);width:62px;height:62px;background:rgba(0,0,0,.62);backdrop-filter:blur(12px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;pointer-events:none;opacity:0;z-index:21;border:1px solid rgba(255,100,100,.28);color:#ff3b5c;}
        .dt-indicator.flash{animation:dtFlash .75s var(--ease) forwards;}
        .pfp-viewer-backdrop{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0);display:none;align-items:center;justify-content:center;transition:background .28s var(--ease);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);}
        .pfp-viewer-backdrop.active{background:rgba(0,0,0,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);}
        .pfp-viewer-box{position:relative;width:min(88vw,420px);height:min(88vw,420px);border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 32px 80px rgba(0,0,0,.9);opacity:0;}
        .pfp-viewer-backdrop.active .pfp-viewer-box{animation:pfpIn .32s cubic-bezier(.32,.72,0,1) forwards;}
        .pfp-viewer-backdrop.closing .pfp-viewer-box{animation:pfpOut .24s var(--ease) forwards;}
        .pfp-viewer-box img{width:100%;height:100%;object-fit:cover;display:block;}
        .pfp-back-btn{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:7px 13px 7px 10px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);border-radius:99px;color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.02em;transition:background .18s;z-index:10;outline:none;-webkit-appearance:none;}
        .pfp-back-btn:active{background:rgba(0,0,0,.75);}
        .pfp-back-btn i{font-size:.75rem;}
        .sheet-info{padding:13px 18px 28px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex-shrink:0;}
        .sheet-user-row{display:flex;align-items:center;gap:10px;}
        .sheet-avatar{width:34px;height:34px;border-radius:10px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
        .sheet-user-info{flex:1;}
        .sheet-username{font-size:.78rem;font-weight:700;}
        .sheet-handle-tag{font-size:.62rem;color:var(--muted);}
        .sheet-post-time{font-size:.6rem;color:var(--muted2);margin-left:auto;white-space:nowrap;}
        .sheet-caption{font-size:.8rem;color:rgba(255,255,255,.78);line-height:1.6;font-weight:300;}
        .sheet-actions{display:flex;align-items:center;border-top:1px solid var(--border);padding-top:12px;margin-top:2px;gap:2px;}
        .sheet-action-btn{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;font-size:.72rem;color:var(--muted);font-weight:600;user-select:none;transition:color .2s;border-radius:10px;}
        .sheet-action-btn i{font-size:1.05rem;transition:transform .2s,color .2s;}
        .sheet-action-btn:active i{transform:scale(.82);}
        .sheet-action-btn.liked{color:#ff3b5c;}
        .sheet-action-btn.liked i{animation:likeHeartPop .4s var(--ease);}
        .sheet-action-spacer{flex:1;}
        .comment-input-wrap{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:10px 14px;}
        .comment-avatar{width:26px;height:26px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
        .comment-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.78rem;font-family:var(--font);caret-color:var(--accent);}
        .comment-input::placeholder{color:var(--muted2);}
        .comment-send{color:var(--accent);font-size:.85rem;cursor:pointer;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;flex-shrink:0;}
        .comment-send.visible{opacity:1;transform:scale(1);}

        /* ═══ MUSIC MODAL ═══ */
        .music-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;opacity:0;transition:.3s;}
        .music-modal.active{display:flex;opacity:1;}
        .music-box{width:82vw;max-width:340px;background:#000;border:1px solid var(--border);border-radius:26px;overflow:hidden;padding:24px 20px 28px;transform:scale(.9);transition:.35s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.9);position:relative;}
        .music-modal.active .music-box{transform:scale(1);}
        .music-thumb-wrap{width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#0a0a14;position:relative;margin-bottom:18px;}
        .music-thumb{width:100%;height:100%;object-fit:cover;}
        .music-play-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
        .music-play-circle{width:56px;height:56px;border-radius:50%;background:rgba(0,122,255,.75);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:.2s;}
        .music-title{font-size:.9rem;font-weight:700;text-align:center;margin-bottom:2px;}
        .music-artist{font-size:.68rem;color:var(--muted);text-align:center;margin-bottom:16px;}
        .music-progress{width:100%;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;margin-bottom:6px;accent-color:var(--accent);}
        .music-progress::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer;}
        .music-times{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-bottom:16px;font-family:monospace;}
        .music-controls{display:flex;align-items:center;justify-content:center;gap:28px;}
        .music-ctrl{color:var(--muted);font-size:.9rem;cursor:pointer;}
        .music-close{position:absolute;top:14px;right:14px;width:32px;height:32px;background:rgba(255,255,255,.08);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:10;}

        /* ═══ COLLEGE LINK ═══ */
        .college-link-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;max-width:100%;overflow:hidden;}
        .college-link-icon{font-size:.78rem;color:var(--muted);flex-shrink:0;}
        .college-link-name-wrap{overflow:hidden;max-width:260px;}
        .college-link-name{font-size:.76rem;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-block;}
        .college-link-name.linked{color:rgba(255,255,255,.75);}
        .college-link-icon.linked{color:rgba(255,255,255,.75);}
        .college-link-name.marquee-anim{animation:clgMarquee 7s linear infinite;padding-right:40px;}
        @keyframes clgMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        @keyframes clgSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes clgSlideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
        .clg-search-overlay{position:fixed;inset:0;z-index:600;background:var(--bg);display:none;flex-direction:column;transform:translateY(100%);}
        .clg-search-overlay.open{display:flex;animation:clgSlideUp .38s cubic-bezier(.32,.72,0,1) forwards;}
        .clg-search-overlay.closing{display:flex;animation:clgSlideDown .32s cubic-bezier(.32,.72,0,1) forwards;}
        .clg-top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);flex-shrink:0;}
        .clg-back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:.82rem;cursor:pointer;flex-shrink:0;}
        .clg-back:active{background:rgba(255,255,255,.1);}
        .clg-search-bar{flex:1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid var(--border2);border-radius:12px;padding:10px 13px;}
        .clg-search-bar i{font-size:.8rem;color:var(--muted);flex-shrink:0;}
        .clg-search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.86rem;font-family:var(--font);caret-color:var(--accent);}
        .clg-search-input::placeholder{color:var(--muted);}
        .clg-results{flex:1;overflow-y:auto;padding:14px 16px 40px;}
        .clg-result-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border2);cursor:pointer;border-radius:12px;transition:background .14s;}
        .clg-result-item:active{background:rgba(255,255,255,.04);}
        .clg-pfp{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--card);flex-shrink:0;}
        .clg-name{font-size:.84rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .clg-id{font-size:.62rem;color:var(--muted);margin-top:2px;}
        .clg-chevron{color:var(--muted);font-size:.72rem;flex-shrink:0;}
        .clg-no-results{text-align:center;padding:48px 0;color:var(--muted);font-size:.82rem;}
        .clg-hint{font-size:.68rem;color:var(--muted);margin-bottom:14px;padding:0 2px;}

        /* ═══════════════════════════════════════════════
           LIQUID GLASS FOLLOW OVERLAY — INDUSTRIAL DESIGN
        ═══════════════════════════════════════════════ */
        .follow-overlay{
            position:fixed;inset:0;z-index:800;
            display:none;flex-direction:column;
            overflow:hidden;
        }

        /* Animated ambient orbs background */
        .follow-overlay-bg{
            position:absolute;inset:0;
            background:#000;
            overflow:hidden;
            z-index:0;
        }
        .follow-overlay-bg::before{
            content:'';
            position:absolute;inset:0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 20%, rgba(0,122,255,.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 80% 70%, rgba(100,50,255,.12) 0%, transparent 65%),
                radial-gradient(ellipse 40% 60% at 50% 100%, rgba(0,80,200,.1) 0%, transparent 60%);
        }
        .fo-orb{position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none;z-index:0;}
        .fo-orb-1{width:260px;height:260px;background:rgba(0,122,255,.22);top:-60px;left:-80px;animation:orbFloat1 8s ease-in-out infinite;}
        .fo-orb-2{width:200px;height:200px;background:rgba(80,0,255,.14);bottom:80px;right:-60px;animation:orbFloat2 10s ease-in-out infinite;}
        .fo-orb-3{width:180px;height:180px;background:rgba(0,180,255,.1);top:40%;left:30%;animation:orbFloat3 12s ease-in-out infinite;}

        /* Noise overlay */
        .follow-overlay-noise{
            position:absolute;inset:0;z-index:1;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            opacity:.55;pointer-events:none;
        }

        /* Glass panel — the actual visible container */
        .follow-glass-panel{
            position:relative;z-index:2;
            display:flex;flex-direction:column;
            height:100%;
            background:
                linear-gradient(180deg,
                    rgba(255,255,255,.04) 0%,
                    rgba(255,255,255,.02) 40%,
                    rgba(0,0,0,.08) 100%
                );
            backdrop-filter:blur(40px) saturate(160%);
            -webkit-backdrop-filter:blur(40px) saturate(160%);
            border-left:1px solid rgba(255,255,255,.07);
            border-right:1px solid rgba(255,255,255,.07);
        }

        /* Slide animation */
        .follow-overlay.open .follow-glass-panel{
            animation:glassSlideUp .46s cubic-bezier(.28,.72,.2,1) both;
        }
        .follow-overlay.closing .follow-glass-panel{
            animation:glassSlideDown .34s cubic-bezier(.6,0,.8,1) both;
        }

        /* Header */
        .fo-header{
            display:flex;align-items:center;
            padding:52px 20px 18px;
            border-bottom:1px solid rgba(255,255,255,.06);
            flex-shrink:0;
            position:relative;
        }
        .fo-header::after{
            content:'';position:absolute;bottom:0;left:20px;right:20px;height:1px;
            background:linear-gradient(90deg,transparent,rgba(0,122,255,.35),rgba(100,50,255,.25),transparent);
        }
        .fo-back{
            width:38px;height:38px;border-radius:12px;
            background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.1);
            display:flex;align-items:center;justify-content:center;
            color:rgba(255,255,255,.8);font-size:.82rem;cursor:pointer;
            transition:background .15s,transform .15s;
            flex-shrink:0;
            backdrop-filter:blur(12px);
        }
        .fo-back:active{background:rgba(255,255,255,.12);transform:scale(.92);}

        .fo-title-block{flex:1;text-align:center;padding-right:38px;}
        .fo-title{
            font-size:1.05rem;font-weight:700;letter-spacing:-.02em;
            color:#fff;line-height:1;margin-bottom:3px;
        }
        .fo-subtitle{font-size:.62rem;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase;font-weight:500;}

        /* Search bar in overlay */
        .fo-search{
            margin:16px 20px 4px;
            display:flex;align-items:center;gap:9px;
            background:rgba(255,255,255,.055);
            border:1px solid rgba(255,255,255,.09);
            border-radius:14px;padding:10px 14px;
            backdrop-filter:blur(8px);
            flex-shrink:0;
        }
        .fo-search i{font-size:.78rem;color:rgba(255,255,255,.3);flex-shrink:0;}
        .fo-search input{
            flex:1;background:transparent;border:none;outline:none;
            color:#fff;font-size:.82rem;font-family:var(--font);
            caret-color:#007aff;
        }
        .fo-search input::placeholder{color:rgba(255,255,255,.22);}

        /* Tabs */
        .fo-tabs{
            display:flex;margin:12px 20px 0;gap:0;
            background:rgba(255,255,255,.04);
            border:1px solid rgba(255,255,255,.07);
            border-radius:12px;padding:3px;flex-shrink:0;
        }
        .fo-tab{
            flex:1;text-align:center;padding:8px 0;
            font-size:.72rem;font-weight:600;letter-spacing:.04em;
            color:rgba(255,255,255,.35);cursor:pointer;
            border-radius:10px;transition:all .22s var(--ease);
        }
        .fo-tab.active{
            background:rgba(255,255,255,.1);
            color:#fff;
            box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 2px 8px rgba(0,0,0,.3);
        }

        /* Count badge on tab */
        .fo-tab-count{
            display:inline-flex;align-items:center;justify-content:center;
            min-width:18px;height:16px;padding:0 5px;
            background:rgba(0,122,255,.25);
            border:1px solid rgba(0,122,255,.3);
            border-radius:99px;font-size:.55rem;font-weight:700;
            color:rgba(0,180,255,.9);margin-left:5px;vertical-align:middle;
        }
        .fo-tab.active .fo-tab-count{
            background:rgba(0,122,255,.4);border-color:rgba(0,122,255,.5);color:#60d0ff;
        }

        /* Scroll list */
        .fo-list{flex:1;overflow-y:auto;padding:12px 16px 40px;}

        /* User row */
        .fo-user-row{
            display:flex;align-items:center;gap:12px;
            padding:11px 10px;border-radius:14px;
            cursor:pointer;
            transition:background .15s;
            margin-bottom:3px;
            border:1px solid transparent;
            position:relative;
            opacity:0;
            animation:rowFadeIn .3s var(--ease) both;
        }
        .fo-user-row:active{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.06);}
        .fo-user-row:hover{background:rgba(255,255,255,.04);}

        /* Liquid glass card on hover */
        .fo-user-row::before{
            content:'';position:absolute;inset:0;border-radius:14px;
            background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
            opacity:0;transition:opacity .2s;pointer-events:none;
        }
        .fo-user-row:hover::before{opacity:1;}

        .fo-pfp-wrap{position:relative;flex-shrink:0;}
        .fo-pfp{
            width:46px;height:46px;border-radius:14px;
            object-fit:cover;
            border:1px solid rgba(255,255,255,.1);
            background:rgba(255,255,255,.05);
            display:block;
        }

        /* Online dot */
        .fo-online{
            position:absolute;bottom:-2px;right:-2px;
            width:11px;height:11px;border-radius:50%;
            background:#2dd465;
            border:2px solid rgba(0,0,0,.6);
            box-shadow:0 0 5px rgba(45,212,101,.5);
        }

        .fo-user-info{flex:1;min-width:0;}
        .fo-name{
            font-size:.84rem;font-weight:600;color:#fff;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            margin-bottom:2px;display:flex;align-items:center;gap:5px;
        }
        .fo-handle{font-size:.62rem;color:rgba(255,255,255,.38);font-weight:400;}

        /* Inline badge in list */
        .fo-badge{
            display:inline-flex;align-items:center;justify-content:center;
            width:13px;height:13px;border-radius:50%;flex-shrink:0;
        }
        .fo-badge i{font-size:6.5px;font-weight:900;position:relative;z-index:2;}
        .fo-badge.gold{
            background:conic-gradient(#BF953F 0%,#FCF6BA 20%,#B38728 40%,#FFD700 80%,#BF953F 100%);
            box-shadow:0 0 4px rgba(252,209,80,.35);
        }
        .fo-badge.gold i{color:#2a1a00;}
        .fo-badge.blue{
            background:linear-gradient(135deg,#1da1f2,#0d8bd9);
            box-shadow:0 0 4px rgba(29,155,240,.3);
        }
        .fo-badge.blue i{color:#fff;}
        .fo-badge.green{
            background:linear-gradient(135deg,#2dd465,#17913e);
            box-shadow:0 0 4px rgba(37,211,102,.28);
        }
        .fo-badge.green i{color:#fff;}

        /* Follow-back / mutual button */
        .fo-action-btn{
            flex-shrink:0;
            padding:7px 14px;
            border-radius:10px;
            font-size:.68rem;font-weight:700;font-family:var(--font);
            cursor:pointer;border:none;outline:none;
            transition:all .18s;
        }
        .fo-action-btn.follow-back{
            background:rgba(0,122,255,.18);
            border:1px solid rgba(0,122,255,.3);
            color:#60b8ff;
        }
        .fo-action-btn.follow-back:active{background:rgba(0,122,255,.3);}
        .fo-action-btn.mutual{
            background:rgba(255,255,255,.07);
            border:1px solid rgba(255,255,255,.1);
            color:rgba(255,255,255,.45);
        }

        /* Divider line w/ gradient */
        .fo-divider{
            height:1px;margin:0 10px;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
        }

        /* Empty state */
        .fo-empty{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:60px 20px;gap:12px;color:rgba(255,255,255,.25);
        }
        .fo-empty i{font-size:2rem;opacity:.3;}
        .fo-empty p{font-size:.78rem;font-weight:400;}

        /* Glass top separator line */
        .fo-glass-line{
            height:1px;flex-shrink:0;
            background:linear-gradient(90deg,
                transparent 0%,
                rgba(0,122,255,.4) 25%,
                rgba(100,80,255,.3) 55%,
                rgba(0,200,255,.25) 75%,
                transparent 100%
            );
            margin:0;
        }

        /* ═══ OTHER ═══ */
        .color-twitter{color:#fff;}.color-linkedin{color:#0077b5;}.color-discord{color:#5865f2;}.color-globe{color:var(--accent);}.color-instagram{color:#e1306c;}.color-github{color:#fff;}.color-arattai{color:#007aff;}

        /* College profile overlay */
        #clg-profile-overlay{overflow-y:auto;}
    </style>
</head>

                        <div class="sheet-username" id="sheet-display-name"></div>

    <!-- ═══════════════════════════════════════
         LIQUID GLASS FOLLOW OVERLAY
    ═══════════════════════════════════════ -->
    <div class="follow-overlay" id="follow-overlay">
        <!-- Ambient background -->
        <div class="follow-overlay-bg">
            <div class="fo-orb fo-orb-1"></div>
            <div class="fo-orb fo-orb-2"></div>
            <div class="fo-orb fo-orb-3"></div>
        </div>

        <div class="follow-glass-panel">
            <div class="fo-glass-line"></div>

            <!-- Header -->
            <div class="fo-header">
                <div class="fo-back" onclick="closeFollowList()">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div class="fo-title-block">
                    <div class="fo-title" id="fo-title-text">Followers</div>
                    <div class="fo-subtitle" id="fo-subtitle-text">0 people</div>
                </div>
            </div>

            <!-- Tabs: Followers / Following -->
            <div class="fo-tabs" id="fo-tabs">
                <div class="fo-tab active" id="fo-tab-followers" onclick="switchFollowTab('followers')">
                    Followers <span class="fo-tab-count" id="fo-followers-count">0</span>
                </div>
                <div class="fo-tab" id="fo-tab-following" onclick="switchFollowTab('following')">
                    Following <span class="fo-tab-count" id="fo-following-count">0</span>
                </div>
            </div>

            <!-- Search -->
            <div class="fo-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search…" id="fo-search-input" oninput="onFollowSearch(this.value)" autocomplete="off">

            <div class="fo-list" id="fo-list"></div>

    <script src="profiles.js"></script>
    <script src="colleges.js"></script>
    <script>
        /* ═══════════════════════════════════════
           XOS LINK — DYNAMIC MULTI-USER ENGINE
        ═══════════════════════════════════════ */
        const urlParams = new URLSearchParams(window.location.search);
        const activeUsername = urlParams.get('user') || 'gemini';
        const ALL_PROFILES = window.XOS_PROFILES || {};
        const activeProfile = ALL_PROFILES[activeUsername] || ALL_PROFILES['gemini'] || null;

        if (!activeProfile) {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:\'Space Grotesk\',sans-serif;">No profile data available.</div>';
            throw new Error('XOS_PROFILES not found or empty.');
        }

        const LS_SCOPE = activeUsername;
        function lsGet(key, fallback) { const raw = localStorage.getItem(`xos_${key}_${LS_SCOPE}`); if(raw===null) return fallback; try{return JSON.parse(raw);}catch(e){return raw;} }
        function lsSet(key, value) { localStorage.setItem(`xos_${key}_${LS_SCOPE}`, JSON.stringify(value)); }

        const POSTS = activeProfile.posts || [];

        /* ─── BUILD BADGE HTML ─── */
        function buildBadgeHTML(type) {
            if (!type || type === 'none') return '';
            if (type === 'blue') return `<span class="sheet-verified badge-blue"><i class="fa-solid fa-check badge-icon-blue"></i></span>`;
            if (type === 'green') return `<span class="sheet-verified badge-green"><i class="fa-solid fa-check badge-icon-green"></i></span>`;
            // gold / default
            return `<span class="sheet-verified"><i class="fa-solid fa-check badge-icon-gold"></i></span>`;
        }

        function setPfpBadge(type) {
            const el = document.getElementById('pfp-badge');
            el.innerHTML = '';
            if (!type || type === 'none') { el.className = 'pfp-badge badge-none'; return; }
            if (type === 'blue') {
                el.className = 'pfp-badge badge-blue';
                el.innerHTML = `<i class="fa-solid fa-check badge-icon-blue"></i>`;
            } else if (type === 'green') {
                el.className = 'pfp-badge badge-green';
                el.innerHTML = `<i class="fa-solid fa-check badge-icon-green"></i>`;
            } else {
                // gold
                el.className = 'pfp-badge';
                el.innerHTML = `<i class="fa-solid fa-check badge-icon-gold"></i>`;
            }
        }

        /* ─── RENDER PROFILE ─── */
        function renderProfile() {
            const p = activeProfile;
            document.getElementById('page-title').textContent = p.displayName + ' | x0s.link';
            document.title = p.displayName + ' | x0s.link';
            document.getElementById('banner-img').src = p.banner || '';
            document.getElementById('avatar-img').src = p.avatar || '';
            document.getElementById('pfp-viewer-img').src = p.avatar || '';
            document.getElementById('sheet-avatar-img').src = p.avatar || '';
            document.getElementById('comment-avatar-img').src = p.avatar || '';
            document.getElementById('display-name').textContent = p.displayName;
            document.getElementById('handle-display').textContent = p.handle;
            document.getElementById('sheet-display-name').innerHTML = p.displayName + buildBadgeHTML(p.verified);
            document.getElementById('sheet-handle-tag').textContent = p.handle;
            document.getElementById('bio-text').textContent = p.bio || '';

            const track = p.audioTrack || {};
            document.getElementById('bio-music-label').textContent = (track.title || 'Track') + ' • ' + (track.artist || 'Artist');
            document.getElementById('music-title-display').textContent = track.title || 'Track Title';
            document.getElementById('music-artist-display').textContent = track.artist || 'Artist';
            const streamUrl = track.streamUrl || '';
            document.getElementById('bio-audio').src = streamUrl;
            document.getElementById('music-audio-player').src = streamUrl;
            document.getElementById('music-thumb').src = track.artworkUrl || p.avatar || '';

            setPfpBadge(p.verified);

            const linksRow = document.getElementById('links-row');
            linksRow.innerHTML = (p.links || []).map(l => {
                const iconClass = l.arattai ? 'fa-arattai' : (l.icon || 'fa-solid fa-link');
                const colorClass = l.color || 'color-globe';
                return `<a href="${l.url||'#'}" class="link-pill" target="_blank"><i class="${iconClass} ${colorClass}"></i>${l.label}</a>`;
            }).join('');

            followerBase = window.xosFollowerCount ? window.xosFollowerCount(activeUsername) : (activeProfile.followerCount || 0);
            followingBase = window.xosFollowingCount ? window.xosFollowingCount(activeUsername) : (activeProfile.followingCount || 0);
            isFollowing = lsGet('is_following', false);
            updateFollowUI();

            document.getElementById('bio-play-icon').className = 'fa-solid fa-play';
            document.getElementById('bio-eq').classList.add('paused');
            const bioAudio = document.getElementById('bio-audio');
            bioAudio.pause(); bioAudio.currentTime = 0;
            const modalAudio = document.getElementById('music-audio-player');
            modalAudio.pause(); modalAudio.currentTime = 0;
            document.getElementById('music-play-icon').className = 'fa-solid fa-play';
            document.getElementById('music-progress').value = 0;
            document.getElementById('music-current').textContent = '0:00';
            document.getElementById('music-duration').textContent = '0:00';

            initCollegeLink();
            renderPosts();

            // Init follow tab counts
            const fc = followerBase + (isFollowing ? 1 : 0);
            const fgc = followingBase;
            document.getElementById('fo-followers-count').textContent = fc >= 1000 ? (fc/1000).toFixed(1)+'k' : fc;
            document.getElementById('fo-following-count').textContent = fgc >= 1000 ? (fgc/1000).toFixed(1)+'k' : fgc;
        }

        /* ─── MENU / THEME ─── */
        function toggleMenu(e) { e.stopPropagation(); document.getElementById('dropdown-menu').classList.toggle('active'); }
        function toggleDarkMode() { document.body.classList.toggle('light-mode'); document.getElementById('dropdown-menu').classList.remove('active'); }
        window.onclick = () => document.getElementById('dropdown-menu').classList.remove('active');

        /* ─── FOLLOW ─── */
        let followerBase=0, followingBase=0, isFollowing=false;
        function updateFollowUI() {
            const d = followerBase + (isFollowing ? 1 : 0);
            document.getElementById('follower-count').innerText = d >= 1000 ? (d/1000).toFixed(1)+'k' : d;
            document.getElementById('following-count').innerText = followingBase;
            const btn = document.getElementById('follow-btn');
            btn.innerText = isFollowing ? 'Following' : 'Follow';
            btn.classList.toggle('following', isFollowing);
        }
        function toggleFollow() { isFollowing = !isFollowing; lsSet('is_following', isFollowing); updateFollowUI(); }

        /* ─────────────────────────────────────────────
           LIQUID GLASS FOLLOW OVERLAY ENGINE
        ───────────────────────────────────────────── */
        let followOverlayOpen = false;
        let currentFollowTab = 'followers';
        let followSearchQuery = '';

        function showFollowList(type) {
            currentFollowTab = type;
            followSearchQuery = '';
            document.getElementById('fo-search-input').value = '';

            updateFollowTabUI();
            renderFollowList();

            followOverlayOpen = true;
            const el = document.getElementById('follow-overlay');
            el.style.display = 'flex';
            el.classList.remove('closing');
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
            history.pushState({ modal: 'follow-list' }, '');
        }

        function updateFollowTabUI() {
            const isFollowers = currentFollowTab === 'followers';
            document.getElementById('fo-tab-followers').classList.toggle('active', isFollowers);
            document.getElementById('fo-tab-following').classList.toggle('active', !isFollowers);
            document.getElementById('fo-title-text').textContent = isFollowers ? 'Followers' : 'Following';
        }

        function switchFollowTab(type) {
            if (currentFollowTab === type) return;
            currentFollowTab = type;
            followSearchQuery = '';
            document.getElementById('fo-search-input').value = '';
            updateFollowTabUI();
            renderFollowList();
        }

        function onFollowSearch(val) {
            followSearchQuery = val.trim().toLowerCase();
            renderFollowList();
        }

        function renderFollowList() {
            const isFollowers = currentFollowTab === 'followers';
            let users = [];
            try {
                users = isFollowers ?
                    (window.xosGetFollowers ? window.xosGetFollowers(activeUsername) : []) :
                    (window.xosGetFollowing ? window.xosGetFollowing(activeUsername) : []);
            } catch(e) { users = []; }

            // Update subtitle
            const count = users.length + (!isFollowers && isFollowing ? 0 : 0);
            document.getElementById('fo-subtitle-text').textContent = users.length + ' people';

            // Filter by search
            if (followSearchQuery) {
                users = users.filter(u =>
                    (u.displayName || '').toLowerCase().includes(followSearchQuery) ||
                    (u.userid || '').toLowerCase().includes(followSearchQuery) ||
                    (u.handle || '').toLowerCase().includes(followSearchQuery)
                );
            }

            const list = document.getElementById('fo-list');
            if (!users.length) {
                list.innerHTML = `<div class="fo-empty"><i class="fa-solid fa-user-group"></i><p>${followSearchQuery ? 'No results found' : 'Nothing here yet'}</p></div>`;
                return;
            }

            list.innerHTML = users.map((u, i) => {
                const vType = u.verified || null;
                const badgeHTML = vType === 'blue' ?
                    `<span class="fo-badge blue"><i class="fa-solid fa-check"></i></span>` :
                    vType === 'green' ?
                    `<span class="fo-badge green"><i class="fa-solid fa-check"></i></span>` :
                    vType && vType !== 'none' ?
                    `<span class="fo-badge gold"><i class="fa-solid fa-check"></i></span>` : '';

                const isMutual = Math.random() > 0.6; // replace with real mutual logic
                const showOnline = Math.random() > 0.7;
                const delay = (i * 38) + 'ms';

                return `<div class="fo-user-row" style="animation-delay:${delay}" onclick="navigateToUser('${u.userid}')">
                    <div class="fo-pfp-wrap">
                        <img class="fo-pfp" src="${u.avatar || ''}" onerror="this.src=''" alt="">
                        ${showOnline ? '<div class="fo-online"></div>' : ''}
                    </div>
                    <div class="fo-user-info">
                        <div class="fo-name">${u.displayName || u.userid}${badgeHTML}</div>
                        <div class="fo-handle">${u.handle || '@' + u.userid}</div>
                    </div>
                    ${isMutual ?
                        `<button class="fo-action-btn mutual" onclick="event.stopPropagation()">Mutual</button>` :
                        `<button class="fo-action-btn follow-back" onclick="event.stopPropagation()">Follow</button>`
                    }
                </div>
                ${i < users.length - 1 ? '<div class="fo-divider"></div>' : ''}`;
            }).join('');
        }

        function closeFollowList(fromPop) {
            if (!followOverlayOpen) return;
            followOverlayOpen = false;
            const el = document.getElementById('follow-overlay');
            el.classList.remove('open');
            el.classList.add('closing');
            if (!fromPop) history.back();
            setTimeout(() => { el.style.display = 'none'; el.classList.remove('closing'); }, 380);
        }

        function navigateToUser(userid) {
            window.location.href = window.location.pathname + '?user=' + userid;
        }

        /* ─── GRID ─── */
        let gridIntervals = [];
        function renderPosts() {
            const grid = document.getElementById('posts-grid');
            gridIntervals.forEach(clearInterval); gridIntervals = [];
            grid.innerHTML = POSTS.map((p,i) => `
            <div class="post-thumb" onclick="openPost(${i})">
              ${p.type==='video'
                ? `<video src="${p.files[0]}" muted autoplay loop playsinline></video><div class="vid-badge">▶ VIDEO</div>`
                : `<img src="${p.files[0]}" id="thumb-${i}" loading="lazy">`}
              ${p.files.length>1 ? `<div class="multi-badge"><i class="fa-solid fa-clone"></i></div>` : ''}
            </div>`).join('');
            POSTS.forEach((p,i) => {
                if (p.files.length>1 && p.type==='image') {
                    let idx=0;
                    gridIntervals.push(setInterval(() => {
                        idx=(idx+1)%p.files.length;
                        const el=document.getElementById(`thumb-${i}`);
                        if(el) el.src=p.files[idx];
                    }, 2200));
                }
            });
        }

        /* ─── MODAL STATE ─── */
        let currentPost=-1, currentFile=0, modalOpen=false;
        let likedPosts={}, videoMuted=false, suppressMuteFlash=false;

        function openPost(idx) {
            if (modalOpen || pfpOpen) return;
            currentPost=idx; currentFile=0; modalOpen=true;
            const p=POSTS[idx];
            likedPosts[idx]=lsGet('liked_'+idx,false);
            const storedComments=lsGet('comments_'+idx, p.comments||0);
            document.getElementById('like-count').textContent=(p.likes||0)+(likedPosts[idx]?1:0);
            document.getElementById('comment-count').textContent=storedComments;
            updateLikeUI();
            document.getElementById('sheet-caption').textContent=p.caption||'';
            document.getElementById('sheet-time').textContent=p.time||'just now';
            const ci=document.getElementById('comment-input'); ci.value='';
            document.getElementById('comment-send').classList.remove('visible');
            videoMuted=false; suppressMuteFlash=true;
            loadModalMedia(); initSwipeToClose();
            history.pushState({modal:'post',idx},'');
            const backdrop=document.getElementById('post-modal');
            backdrop.style.display='flex';
            requestAnimationFrame(()=>requestAnimationFrame(()=>{
                backdrop.classList.add('active');
                setTimeout(()=>{suppressMuteFlash=false;},500);
            }));
        }

        function closePostModal(fromPopState) {
            if(!modalOpen) return; modalOpen=false;
            const backdrop=document.getElementById('post-modal');
            backdrop.classList.remove('active');
            const vid=document.getElementById('sheet-video'); vid.pause(); vid.src='';
            if(!fromPopState) history.back();
            setTimeout(()=>{backdrop.style.display='none';},420);
        }

        let pfpOpen=false;
        function openPfpViewer() {
            if(pfpOpen||modalOpen) return; pfpOpen=true;
            const el=document.getElementById('pfp-viewer');
            el.style.display='flex';
            requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('active')));
            history.pushState({modal:'pfp'},'');
        }
        function closePfpViewer(fromPopState) {
            if(!pfpOpen) return; pfpOpen=false;
            const el=document.getElementById('pfp-viewer');
            el.classList.add('closing'); el.classList.remove('active');
            if(!fromPopState) history.back();
            setTimeout(()=>{el.style.display='none';el.classList.remove('closing');},280);
        }

        window.addEventListener('popstate', e => {
            if(followOverlayOpen){closeFollowList(true);return;}
            if(clgProfileOpen){closeCollegeProfile(true);return;}
            if(clgSearchOpen){closeCollegeLinkSearch(true);return;}
            if(modalOpen){closePostModal(true);return;}
            if(pfpOpen){closePfpViewer(true);return;}
        });

        /* ─── CAROUSEL ─── */
        function getNeighbours(post,idx){const files=post.files;return{prev:files[(idx-1+files.length)%files.length],curr:files[idx],next:files[(idx+1)%files.length]};}
        function loadModalMedia(){
            const p=POSTS[currentPost]; const file=p.files[currentFile];
            const vid=document.getElementById('sheet-video'); const strip=document.getElementById('carousel-strip');
            const isVid=p.type==='video'||(file&&file.endsWith('.mp4'));
            strip.style.transition='none'; strip.style.transform='translateX(-33.333%)';
            if(isVid){
                document.getElementById('img-curr').style.display='none';
                document.getElementById('img-prev').src=''; document.getElementById('img-next').src='';
                vid.style.display='block'; vid.src=file; vid.muted=videoMuted; vid.loop=true;
                vid.play().catch(()=>{vid.muted=true;videoMuted=true;showMuteIndicator();vid.play();});
            } else {
                vid.pause(); vid.src=''; vid.style.display='none';
                document.getElementById('img-curr').style.display='block';
                const{prev,curr,next}=getNeighbours(p,currentFile);
                document.getElementById('img-prev').src=p.files.length>1?prev:'';
                document.getElementById('img-curr').src=curr;
                document.getElementById('img-next').src=p.files.length>1?next:'';
            }
            document.getElementById('mute-tap-zone').style.display=isVid?'block':'none';
            updateCounterDots();
        }
        function updateCounterDots(){
            const p=POSTS[currentPost];
            const counterEl=document.getElementById('sheet-counter'); const dotsEl=document.getElementById('sheet-dots');
            if(p.files.length>1){counterEl.style.display='block';counterEl.textContent=`${currentFile+1} / ${p.files.length}`;}
            else{counterEl.style.display='none';}
            dotsEl.innerHTML='';
            if(p.files.length>1){p.files.forEach((_,i)=>{const d=document.createElement('div');d.className='sheet-dot'+(i===currentFile?' active':'');dotsEl.appendChild(d);});}
        }

        (()=>{
            const media=document.getElementById('sheet-media'); const strip=document.getElementById('carousel-strip');
            const W=()=>media.offsetWidth; let sx=0,sy=0,t0=0,isHoriz=null,dragging=false; let lastX=0,lastT=0,velocity=0; const BASE=-33.333;
            function pctToX(pct){return(pct/100)*(W()*3);}
            function toPct(px){return(px/(W()*3))*100;}
            function setStripPct(pct,transition){strip.style.transition=transition||'none';strip.style.transform=`translateX(${pct}%)`;}
            media.addEventListener('touchstart',e=>{const p=POSTS[currentPost];if(!p||p.type==='video'||p.files.length<=1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=lastT=Date.now();lastX=sx;velocity=0;isHoriz=null;dragging=true;strip.style.transition='none';},{passive:true});
            media.addEventListener('touchmove',e=>{if(!dragging)return;const cx=e.touches[0].clientX;const cy=e.touches[0].clientY;const dx=cx-sx,dy=cy-sy;if(isHoriz===null){if(Math.abs(dx)<5&&Math.abs(dy)<5)return;isHoriz=Math.abs(dx)>Math.abs(dy);if(!isHoriz){dragging=false;return;}}if(!isHoriz)return;const now=Date.now();velocity=(cx-lastX)/Math.max(now-lastT,1);lastX=cx;lastT=now;const dragPct=toPct(dx);setStripPct(BASE+dragPct);},{passive:true});
            media.addEventListener('touchend',e=>{if(!dragging||!isHoriz){dragging=false;return;}dragging=false;const p=POSTS[currentPost];const dx=e.changedTouches[0].clientX-sx;const threshold=W()*.22;const fast=Math.abs(velocity)>.4;const goNext=dx<-threshold||(fast&&velocity<0);const goPrev=dx>threshold||(fast&&velocity>0);const canNext=currentFile<p.files.length-1;const canPrev=currentFile>0;if(goNext&&canNext){setStripPct(BASE+toPct(-W()),'transform .32s cubic-bezier(.25,.72,.35,1)');setTimeout(()=>{currentFile++;loadModalMedia();updateCounterDots();},320);}else if(goPrev&&canPrev){setStripPct(BASE+toPct(W()),'transform .32s cubic-bezier(.25,.72,.35,1)');setTimeout(()=>{currentFile--;loadModalMedia();updateCounterDots();},320);}else{setStripPct(BASE,'transform .38s cubic-bezier(.25,.72,.35,1)');}},{passive:true});
        })();

        function initSwipeToClose(){
            const sheet=document.getElementById('post-sheet'); let sy=0,sx=0,dragging=false,raf=null;
            sheet.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX;dragging=true;sheet.style.transition='none';},{passive:true});
            sheet.addEventListener('touchmove',e=>{if(!dragging)return;const dy=e.touches[0].clientY-sy;const dx=e.touches[0].clientX-sx;if(Math.abs(dx)>Math.abs(dy))return;if(dy<=0)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{sheet.style.transform=`translateY(${dy}px)`;});},{passive:true});
            sheet.addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const dy=e.changedTouches[0].clientY-sy;sheet.style.transition='';if(dy>90){sheet.style.transform='';closePostModal();}else{sheet.style.transform='';}},{passive:true});
        }

        let lastTap=0,tapTimer=null;
        document.getElementById('mute-tap-zone').addEventListener('click',e=>{const now=Date.now(),gap=now-lastTap;lastTap=now;if(gap<300&&gap>0){clearTimeout(tapTimer);lastTap=0;triggerDoubleTapLike(e);}else{tapTimer=setTimeout(toggleMute,260);}});
        function toggleMute(){const vid=document.getElementById('sheet-video');if(!vid||vid.style.display==='none')return;videoMuted=!videoMuted;vid.muted=videoMuted;showMuteIndicator();}
        function showMuteIndicator(){if(suppressMuteFlash)return;const ind=document.getElementById('mute-indicator');document.getElementById('mute-icon').className=videoMuted?'fa-solid fa-volume-xmark':'fa-solid fa-volume-high';ind.classList.remove('flash');void ind.offsetWidth;ind.classList.add('flash');}
        function triggerDoubleTapLike(e){if(currentPost<0)return;if(!likedPosts[currentPost]){likedPosts[currentPost]=true;lsSet('liked_'+currentPost,true);document.getElementById('like-count').textContent=(POSTS[currentPost].likes||0)+1;updateLikeUI();}const ind=document.getElementById('dt-indicator');ind.classList.remove('flash');void ind.offsetWidth;ind.classList.add('flash');}
        function toggleLike(e){if(currentPost<0)return;likedPosts[currentPost]=!likedPosts[currentPost];lsSet('liked_'+currentPost,likedPosts[currentPost]);document.getElementById('like-count').textContent=(POSTS[currentPost].likes||0)+(likedPosts[currentPost]?1:0);updateLikeUI();}
        function updateLikeUI(){const liked=likedPosts[currentPost]||false;document.getElementById('like-btn').classList.toggle('liked',liked);document.getElementById('like-icon').className=liked?'fa-solid fa-heart':'fa-regular fa-heart';}
        function focusComment(){document.getElementById('comment-input').focus();}
        function onCommentInput(el){document.getElementById('comment-send').classList.toggle('visible',el.value.trim().length>0);}
        function onCommentKey(e){if(e.key==='Enter')sendComment();}
        function sendComment(){const inp=document.getElementById('comment-input');if(!inp.value.trim())return;const cc=document.getElementById('comment-count');const newCount=parseInt(cc.textContent)+1;cc.textContent=newCount;lsSet('comments_'+currentPost,newCount);inp.value='';inp.blur();document.getElementById('comment-send').classList.remove('visible');}
        function sharePost(){if(navigator.share)navigator.share({title:activeProfile.displayName+' | x0s.link',url:window.location.href});else alert('Link copied!');}

        /* ─── MUSIC ─── */
        let musicProgressTimer;
        function openMusicPlayer(){const ba=document.getElementById('bio-audio');if(!ba.paused){ba.pause();document.getElementById('bio-play-icon').className='fa-solid fa-play';document.getElementById('bio-eq').classList.add('paused');}const m=document.getElementById('music-modal');m.style.display='flex';setTimeout(()=>m.classList.add('active'),10);const ma=document.getElementById('music-audio-player');ma.currentTime=0;ma.play().then(()=>{document.getElementById('music-play-icon').className='fa-solid fa-pause';}).catch(()=>{document.getElementById('music-play-icon').className='fa-solid fa-play';});clearInterval(musicProgressTimer);musicProgressTimer=setInterval(updateMusicProgress,400);}
        function updateMusicProgress(){const ma=document.getElementById('music-audio-player');if(!ma||isNaN(ma.duration)||ma.duration<=0){document.getElementById('music-duration').textContent='0:00';document.getElementById('music-current').textContent='0:00';document.getElementById('music-progress').value=0;return;}const c=ma.currentTime,d=ma.duration;document.getElementById('music-progress').value=(c/d)*100;document.getElementById('music-current').textContent=fmtTime(c);document.getElementById('music-duration').textContent=fmtTime(d);document.getElementById('music-play-icon').className=ma.paused?'fa-solid fa-play':'fa-solid fa-pause';}
        function fmtTime(s){if(!s||isNaN(s))return'0:00';return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;}
        function closeMusicModal(){const m=document.getElementById('music-modal');m.classList.remove('active');setTimeout(()=>m.style.display='none',300);const ma=document.getElementById('music-audio-player');ma.pause();clearInterval(musicProgressTimer);}
        document.getElementById('music-play-pause').addEventListener('click',()=>{const ma=document.getElementById('music-audio-player');if(!ma.src)return;if(ma.paused){ma.play().then(()=>{document.getElementById('music-play-icon').className='fa-solid fa-pause';}).catch(()=>{});}else{ma.pause();document.getElementById('music-play-icon').className='fa-solid fa-play';}});
        document.getElementById('music-progress').addEventListener('input',e=>{const ma=document.getElementById('music-audio-player');if(!ma||isNaN(ma.duration)||ma.duration<=0)return;ma.currentTime=(e.target.value/100)*ma.duration;});
        document.getElementById('music-prev').addEventListener('click',()=>{const ma=document.getElementById('music-audio-player');if(!ma.src)return;ma.currentTime=0;if(ma.paused)ma.play().catch(()=>{});document.getElementById('music-play-icon').className='fa-solid fa-pause';});
        document.getElementById('music-next').addEventListener('click',()=>{const ma=document.getElementById('music-audio-player');if(!ma.src||isNaN(ma.duration)||ma.duration<=0)return;ma.currentTime=Math.min(ma.duration,ma.currentTime+10);if(ma.paused)ma.play().catch(()=>{});document.getElementById('music-play-icon').className='fa-solid fa-pause';});
        document.getElementById('music-audio-player').addEventListener('ended',()=>{document.getElementById('music-play-icon').className='fa-solid fa-play';document.getElementById('music-progress').value=100;});
        function toggleBioMusic(e){if(e)e.stopPropagation();const a=document.getElementById('bio-audio'),ic=document.getElementById('bio-play-icon'),eq=document.getElementById('bio-eq');if(!a.src)return;if(a.paused){a.play();ic.className='fa-solid fa-pause';eq.classList.remove('paused');}else{a.pause();ic.className='fa-solid fa-play';eq.classList.add('paused');}}
        function shareProfile(){if(navigator.share)navigator.share({title:activeProfile.displayName+' | x0s.link',url:window.location.href});else alert('Link copied!');document.getElementById('dropdown-menu').classList.remove('active');}

        /* ─── COLLEGE ─── */
        let clgProfileOpen=false;
        function openCollegeProfile(idx){const colleges=window.XOS_COLLEGES||[];const c=colleges[idx];if(!c)return;const nameParts=c.name.split(',');const displayName=nameParts[0].trim();const caption=nameParts.slice(1).join(',').trim();document.getElementById('acp-pfp').src=c.pfp||'';document.getElementById('acp-name').textContent=displayName+' '+c.id;document.getElementById('acp-caption').textContent=caption||'Engineering College';document.getElementById('acp-pills').innerHTML=(c.pill1?`<span style="padding:3px 10px;border-radius:99px;font-size:.62rem;font-weight:600;background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.2);color:#007aff;">${c.pill1}</span>`:'')+(c.pill2?`<span style="padding:3px 10px;border-radius:99px;font-size:.62rem;font-weight:600;background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.2);color:#007aff;">${c.pill2}</span>`:'');clgProfileOpen=true;const el=document.getElementById('clg-profile-overlay');el.style.display='flex';requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.transform='translateX(0)'));history.pushState({modal:'clg-profile'},'');}
        function closeCollegeProfile(fromPop){if(!clgProfileOpen)return;clgProfileOpen=false;const el=document.getElementById('clg-profile-overlay');el.style.transform='translateX(100%)';if(!fromPop)history.back();setTimeout(()=>{el.style.display='none';},380);}
        let clgSearchOpen=false;
        function handleCollegeLinkClick(){const stored=lsGet('linked_college',null);if(stored){const colleges=window.XOS_COLLEGES||[];const idx=colleges.findIndex(col=>col.id===stored.id);if(idx>=0){openCollegeProfile(idx);return;}}openCollegeLinkSearch();}
        function initCollegeLink(){const stored=lsGet('linked_college',null);if(stored){setCollegeLinkUI(stored.name,true);}else{setCollegeLinkUI('+ Link College',false);}}
        function setCollegeLinkUI(name,linked){const el=document.getElementById('college-link-name');const icon=document.getElementById('college-link-icon');const wrap=document.querySelector('.college-link-name-wrap');el.classList.toggle('linked',linked);icon.classList.toggle('linked',linked);el.classList.remove('marquee-anim');el.textContent=linked?name:'+ Link College';requestAnimationFrame(()=>{if(wrap&&el.scrollWidth>wrap.offsetWidth&&linked){el.textContent=name+'   ·   '+name;el.classList.add('marquee-anim');}});}
        function openCollegeLinkSearch(){document.getElementById('dropdown-menu').classList.remove('active');clgSearchOpen=true;const el=document.getElementById('clg-search-overlay');el.style.display='flex';el.classList.remove('closing');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));setTimeout(()=>document.getElementById('clg-search-input').focus(),400);history.pushState({modal:'clg-search'},'');}
        function closeCollegeLinkSearch(fromPop){if(!clgSearchOpen)return;clgSearchOpen=false;const el=document.getElementById('clg-search-overlay');el.classList.remove('open');el.classList.add('closing');document.getElementById('clg-search-input').value='';document.getElementById('clg-results-list').innerHTML='';if(!fromPop)history.back();setTimeout(()=>{el.style.display='none';el.classList.remove('closing');},340);}
        function onClgSearchInput(val){const q=val.trim().toLowerCase().replace(/\s/g,'');const list=document.getElementById('clg-results-list');const colleges=window.XOS_COLLEGES||[];if(!q){list.innerHTML='';return;}const showAll=q==='#college'||q==='#colleges';let matches=showAll?colleges:colleges.filter(c=>c.name.toLowerCase().replace(/\s/g,'').includes(q)).slice(0,6);if(matches.length===0){list.innerHTML=`<div class="clg-no-results">No colleges found</div>`;return;}list.innerHTML=matches.map(c=>{const displayName=c.name.split(',')[0].trim();const originalIdx=colleges.indexOf(c);return`<div class="clg-result-item" onclick="linkCollege(${originalIdx})"><img class="clg-pfp" src="${c.pfp||''}" onerror="this.src=''" alt=""><div style="flex:1;min-width:0;"><div class="clg-name">${displayName}</div><div class="clg-id">${c.id}</div></div><i class="fa-solid fa-link clg-chevron"></i></div>`;}).join('');}
        function linkCollege(idx){const colleges=window.XOS_COLLEGES||[];const c=colleges[idx];if(!c)return;const displayName=c.name.split(',')[0].trim();lsSet('linked_college',{id:c.id,name:displayName,pfp:c.pfp||''});setCollegeLinkUI(displayName,true);closeCollegeLinkSearch();}

        /* ─── INIT ─── */
        document.addEventListener('DOMContentLoaded', () => {
            renderProfile();
            document.getElementById('followers-tap-target').addEventListener('click', e => { e.stopPropagation(); showFollowList('followers'); });
            document.getElementById('following-tap-target').addEventListener('click', e => { e.stopPropagation(); showFollowList('following'); });
        });
    </script>
</body>
</html>
