    </script>

    <script>
        /* ═══════════════════════════════════════
           XOS LINK — DYNAMIC MULTI-USER ENGINE
        ═══════════════════════════════════════ */

        // ── Resolve active user ──
        const urlParams = new URLSearchParams(window.location.search);
        const activeUsername = urlParams.get('user') || 'gemini';
        const ALL_PROFILES = window.XOS_PROFILES || {};
        const activeProfile = ALL_PROFILES[activeUsername] || ALL_PROFILES['gemini'] || null;

        // ── Fallback if nothing loaded ──
        if (!activeProfile) {
            document.body.innerHTML =
                '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:\'Space Grotesk\',sans-serif;">No profile data available. Please check profiles.js</div>';
            throw new Error('XOS_PROFILES not found or empty.');
        }

        // ── Scoped localStorage helpers ──
        const LS_SCOPE = activeUsername;

        function lsGet(key, fallback) {
            const raw = localStorage.getItem(`xos_${key}_${LS_SCOPE}`);
            if (raw === null) return fallback;
            try { return JSON.parse(raw); } catch (e) { return raw; }
        }

        function lsSet(key, value) {
            localStorage.setItem(`xos_${key}_${LS_SCOPE}`, JSON.stringify(value));
        }

        // ── Derive posts from active profile ──
        const POSTS = activeProfile.posts || [];

        /* ─── RENDER PROFILE UI ─── */
        function renderProfile() {
            const p = activeProfile;

            // Title
            document.getElementById('page-title').textContent = p.displayName + ' | x0s.link';
            document.title = p.displayName + ' | x0s.link';

            // Banner & avatar
            document.getElementById('banner-img').src = p.banner || '';
            document.getElementById('avatar-img').src = p.avatar || '';
            document.getElementById('pfp-viewer-img').src = p.avatar || '';
            document.getElementById('sheet-avatar-img').src = p.avatar || '';
            document.getElementById('comment-avatar-img').src = p.avatar || '';

            // Display name & handle
            document.getElementById('display-name').textContent = p.displayName;
            document.getElementById('handle-display').textContent = p.handle;
            document.getElementById('sheet-display-name').innerHTML = buildVerifiedHTML(p.verified, p.displayName);
            document.getElementById('sheet-handle-tag').textContent = p.handle;

            // Bio
            document.getElementById('bio-text').textContent = p.bio || '';

            // Audio track
            const track = p.audioTrack || {};
            document.getElementById('bio-music-label').textContent =
                (track.title || 'Track') + ' • ' + (track.artist || 'Artist');
            document.getElementById('music-title-display').textContent = track.title || 'Track Title';
            document.getElementById('music-artist-display').textContent = track.artist || 'Artist';
            const streamUrl = track.streamUrl || '';
            document.getElementById('bio-audio').src = streamUrl;
            document.getElementById('music-audio-player').src = streamUrl;
            // Music thumbnail — use avatar as fallback
            document.getElementById('music-thumb').src = track.artworkUrl || p.avatar || '';

            // Verified badge on avatar
            const pfpBadge = document.getElementById('pfp-badge');
            pfpBadge.className = 'pfp-badge badge-' + (p.verified || 'none');

            // Links row
            const linksRow = document.getElementById('links-row');
            linksRow.innerHTML = (p.links || []).map(l => {
                const iconClass = l.arattai ? 'fa-arattai' : (l.icon || 'fa-solid fa-link');
                const colorClass = l.color || 'color-globe';
                return `<a href="${l.url || '#'}" class="link-pill" target="_blank"><i class="${iconClass} ${colorClass}"></i>${l.label}</a>`;
            }).join('');

            // Follow state
            followerBase = lsGet('followers', p.followers || 0);
            followingBase = lsGet('following', p.following || 0);
            isFollowing = lsGet('is_following', false);
            updateFollowUI();

            // Bio music EQ reset
            document.getElementById('bio-play-icon').className = 'fa-solid fa-play';
            document.getElementById('bio-eq').classList.add('paused');
            const bioAudio = document.getElementById('bio-audio');
            bioAudio.pause();
            bioAudio.currentTime = 0;

            // Music modal reset
            const modalAudio = document.getElementById('music-audio-player');
            modalAudio.pause();
            modalAudio.currentTime = 0;
            document.getElementById('music-play-icon').className = 'fa-solid fa-play';
            document.getElementById('music-progress').value = 0;
            document.getElementById('music-current').textContent = '0:00';
            document.getElementById('music-duration').textContent = '0:00';

            // College link
            initCollegeLink();

            // Posts
            renderPosts();
        }

        function buildVerifiedHTML(verifiedType, displayName) {
            if (!verifiedType) return displayName;
            const badgeClass = 'badge-' + verifiedType;
            return displayName +
                ' <span class="sheet-verified ' + badgeClass +
                '"><i class="fa-solid fa-certificate"></i><i class="fa-solid fa-check"></i></span>';
        }

        /* ─── MENU / THEME ─── */
        function toggleMenu(e) { e.stopPropagation();
            document.getElementById('dropdown-menu').classList.toggle('active'); }

        function toggleDarkMode() { document.body.classList.toggle('light-mode');
            document.getElementById('dropdown-menu').classList.remove('active'); }
        window.onclick = () => document.getElementById('dropdown-menu').classList.remove('active');

        /* ─── FOLLOW ─── */
        let followerBase = 0;
        let followingBase = 0;
        let isFollowing = false;

        function updateFollowUI() {
            document.getElementById('follower-count').innerText = followerBase >= 1000 ? (followerBase / 1000)
                .toFixed(1) + 'k' : followerBase;
            document.getElementById('following-count').innerText = followingBase;
            const btn = document.getElementById('follow-btn');
            btn.innerText = isFollowing ? 'Following' : 'Follow';
            btn.classList.toggle('following', isFollowing);
        }

        function toggleFollow() {
            if (isFollowing) {
                followerBase = Math.max(0, followerBase - 1);
            } else {
                followerBase++;
            }
            isFollowing = !isFollowing;
            lsSet('followers', followerBase);
            lsSet('is_following', isFollowing);
            updateFollowUI();
        }

        /* ─── GRID ─── */
        let gridIntervals = [];

        function renderPosts() {
            const grid = document.getElementById('posts-grid');
            gridIntervals.forEach(clearInterval);
            gridIntervals = [];
            grid.innerHTML = POSTS.map((p, i) => `
            <div class="post-thumb" onclick="openPost(${i})">
              ${p.type === 'video'
                ? `<video src="${p.files[0]}" muted autoplay loop playsinline></video><div class="vid-badge">▶ VIDEO</div>`
                : `<img src="${p.files[0]}" id="thumb-${i}" loading="lazy">`}
              ${p.files.length > 1 ? `<div class="multi-badge"><i class="fa-solid fa-clone"></i></div>` : ''}
            </div>`).join('');
            POSTS.forEach((p, i) => {
                if (p.files.length > 1 && p.type === 'image') {
                    let idx = 0;
                    gridIntervals.push(setInterval(() => {
                        idx = (idx + 1) % p.files.length;
                        const el = document.getElementById(`thumb-${i}`);
                        if (el) el.src = p.files[idx];
                    }, 2200));
                }
            });
        }

        /* ─── STATE ─── */
        let currentPost = -1,
            currentFile = 0,
            modalOpen = false;
        let likedPosts = {},
            videoMuted = false,
            suppressMuteFlash = false;

        /* ═══════════════════════════════
           OPEN / CLOSE  +  HISTORY API
        ═══════════════════════════════ */
        function openPost(idx) {
            if (modalOpen || pfpOpen) return;
            currentPost = idx;
            currentFile = 0;
            modalOpen = true;
            const p = POSTS[idx];

            const postLikeKey = 'liked_' + idx;
            likedPosts[idx] = lsGet(postLikeKey, false);
            const postCommentKey = 'comments_' + idx;
            const storedComments = lsGet(postCommentKey, p.comments || 0);

            document.getElementById('like-count').textContent = (p.likes || 0) + (likedPosts[idx] ? 1 : 0);
            document.getElementById('comment-count').textContent = storedComments;
            updateLikeUI();
            document.getElementById('sheet-caption').textContent = p.caption || '';
            document.getElementById('sheet-time').textContent = p.time || 'just now';

            const ci = document.getElementById('comment-input');
            ci.value = '';
            document.getElementById('comment-send').classList.remove('visible');

            videoMuted = false;
            suppressMuteFlash = true;
            activeBuf = 'a';
            loadModalMedia();
            initSwipeToClose();

            history.pushState({ modal: 'post', idx: idx }, '');

            const backdrop = document.getElementById('post-modal');
            backdrop.style.display = 'flex';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                backdrop.classList.add('active');
                setTimeout(() => { suppressMuteFlash = false; }, 500);
            }));
        }

        function closePostModal(fromPopState) {
            if (!modalOpen) return;
            modalOpen = false;
            const backdrop = document.getElementById('post-modal');
            backdrop.classList.remove('active');
            const vid = document.getElementById('sheet-video');
            vid.pause();
            vid.src = '';
            if (!fromPopState) history.back();
            setTimeout(() => { backdrop.style.display = 'none'; }, 420);
        }

        /* ═══════════════════════════════
           PFP VIEWER
        ═══════════════════════════════ */
        let pfpOpen = false;

        function openPfpViewer() {
            if (pfpOpen || modalOpen) return;
            pfpOpen = true;
            const el = document.getElementById('pfp-viewer');
            el.style.display = 'flex';
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('active')));
            history.pushState({ modal: 'pfp' }, '');
        }

        function closePfpViewer(fromPopState) {
            if (!pfpOpen) return;
            pfpOpen = false;
            const el = document.getElementById('pfp-viewer');
            el.classList.add('closing');
            el.classList.remove('active');
            if (!fromPopState) history.back();
            setTimeout(() => {
                el.style.display = 'none';
                el.classList.remove('closing');
            }, 280);
        }

        /* ─── POPSTATE ─── */
        window.addEventListener('popstate', e => {
            if (clgProfileOpen) { closeCollegeProfile(true); return; }
            if (clgSearchOpen) { closeCollegeLinkSearch(true); return; }
            if (modalOpen) { closePostModal(true); return; }
            if (pfpOpen) { closePfpViewer(true); return; }
        });

        /* ═══════════════════════════════
           LOAD MEDIA / CAROUSEL
        ═══════════════════════════════ */
        let activeBuf = 'a';

        function getNeighbours(post, idx) {
            const files = post.files;
            const prev = files[(idx - 1 + files.length) % files.length];
            const curr = files[idx];
            const next = files[(idx + 1) % files.length];
            return { prev, curr, next };
        }

        function loadModalMedia(animate) {
            const p = POSTS[currentPost];
            const file = p.files[currentFile];
            const vid = document.getElementById('sheet-video');
            const strip = document.getElementById('carousel-strip');
            const isVid = p.type === 'video' || (file && file.endsWith('.mp4'));

            strip.style.transition = 'none';
            strip.style.transform = 'translateX(-33.333%)';

            if (isVid) {
                document.getElementById('img-curr').style.display = 'none';
                document.getElementById('img-prev').src = '';
                document.getElementById('img-next').src = '';
                vid.style.display = 'block';
                vid.src = file;
                vid.muted = videoMuted;
                vid.loop = true;
                vid.play().catch(() => { vid.muted = true;
                    videoMuted = true;
                    showMuteIndicator();
                    vid.play(); });
            } else {
                vid.pause();
                vid.src = '';
                vid.style.display = 'none';
                document.getElementById('img-curr').style.display = 'block';
                const { prev, curr, next } = getNeighbours(p, currentFile);
                document.getElementById('img-prev').src = p.files.length > 1 ? prev : '';
                document.getElementById('img-curr').src = curr;
                document.getElementById('img-next').src = p.files.length > 1 ? next : '';
            }
            document.getElementById('mute-tap-zone').style.display = isVid ? 'block' : 'none';
            updateCounterDots();
        }

        function updateCounterDots() {
            const p = POSTS[currentPost];
            const counterEl = document.getElementById('sheet-counter');
            const dotsEl = document.getElementById('sheet-dots');
            if (p.files.length > 1) {
                counterEl.style.display = 'block';
                counterEl.textContent = `${currentFile+1} / ${p.files.length}`;
            } else { counterEl.style.display = 'none'; }
            dotsEl.innerHTML = '';
            if (p.files.length > 1) {
                p.files.forEach((_, i) => {
                    const d = document.createElement('div');
                    d.className = 'sheet-dot' + (i === currentFile ? ' active' : '');
                    dotsEl.appendChild(d);
                });
            }
        }

        /* ═══════════════════════════════
           SWIPE — physics carousel
        ═══════════════════════════════ */
        (() => {
            const media = document.getElementById('sheet-media');
            const strip = document.getElementById('carousel-strip');
            const W = () => media.offsetWidth;
            let sx = 0,
                sy = 0,
                t0 = 0,
                isHoriz = null,
                dragging = false;
            let lastX = 0,
                lastT = 0,
                velocity = 0;
            const BASE = -33.333;

            function pctToX(pct) { return (pct / 100) * (W() * 3); }

            function toPct(px) { return (px / (W() * 3)) * 100; }

            function setStripPct(pct, transition) {
                strip.style.transition = transition || 'none';
                strip.style.transform = `translateX(${pct}%)`;
            }

            media.addEventListener('touchstart', e => {
                const p = POSTS[currentPost];
                if (!p || p.type === 'video' || p.files.length <= 1) return;
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
                t0 = lastT = Date.now();
                lastX = sx;
                velocity = 0;
                isHoriz = null;
                dragging = true;
                strip.style.transition = 'none';
            }, { passive: true });

            media.addEventListener('touchmove', e => {
                if (!dragging) return;
                const cx = e.touches[0].clientX;
                const cy = e.touches[0].clientY;
                const dx = cx - sx,
                    dy = cy - sy;
                if (isHoriz === null) {
                    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
                    isHoriz = Math.abs(dx) > Math.abs(dy);
                    if (!isHoriz) { dragging = false; return; }
                }
                if (!isHoriz) return;
                const now = Date.now();
                velocity = (cx - lastX) / Math.max(now - lastT, 1);
                lastX = cx;
                lastT = now;
                const dragPct = toPct(dx);
                setStripPct(BASE + dragPct);
            }, { passive: true });

            media.addEventListener('touchend', e => {
                if (!dragging || !isHoriz) { dragging = false; return; }
                dragging = false;
                const p = POSTS[currentPost];
                const dx = e.changedTouches[0].clientX - sx;
                const threshold = W() * 0.22;
                const fast = Math.abs(velocity) > 0.4;
                const goNext = dx < -threshold || (fast && velocity < 0);
                const goPrev = dx > threshold || (fast && velocity > 0);
                const canNext = currentFile < p.files.length - 1;
                const canPrev = currentFile > 0;
                if (goNext && canNext) {
                    setStripPct(BASE + toPct(-W()), 'transform .32s cubic-bezier(.25,.72,.35,1)');
                    setTimeout(() => {
                        currentFile++;
                        loadModalMedia(false);
                        updateCounterDots();
                    }, 320);
                } else if (goPrev && canPrev) {
                    setStripPct(BASE + toPct(W()), 'transform .32s cubic-bezier(.25,.72,.35,1)');
                    setTimeout(() => {
                        currentFile--;
                        loadModalMedia(false);
                        updateCounterDots();
                    }, 320);
                } else {
                    setStripPct(BASE, 'transform .38s cubic-bezier(.25,.72,.35,1)');
                }
            }, { passive: true });
        })();

        /* ═══════════════════════════════
           SWIPE DOWN TO CLOSE
        ═══════════════════════════════ */
        function initSwipeToClose() {
            const sheet = document.getElementById('post-sheet');
            let sy = 0,
                sx = 0,
                dragging = false,
                raf = null;
            sheet.addEventListener('touchstart', e => {
                sy = e.touches[0].clientY;
                sx = e.touches[0].clientX;
                dragging = true;
                sheet.style.transition = 'none';
            }, { passive: true });
            sheet.addEventListener('touchmove', e => {
                if (!dragging) return;
                const dy = e.touches[0].clientY - sy;
                const dx = e.touches[0].clientX - sx;
                if (Math.abs(dx) > Math.abs(dy)) return;
                if (dy <= 0) return;
                cancelAnimationFrame(raf);
                raf = requestAnimationFrame(() => { sheet.style.transform =
                        `translateY(${dy}px)`; });
            }, { passive: true });
            sheet.addEventListener('touchend', e => {
                if (!dragging) return;
                dragging = false;
                const dy = e.changedTouches[0].clientY - sy;
                sheet.style.transition = '';
                if (dy > 90) {
                    sheet.style.transform = '';
                    closePostModal();
                } else {
                    sheet.style.transform = '';
                }
            }, { passive: true });
        }

        /* ═══════════════════════════════
           TAP = MUTE TOGGLE  |  DOUBLE TAP = LIKE
        ═══════════════════════════════ */
        let lastTap = 0,
            tapTimer = null;
        document.getElementById('mute-tap-zone').addEventListener('click', e => {
            const now = Date.now(),
                gap = now - lastTap;
            lastTap = now;
            if (gap < 300 && gap > 0) {
                clearTimeout(tapTimer);
                lastTap = 0;
                triggerDoubleTapLike(e);
            } else {
                tapTimer = setTimeout(toggleMute, 260);
            }
        });

        function toggleMute() {
            const vid = document.getElementById('sheet-video');
            if (!vid || vid.style.display === 'none') return;
            videoMuted = !videoMuted;
            vid.muted = videoMuted;
            showMuteIndicator();
        }

        function showMuteIndicator() {
            if (suppressMuteFlash) return;
            const ind = document.getElementById('mute-indicator');
            document.getElementById('mute-icon').className = videoMuted ? 'fa-solid fa-volume-xmark' :
                'fa-solid fa-volume-high';
            ind.classList.remove('flash');
            void ind.offsetWidth;
            ind.classList.add('flash');
        }

        function triggerDoubleTapLike(e) {
            if (currentPost < 0) return;
            if (!likedPosts[currentPost]) {
                likedPosts[currentPost] = true;
                lsSet('liked_' + currentPost, true);
                document.getElementById('like-count').textContent = (POSTS[currentPost].likes || 0) + 1;
                updateLikeUI();
            }
            const ind = document.getElementById('dt-indicator');
            ind.classList.remove('flash');
            void ind.offsetWidth;
            ind.classList.add('flash');
        }

        /* ─── LIKE BUTTON ─── */
        function toggleLike(e) {
            if (currentPost < 0) return;
            likedPosts[currentPost] = !likedPosts[currentPost];
            lsSet('liked_' + currentPost, likedPosts[currentPost]);
            document.getElementById('like-count').textContent = (POSTS[currentPost].likes || 0) + (likedPosts[
                currentPost] ? 1 : 0);
            updateLikeUI();
        }

        function updateLikeUI() {
            const liked = likedPosts[currentPost] || false;
            document.getElementById('like-btn').classList.toggle('liked', liked);
            document.getElementById('like-icon').className = liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
        }

        /* ─── COMMENT ─── */
        function focusComment() { document.getElementById('comment-input').focus(); }

        function onCommentInput(el) { document.getElementById('comment-send').classList.toggle('visible', el.value.trim()
                .length > 0); }

        function onCommentKey(e) { if (e.key === 'Enter') sendComment(); }

        function sendComment() {
            const inp = document.getElementById('comment-input');
            if (!inp.value.trim()) return;
            const cc = document.getElementById('comment-count');
            const newCount = parseInt(cc.textContent) + 1;
            cc.textContent = newCount;
            lsSet('comments_' + currentPost, newCount);
            inp.value = '';
            inp.blur();
            document.getElementById('comment-send').classList.remove('visible');
        }

        function sharePost() {
            if (navigator.share) navigator.share({ title: activeProfile.displayName + ' | x0s.link', url: window.location
                    .href });
            else alert('Link copied!');
        }

        /* ─── MUSIC ─── */
        let musicProgressTimer;

        function openMusicPlayer() {
            const ba = document.getElementById('bio-audio');
            if (!ba.paused) {
                ba.pause();
                document.getElementById('bio-play-icon').className = 'fa-solid fa-play';
                document.getElementById('bio-eq').classList.add('paused');
            }
            const m = document.getElementById('music-modal');
            m.style.display = 'flex';
            setTimeout(() => m.classList.add('active'), 10);

            const ma = document.getElementById('music-audio-player');
            ma.currentTime = 0;
            ma.play().then(() => {
                document.getElementById('music-play-icon').className = 'fa-solid fa-pause';
            }).catch(() => {
                document.getElementById('music-play-icon').className = 'fa-solid fa-play';
            });
            clearInterval(musicProgressTimer);
            musicProgressTimer = setInterval(updateMusicProgress, 400);
        }

        function updateMusicProgress() {
            const ma = document.getElementById('music-audio-player');
            if (!ma || isNaN(ma.duration) || ma.duration <= 0) {
                document.getElementById('music-duration').textContent = '0:00';
                document.getElementById('music-current').textContent = '0:00';
                document.getElementById('music-progress').value = 0;
                return;
            }
            const c = ma.currentTime;
            const d = ma.duration;
            document.getElementById('music-progress').value = (c / d) * 100;
            document.getElementById('music-current').textContent = fmtTime(c);
            document.getElementById('music-duration').textContent = fmtTime(d);
            if (ma.paused) {
                document.getElementById('music-play-icon').className = 'fa-solid fa-play';
            } else {
                document.getElementById('music-play-icon').className = 'fa-solid fa-pause';
            }
        }

        function fmtTime(s) {
            if (!s || isNaN(s)) return '0:00';
            return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
        }

        function closeMusicModal() {
            const m = document.getElementById('music-modal');
            m.classList.remove('active');
            setTimeout(() => m.style.display = 'none', 300);
            const ma = document.getElementById('music-audio-player');
            ma.pause();
            clearInterval(musicProgressTimer);
        }

        document.getElementById('music-play-pause').addEventListener('click', () => {
            const ma = document.getElementById('music-audio-player');
            if (!ma.src) return;
            if (ma.paused) {
                ma.play().then(() => {
                    document.getElementById('music-play-icon').className = 'fa-solid fa-pause';
                }).catch(() => {});
            } else {
                ma.pause();
                document.getElementById('music-play-icon').className = 'fa-solid fa-play';
            }
        });

        document.getElementById('music-progress').addEventListener('input', e => {
            const ma = document.getElementById('music-audio-player');
            if (!ma || isNaN(ma.duration) || ma.duration <= 0) return;
            ma.currentTime = (e.target.value / 100) * ma.duration;
        });

        document.getElementById('music-prev').addEventListener('click', () => {
            const ma = document.getElementById('music-audio-player');
            if (!ma.src) return;
            ma.currentTime = 0;
            if (ma.paused) ma.play().catch(() => {});
            document.getElementById('music-play-icon').className = 'fa-solid fa-pause';
        });

        document.getElementById('music-next').addEventListener('click', () => {
            const ma = document.getElementById('music-audio-player');
            if (!ma.src || isNaN(ma.duration) || ma.duration <= 0) return;
            ma.currentTime = Math.min(ma.duration, ma.currentTime + 10);
            if (ma.paused) ma.play().catch(() => {});
            document.getElementById('music-play-icon').className = 'fa-solid fa-pause';
        });

        // Handle audio ended
        document.getElementById('music-audio-player').addEventListener('ended', () => {
            document.getElementById('music-play-icon').className = 'fa-solid fa-play';
            document.getElementById('music-progress').value = 100;
        });

        /* ─── BIO MUSIC ─── */
        function toggleBioMusic(e) {
            if (e) e.stopPropagation();
            const a = document.getElementById('bio-audio'),
                ic = document.getElementById('bio-play-icon'),
                eq = document.getElementById('bio-eq');
            if (!a.src) return;
            if (a.paused) {
                a.play();
                ic.className = 'fa-solid fa-pause';
                eq.classList.remove('paused');
            } else {
                a.pause();
                ic.className = 'fa-solid fa-play';
                eq.classList.add('paused');
            }
        }

        /* ─── SHARE PROFILE ─── */
        function shareProfile() {
            if (navigator.share) navigator.share({ title: activeProfile.displayName + ' | x0s.link', url: window.location
                    .href });
            else alert('Link copied!');
            document.getElementById('dropdown-menu').classList.remove('active');
        }

        /* ─── COLLEGE PROFILE OVERLAY ─── */
        let clgProfileOpen = false;

        function openCollegeProfile(idx) {
            const colleges = window.XOS_COLLEGES || [];
            const c = colleges[idx];
            if (!c) return;
            const nameParts = c.name.split(',');
            const displayName = nameParts[0].trim();
            const caption = nameParts.slice(1).join(',').trim();
            document.getElementById('acp-pfp').src = c.pfp || '1000046129.png';
            document.getElementById('acp-name').textContent = displayName + ' ' + c.id;
            document.getElementById('acp-caption').textContent = caption || 'Engineering College';
            document.getElementById('acp-pills').innerHTML =
                (c.pill1 ?
                    `<span style="padding:3px 10px;border-radius:99px;font-size:.62rem;font-weight:600;background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.2);color:#007aff;">${c.pill1}</span>` :
                    '') +
                (c.pill2 ?
                    `<span style="padding:3px 10px;border-radius:99px;font-size:.62rem;font-weight:600;background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.2);color:#007aff;">${c.pill2}</span>` :
                    '');
            clgProfileOpen = true;
            const el = document.getElementById('clg-profile-overlay');
            el.style.display = 'flex';
            requestAnimationFrame(() => requestAnimationFrame(() => el.style.transform = 'translateX(0)'));
            history.pushState({ modal: 'clg-profile' }, '');
        }

        function closeCollegeProfile(fromPop) {
            if (!clgProfileOpen) return;
            clgProfileOpen = false;
            const el = document.getElementById('clg-profile-overlay');
            el.style.transform = 'translateX(100%)';
            if (!fromPop) history.back();
            setTimeout(() => { el.style.display = 'none'; }, 380);
        }

        /* ─── COLLEGE LINK ─── */
        let clgSearchOpen = false;
        let linkedCollegeIdx = null;

        function handleCollegeLinkClick() {
            const stored = lsGet('linked_college', null);
            if (stored) {
                const colleges = window.XOS_COLLEGES || [];
                const idx = colleges.findIndex(col => col.id === stored.id);
                if (idx >= 0) { openCollegeProfile(idx); return; }
            }
            openCollegeLinkSearch();
        }

        function initCollegeLink() {
            const stored = lsGet('linked_college', null);
            if (stored) {
                setCollegeLinkUI(stored.name, true);
            } else {
                setCollegeLinkUI('+ Link College', false);
            }
        }

        function setCollegeLinkUI(name, linked) {
            const el = document.getElementById('college-link-name');
            const icon = document.getElementById('college-link-icon');
            const wrap = document.querySelector('.college-link-name-wrap');
            el.classList.toggle('linked', linked);
            icon.classList.toggle('linked', linked);
            el.classList.remove('marquee-anim');
            el.textContent = linked ? name : '+ Link College';
            requestAnimationFrame(() => {
                if (wrap && el.scrollWidth > wrap.offsetWidth && linked) {
                    el.textContent = name + '   ·   ' + name;
                    el.classList.add('marquee-anim');
                }
            });
        }

        function openCollegeLinkSearch() {
            document.getElementById('dropdown-menu').classList.remove('active');
            clgSearchOpen = true;
            const el = document.getElementById('clg-search-overlay');
            el.style.display = 'flex';
            el.classList.remove('closing');
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
            setTimeout(() => document.getElementById('clg-search-input').focus(), 400);
            history.pushState({ modal: 'clg-search' }, '');
        }

        function closeCollegeLinkSearch(fromPop) {
            if (!clgSearchOpen) return;
            clgSearchOpen = false;
            const el = document.getElementById('clg-search-overlay');
            el.classList.remove('open');
            el.classList.add('closing');
            document.getElementById('clg-search-input').value = '';
            document.getElementById('clg-results-list').innerHTML = '';
            if (!fromPop) history.back();
            setTimeout(() => { el.style.display = 'none';
                el.classList.remove('closing'); }, 340);
        }

        function onClgSearchInput(val) {
            const q = val.trim().toLowerCase().replace(/\s/g, '');
            const list = document.getElementById('clg-results-list');
            const colleges = window.XOS_COLLEGES || [];
            if (!q) { list.innerHTML = ''; return; }
            const showAll = q === '#college' || q === '#colleges';
            let matches = showAll ?
                colleges :
                colleges.filter(c => c.name.toLowerCase().replace(/\s/g, '').includes(q)).slice(0, 6);
            if (matches.length === 0) {
                list.innerHTML = `<div class="clg-no-results">No colleges found</div>`;
                return;
            }
            list.innerHTML = matches.map(c => {
                const displayName = c.name.split(',')[0].trim();
                const originalIdx = colleges.indexOf(c);
                return `<div class="clg-result-item" onclick="linkCollege(${originalIdx})">
              <img class="clg-pfp" src="${c.pfp||'1000046129.png'}" onerror="this.src='1000046129.png'" alt="">
              <div style="flex:1;min-width:0;">
                <div class="clg-name">${displayName}</div>
                <div class="clg-id">${c.id}</div>
              </div>
              <i class="fa-solid fa-link clg-chevron"></i>
            </div>`;
            }).join('');
        }

        function linkCollege(idx) {
            const colleges = window.XOS_COLLEGES || [];
            const c = colleges[idx];
            if (!c) return;
            const displayName = c.name.split(',')[0].trim();
            lsSet('linked_college', { id: c.id, name: displayName, pfp: c.pfp || '' });
            setCollegeLinkUI(displayName, true);
            closeCollegeLinkSearch();
        }

        /* ─── INIT ─── */
        document.addEventListener('DOMContentLoaded', () => {
            renderProfile();
        });
    </script>

</body></html>
