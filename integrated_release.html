<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="page-title">XOS Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/xbit-proton/fa-arattai@latest/arattai.css">
    <style>
        :root {
            --bg: #000;
            --card: #0a0a0a;
            --card2: #111;
            --border: #1a1a1a;
            --border2: rgba(255, 255, 255, .06);
            --accent: #007aff;
            --text: #fff;
            --muted: #666;
            --muted2: #444;
            --glass: rgba(10, 10, 10, .75);
            --ease: cubic-bezier(.4, 0, .2, 1);
            --font: 'Space Grotesk', sans-serif;
            --badge-gold-from: #BF953F;
            --badge-gold-mid1: #FCF6BA;
            --badge-gold-mid2: #B38728;
            --badge-gold-mid3: #FBF5B7;
            --badge-gold-to: #AA771C;
            --badge-blue: #1d9bf0;
            --badge-green: #25D366;
        }
        .light-mode {
            --bg: #fff;
            --card: #f5f5f7;
            --card2: #f0f0f2;
            --border: #e0e0e2;
            --border2: rgba(0, 0, 0, .07);
            --text: #000;
            --muted: #888;
            --glass: rgba(255, 255, 255, .82);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background .35s var(--ease), color .35s var(--ease);
        }
        ::-webkit-scrollbar {
            display: none;
        }

        /* KEYFRAMES */
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0
            }
            to {
                transform: translateY(0);
                opacity: 1
            }
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }
            50% {
                opacity: .8;
                transform: scale(.95)
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        @keyframes shimmer {
            0% {
                left: -100%
            }
            100% {
                left: 100%
            }
        }
        @keyframes eqBar {
            from {
                height: 2px
            }
            to {
                height: 10px
            }
        }
        @keyframes likeHeartPop {
            0% {
                transform: scale(1)
            }
            30% {
                transform: scale(1.55)
            }
            60% {
                transform: scale(.88)
            }
            100% {
                transform: scale(1)
            }
        }
        @keyframes muteFlash {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.6)
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1)
            }
            70% {
                opacity: 1
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.8)
            }
        }
        @keyframes dtFlash {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.55)
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.08)
            }
            55% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1)
            }
            85% {
                opacity: 1
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.85)
            }
        }
        @keyframes pfpIn {
            from {
                opacity: 0;
                transform: scale(.88)
            }
            to {
                opacity: 1;
                transform: scale(1)
            }
        }
        @keyframes pfpOut {
            from {
                opacity: 1;
                transform: scale(1)
            }
            to {
                opacity: 0;
                transform: scale(.88)
            }
        }

        /* PAGE */
        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        /* TOP BAR */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border2);
        }
        .light-mode .top-bar {
            background: rgba(255, 255, 255, .72);
            border-bottom: 1px solid var(--border);
        }
        .top-bar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -.03em;
            color: #fff;
            line-height: 1;
        }
        .top-bar-brand span {
            color: #fff;
        }

        /* FLOATING MENU */
        .floating-menu-wrap {
            position: absolute;
            top: 0;
            right: 20px;
            z-index: 90;
        }
        .floating-menu-wrap .menu-btn {
            background: rgba(0, 0, 0, .35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            color: #fff;
        }
        .floating-menu-wrap .dropdown-menu {
            top: 46px;
        }
        .menu-btn {
            width: 36px;
            height: 36px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
            position: relative;
        }
        .dropdown-menu {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            display: none;
            z-index: 100;
            min-width: 170px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            animation: fadeIn .2s var(--ease);
        }
        .dropdown-menu.active {
            display: block;
        }
        .menu-item {
            padding: 10px 14px;
            font-size: .75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            transition: .2s;
        }
        .menu-item:hover {
            background: var(--border);
        }
        .menu-item i {
            color: var(--accent);
            font-size: .85rem;
        }

        /* BANNER */
        .banner {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #000814 0%, #001d3d 60%, #000 100%);
        }
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .55;
        }
        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 30%, var(--bg) 100%);
        }

        /* PROFILE */
        .profile-section {
            padding: 0 20px;
            margin-top: -52px;
            position: relative;
            animation: slideUp .6s var(--ease) both;
        }
        .follow-btn {
            position: absolute;
            right: 20px;
            top: 65px;
            padding: 10px 30px;
            background: rgba(255, 255, 255, .9);
            color: #000;
            border: none;
            border-radius: 30px;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .4);
            font-family: var(--font);
            outline: none;
            -webkit-appearance: none;
        }
        .follow-btn.following {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .avatar-wrap {
            width: 84px;
            height: 84px;
            position: relative;
            margin-bottom: 14px;
            cursor: pointer;
        }
        .avatar-wrap:active .avatar-img {
            transform: scale(.94);
            opacity: .85;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
            border: 1px solid var(--border);
            display: block;
            transition: transform .18s var(--ease), opacity .18s var(--ease);
        }

        /* PFP BADGE — verified tick on avatar */
        .pfp-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            background: var(--bg);
            border-radius: 50%;
            border: 1.5px solid var(--bg);
            overflow: hidden;
            animation: pulse 3s infinite ease-in-out;
        }
        .pfp-badge .fa-certificate {
            font-size: 18px;
            position: absolute;
            background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pfp-badge .fa-check {
            font-size: 8px;
            color: #000;
            position: relative;
            z-index: 6;
            font-weight: 900;
        }
        .pfp-badge::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .8) 50%, transparent 70%);
            animation: shimmer 2s infinite linear;
            z-index: 7;
        }
        /* Blue verified */
        .pfp-badge.badge-blue {
            background: var(--badge-blue);
            border-color: var(--badge-blue);
            animation: none;
        }
        .pfp-badge.badge-blue .fa-certificate {
            display: none;
        }
        .pfp-badge.badge-blue .fa-check {
            font-size: 10px;
            color: #fff;
        }
        .pfp-badge.badge-blue::after {
            display: none;
        }
        /* Green verified */
        .pfp-badge.badge-green {
            background: var(--badge-green);
            border-color: var(--badge-green);
            animation: none;
        }
        .pfp-badge.badge-green .fa-certificate {
            display: none;
        }
        .pfp-badge.badge-green .fa-check {
            font-size: 10px;
            color: #fff;
        }
        .pfp-badge.badge-green::after {
            display: none;
        }
        /* Hidden badge */
        .pfp-badge.badge-none {
            display: none;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .name {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -.01em;
        }
        .handle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .handle {
            font-size: .72rem;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: .06em;
        }
        .follower-stat {
            font-size: .72rem;
            color: var(--muted);
            display: flex;
            gap: 12px;
        }
        .follower-stat b {
            color: var(--text);
        }
        .bio {
            font-size: .82rem;
            color: var(--muted);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .bio-music {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 14px;
            width: fit-content;
            max-width: 100%;
        }
        .bio-music-play {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: .7rem;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity .15s;
            padding: 0;
            outline: none;
            -webkit-appearance: none;
        }
        .bio-music-play:active {
            opacity: .5;
        }
        .bio-music-label {
            font-size: .78rem;
            font-weight: 400;
            color: var(--muted);
            white-space: nowrap;
            cursor: pointer;
        }
        .bio-music-eq {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 12px;
            flex-shrink: 0;
            margin-left: 2px;
        }
        .bio-music-eq span {
            width: 2.5px;
            background: #fff;
            border-radius: 2px;
            min-height: 2px;
            transition: opacity .3s;
        }
        .bio-music-eq span:nth-child(1) {
            animation: eqBar .7s .0s infinite alternate ease-in-out;
        }
        .bio-music-eq span:nth-child(2) {
            animation: eqBar .7s .15s infinite alternate ease-in-out;
        }
        .bio-music-eq span:nth-child(3) {
            animation: eqBar .7s .3s infinite alternate ease-in-out;
        }
        .bio-music-eq span:nth-child(4) {
            animation: eqBar .7s .1s infinite alternate ease-in-out;
        }
        .bio-music-eq.paused span {
            animation-play-state: paused;
            opacity: .25;
        }
        .links-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .link-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: .72rem;
            font-weight: 600;
            white-space: nowrap;
            transition: .2s;
        }

        /* POSTS GRID 3:4 */
        .posts-section {
            padding: 0 16px 100px;
        }
        .section-label {
            font-size: .65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .22em;
            color: var(--muted);
            margin-bottom: 14px;
            display: block;
        }
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .post-thumb {
            aspect-ratio: 3/4;
            border-radius: 10px;
            overflow: hidden;
            background: var(--card);
            cursor: pointer;
            position: relative;
            transition: transform .15s var(--ease), opacity .15s;
        }
        .post-thumb:active {
            transform: scale(.96);
            opacity: .85;
        }
        .post-thumb video,
        .post-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .4s var(--ease);
        }
        .post-thumb:hover video,
        .post-thumb:hover img {
            transform: scale(1.04);
        }
        .post-thumb::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, .45) 0%, transparent 45%);
            pointer-events: none;
            border-radius: 10px;
        }
        .vid-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            z-index: 2;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: .55rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: .06em;
        }
        .multi-badge {
            position: absolute;
            top: 7px;
            left: 7px;
            z-index: 2;
            color: #fff;
            font-size: .75rem;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .7));
        }

        /* ════════════════════════════
       POST MODAL — CINEMATIC SHEET
    ════════════════════════════ */
        .post-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transition: background .32s var(--ease);
            overscroll-behavior: contain;
        }
        .post-modal-backdrop.active {
            background: rgba(0, 0, 0, .93);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .post-modal-sheet {
            width: 100%;
            max-width: 480px;
            background: #090909;
            border-radius: 26px 26px 0 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: translateY(102%);
            transition: transform .42s cubic-bezier(.32, .72, 0, 1);
            border: 1px solid rgba(255, 255, 255, .07);
            border-bottom: none;
            position: relative;
            will-change: transform;
            touch-action: pan-y;
        }
        .post-modal-backdrop.active .post-modal-sheet {
            transform: translateY(0);
        }
        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, .2);
            border-radius: 2px;
            margin: 10px auto 0;
            flex-shrink: 0;
        }

        /* MEDIA */
        .sheet-media {
            width: 100%;
            background: #000;
            aspect-ratio: 3/4;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sheet-media img,
        .sheet-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .mute-tap-zone {
            position: absolute;
            inset: 0;
            z-index: 6;
            cursor: pointer;
            display: none;
        }
        .mute-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.6);
            width: 54px;
            height: 54px;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, .18);
        }
        .mute-indicator.flash {
            animation: muteFlash .7s var(--ease) forwards;
        }
        .sheet-media-toprow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0, 0, 0, .6), transparent);
            z-index: 10;
            pointer-events: none;
        }
        .sheet-close-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, .1);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            font-size: .82rem;
            border: 1px solid rgba(255, 255, 255, .12);
            transition: background .2s;
            pointer-events: all;
        }
        .sheet-close-btn:active {
            background: rgba(255, 255, 255, .22);
        }
        .sheet-counter {
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .08em;
            color: rgba(255, 255, 255, .75);
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, .1);
            pointer-events: none;
        }
        .sheet-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 10;
            pointer-events: none;
        }
        .sheet-dot {
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .35);
            transition: background .25s, width .25s, transform .25s;
            width: 5px;
        }
        .sheet-dot.active {
            background: #fff;
            transform: scale(1.2);
            width: 14px;
        }
        .dt-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.55);
            width: 62px;
            height: 62px;
            background: rgba(0, 0, 0, .62);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            pointer-events: none;
            opacity: 0;
            z-index: 21;
            border: 1px solid rgba(255, 100, 100, .28);
            color: #ff3b5c;
        }
        .dt-indicator.flash {
            animation: dtFlash .75s var(--ease) forwards;
        }

        /* SHEET VERIFIED BADGE */
        .sheet-verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 12px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            vertical-align: middle;
            margin-left: 5px;
            background: transparent;
            border-radius: 50%;
            animation: pulse 3s infinite ease-in-out;
        }
        .sheet-verified .fa-certificate {
            font-size: 12px;
            position: absolute;
            background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sheet-verified .fa-check {
            font-size: 7px;
            color: #000;
            position: relative;
            z-index: 6;
            font-weight: 900;
        }
        .sheet-verified::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .8) 50%, transparent 70%);
            animation: shimmer 2s infinite linear;
            z-index: 7;
        }
        /* Blue sheet verified */
        .sheet-verified.badge-blue {
            background: var(--badge-blue);
            animation: none;
        }
        .sheet-verified.badge-blue .fa-certificate {
            display: none;
        }
        .sheet-verified.badge-blue .fa-check {
            font-size: 8px;
            color: #fff;
        }
        .sheet-verified.badge-blue::after {
            display: none;

        .bio-music-eq span{width:2.5px;background:#fff;border-radius:2px;min-height:2px;transition:opacity .3s;}
        .bio-music-eq span:nth-child(1){animation:eqBar .7s .0s infinite alternate ease-in-out;}
        .bio-music-eq span:nth-child(2){animation:eqBar .7s .15s infinite alternate ease-in-out;}
        .bio-music-eq span:nth-child(3){animation:eqBar .7s .3s infinite alternate ease-in-out;}
        .bio-music-eq span:nth-child(4){animation:eqBar .7s .1s infinite alternate ease-in-out;}
        .bio-music-eq.paused span{animation-play-state:paused;opacity:.25;}
        .links-row{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
        .link-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);font-size:.72rem;font-weight:600;white-space:nowrap;transition:.2s;}
        .posts-section{padding:0 16px 100px;}
        .section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);margin-bottom:14px;display:block;}
        .posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
        .post-thumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;position:relative;transition:transform .15s var(--ease),opacity .15s;}
        .post-thumb:active{transform:scale(.96);opacity:.85;}
        .post-thumb video,.post-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease);}
        .post-thumb:hover video,.post-thumb:hover img{transform:scale(1.04);}
        .post-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45) 0%,transparent 45%);pointer-events:none;border-radius:10px;}
        .vid-badge{position:absolute;top:7px;right:7px;z-index:2;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 6px;font-size:.55rem;font-weight:700;color:#fff;letter-spacing:.06em;}
        .multi-badge{position:absolute;top:7px;left:7px;z-index:2;color:#fff;font-size:.75rem;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));}
        .post-modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);display:none;flex-direction:column;align-items:center;justify-content:flex-end;transition:background .32s var(--ease);overscroll-behavior:contain;}
        .post-modal-backdrop.active{background:rgba(0,0,0,.93);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
        .post-modal-sheet{width:100%;max-width:480px;background:#090909;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .42s cubic-bezier(.32,.72,0,1);border:1px solid rgba(255,255,255,.07);border-bottom:none;position:relative;will-change:transform;touch-action:pan-y;}
        .post-modal-backdrop.active .post-modal-sheet{transform:translateY(0);}
        .sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
        .sheet-media{width:100%;background:#000;aspect-ratio:3/4;position:relative;overflow:hidden;flex-shrink:0;}
        .sheet-media img,.sheet-media video{width:100%;height:100%;object-fit:cover;display:block;}
        .mute-tap-zone{position:absolute;inset:0;z-index:6;cursor:pointer;display:none;}
        .mute-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);width:54px;height:54px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;pointer-events:none;opacity:0;z-index:20;border:1px solid rgba(255,255,255,.18);}
        .mute-indicator.flash{animation:muteFlash .7s var(--ease) forwards;}
        .sheet-media-toprow{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);z-index:10;pointer-events:none;}
        .sheet-close-btn{width:32px;height:32px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;font-size:.82rem;border:1px solid rgba(255,255,255,.12);transition:background .2s;pointer-events:all;}
        .sheet-close-btn:active{background:rgba(255,255,255,.22);}
        .sheet-counter{font-size:.62rem;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.1);pointer-events:none;}
        .sheet-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;pointer-events:none;}
        .sheet-dot{height:5px;border-radius:3px;background:rgba(255,255,255,.35);transition:background .25s,width .25s,transform .25s;width:5px;}
        .sheet-dot.active{background:#fff;transform:scale(1.2);width:14px;}
        .dt-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.55);width:62px;height:62px;background:rgba(0,0,0,.62);backdrop-filter:blur(12px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;pointer-events:none;opacity:0;z-index:21;border:1px solid rgba(255,100,100,.28);color:#ff3b5c;}
        .dt-indicator.flash{animation:dtFlash .75s var(--ease) forwards;}
        .sheet-verified{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;position:relative;overflow:hidden;flex-shrink:0;vertical-align:middle;margin-left:5px;background:transparent;border-radius:50%;animation:pulse 3s infinite ease-in-out;}
        .sheet-verified .fa-certificate{font-size:12px;position:absolute;background:linear-gradient(45deg,#BF953F,#FCF6BA,#B38728,#FBF5B7,#AA771C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .sheet-verified .fa-check{font-size:7px;color:#000;position:relative;z-index:6;font-weight:900;}
        .sheet-verified::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);animation:shimmer 2s infinite linear;z-index:7;}
        .sheet-verified.badge-blue{background:var(--badge-blue);animation:none;}
        .sheet-verified.badge-blue .fa-certificate{display:none;}
        .sheet-verified.badge-blue .fa-check{font-size:8px;color:#fff;}
        .sheet-verified.badge-blue::after{display:none;}
        .sheet-verified.badge-green{background:var(--badge-green);animation:none;}
        .sheet-verified.badge-green .fa-certificate{display:none;}
        .sheet-verified.badge-green .fa-check{font-size:8px;color:#fff;}
        .sheet-verified.badge-green::after{display:none;}
        .sheet-verified.badge-none{display:none;}
        .pfp-viewer-backdrop{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0);display:none;align-items:center;justify-content:center;transition:background .28s var(--ease);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);}
        .pfp-viewer-backdrop.active{background:rgba(0,0,0,.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);}
        .pfp-viewer-box{position:relative;width:min(88vw,420px);height:min(88vw,420px);border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 32px 80px rgba(0,0,0,.9);opacity:0;}
        .pfp-viewer-backdrop.active .pfp-viewer-box{animation:pfpIn .32s cubic-bezier(.32,.72,0,1) forwards;}
        .pfp-viewer-backdrop.closing .pfp-viewer-box{animation:pfpOut .24s var(--ease) forwards;}
        .pfp-viewer-box img{width:100%;height:100%;object-fit:cover;display:block;}
        .pfp-back-btn{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:7px 13px 7px 10px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.13);border-radius:99px;color:#fff;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.02em;transition:background .18s;z-index:10;outline:none;-webkit-appearance:none;}
        .pfp-back-btn:active{background:rgba(0,0,0,.75);}
        .pfp-back-btn i{font-size:.75rem;}
        .sheet-info{padding:13px 18px 28px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex-shrink:0;}
        .sheet-user-row{display:flex;align-items:center;gap:10px;}
        .sheet-avatar{width:34px;height:34px;border-radius:10px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
        .sheet-user-info{flex:1;}
        .sheet-username{font-size:.78rem;font-weight:700;}
        .sheet-handle-tag{font-size:.62rem;color:var(--muted);}
        .sheet-post-time{font-size:.6rem;color:var(--muted2);margin-left:auto;white-space:nowrap;}
        .sheet-caption{font-size:.8rem;color:rgba(255,255,255,.78);line-height:1.6;font-weight:300;}
        .sheet-actions{display:flex;align-items:center;border-top:1px solid var(--border);padding-top:12px;margin-top:2px;gap:2px;}
        .sheet-action-btn{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;font-size:.72rem;color:var(--muted);font-weight:600;user-select:none;transition:color .2s;border-radius:10px;}
        .sheet-action-btn i{font-size:1.05rem;transition:transform .2s,color .2s;}
        .sheet-action-btn:active i{transform:scale(.82);}
        .sheet-action-btn.liked{color:#ff3b5c;}
        .sheet-action-btn.liked i{animation:likeHeartPop .4s var(--ease);}
        .sheet-action-spacer{flex:1;}
        .comment-input-wrap{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:10px 14px;}
        .comment-avatar{width:26px;height:26px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
        .comment-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.78rem;font-family:var(--font);caret-color:var(--accent);}
        .comment-input::placeholder{color:var(--muted2);}
        .comment-send{color:var(--accent);font-size:.85rem;cursor:pointer;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;flex-shrink:0;}
        .comment-send.visible{opacity:1;transform:scale(1);}
        .music-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;opacity:0;transition:.3s;}
        .music-modal.active{display:flex;opacity:1;}
        .music-box{width:82vw;max-width:340px;background:#000;border:1px solid var(--border);border-radius:26px;overflow:hidden;padding:24px 20px 28px;transform:scale(.9);transition:.35s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.9);position:relative;}
        .music-modal.active .music-box{transform:scale(1);}
        .music-thumb-wrap{width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#0a0a14;position:relative;margin-bottom:18px;}
        .music-thumb{width:100%;height:100%;object-fit:cover;}
        .music-play-big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
        .music-play-circle{width:56px;height:56px;border-radius:50%;background:rgba(0,122,255,.75);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:.2s;}
        .music-title{font-size:.9rem;font-weight:700;text-align:center;margin-bottom:2px;}
        .music-artist{font-size:.68rem;color:var(--muted);text-align:center;margin-bottom:16px;}
        .music-progress{width:100%;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;margin-bottom:6px;accent-color:var(--accent);}
        .music-progress::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:pointer;}
        .music-times{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-bottom:16px;font-family:monospace;}
        .music-controls{display:flex;align-items:center;justify-content:center;gap:28px;}
        .music-ctrl{color:var(--muted);font-size:.9rem;cursor:pointer;}
        .music-close{position:absolute;top:14px;right:14px;width:32px;height:32px;background:rgba(255,255,255,.08);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:10;}
        .college-link-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;max-width:100%;overflow:hidden;}
        .college-link-icon{font-size:.78rem;color:var(--muted);flex-shrink:0;}
        .college-link-name-wrap{overflow:hidden;max-width:260px;}
        .college-link-name{font-size:.76rem;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-block;}
        .college-link-name.linked{color:rgba(255,255,255,.75);}
        .college-link-icon.linked{color:rgba(255,255,255,.75);}
        .college-link-name.marquee-anim{animation:clgMarquee 7s linear infinite;padding-right:40px;}
        @keyframes clgMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        @keyframes clgSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes clgSlideDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
        .clg-search-overlay{position:fixed;inset:0;z-index:600;background:var(--bg);display:none;flex-direction:column;transform:translateY(100%);}
        .clg-search-overlay.open{display:flex;animation:clgSlideUp .38s cubic-bezier(.32,.72,0,1) forwards;}
        .clg-search-overlay.closing{display:flex;animation:clgSlideDown .32s cubic-bezier(.32,.72,0,1) forwards;}
        .clg-top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);flex-shrink:0;}
        .clg-back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:.82rem;cursor:pointer;flex-shrink:0;}
        .clg-back:active{background:rgba(255,255,255,.1);}
        .clg-search-bar{flex:1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid var(--border2);border-radius:12px;padding:10px 13px;}
        .clg-search-bar i{font-size:.8rem;color:var(--muted);flex-shrink:0;}
        .clg-search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.86rem;font-family:var(--font);caret-color:var(--accent);}
        .clg-search-input::placeholder{color:var(--muted);}
        .clg-results{flex:1;overflow-y:auto;padding:14px 16px 40px;}
        .clg-result-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border2);cursor:pointer;border-radius:12px;transition:background .14s;}
        .clg-result-item:active{background:rgba(255,255,255,.04);}
        .clg-pfp{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--border);background:var(--card);flex-shrink:0;}
        .clg-name{font-size:.84rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .clg-id{font-size:.62rem;color:var(--muted);margin-top:2px;}
        .clg-chevron{color:var(--muted);font-size:.72rem;flex-shrink:0;}
        .clg-no-results{text-align:center;padding:48px 0;color:var(--muted);font-size:.82rem;}
        .clg-hint{font-size:.68rem;color:var(--muted);margin-bottom:14px;padding:0 2px;}
        .color-twitter{color:#fff;}.color-linkedin{color:#0077b5;}.color-discord{color:#5865f2;}.color-globe{color:var(--accent);}.color-instagram{color:#e1306c;}.color-github{color:#fff;}.color-arattai{color:#007aff;}
        :root {--badge-blue:#1d9bf0;--badge-green:#25D366;}

<body>

    <!-- Hidden audio elements -->
    <audio id="bio-audio" loop="" preload="auto"></audio>
    <audio id="music-audio-player" preload="auto"></audio>

    <!-- POST MODAL -->
    <div class="post-modal-backdrop" id="post-modal">
        <div class="post-modal-sheet" id="post-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-media ratio-45" id="sheet-media">
                <div class="sheet-media-toprow">
                    <div class="sheet-close-btn" onclick="closePostModal()"><i class="fa-solid fa-xmark"></i></div>
                    <div class="sheet-counter" id="sheet-counter" style="display:none"></div>
                </div>
                <div class="mute-tap-zone" id="mute-tap-zone"></div>
                <div id="carousel-strip" style="position:absolute;inset:0;display:flex;width:300%;transform:translateX(-33.333%);will-change:transform;">
                    <div id="slide-prev" style="width:33.333%;height:100%;flex-shrink:0;overflow:hidden;"><img id="img-prev" style="width:100%;height:100%;object-fit:cover;display:block;" alt=""></div>
                    <div id="slide-curr" style="width:33.333%;height:100%;flex-shrink:0;overflow:hidden;"><img id="img-curr" style="width:100%;height:100%;object-fit:cover;display:block;" alt=""><video id="sheet-video" style="width:100%;height:100%;object-fit:cover;display:none;" playsinline="" loop=""></video></div>
                    <div id="slide-next" style="width:33.333%;height:100%;flex-shrink:0;overflow:hidden;"><img id="img-next" style="width:100%;height:100%;object-fit:cover;display:block;" alt=""></div>
                </div>
                <div class="mute-indicator" id="mute-indicator">
                    <i id="mute-icon" class="fa-solid fa-volume-xmark"></i>
                </div>
                <div class="dt-indicator" id="dt-indicator">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div id="sheet-dots" class="sheet-dots"></div>
            </div>
            <div class="sheet-info">
                <div class="sheet-user-row">
                    <img class="sheet-avatar" id="sheet-avatar-img" src="" alt="">
                    <div class="sheet-user-info">
                        <div class="sheet-username" id="sheet-display-name"></div>
                        <div class="sheet-handle-tag" id="sheet-handle-tag"></div>
                    </div>
                    <div class="sheet-post-time" id="sheet-time">just now</div>
                </div>
                <div class="sheet-caption" id="sheet-caption"></div>
                <div class="sheet-actions">
                    <div class="sheet-action-btn" id="like-btn" onclick="toggleLike(event)">
                        <i class="fa-regular fa-heart" id="like-icon"></i>
                        <span id="like-count">0</span>
                    </div>
                    <div class="sheet-action-btn" onclick="focusComment()">
                        <i class="fa-regular fa-comment"></i>
                        <span id="comment-count">0</span>
                    </div>
                    <div class="sheet-action-spacer"></div>
                    <div class="sheet-action-btn" onclick="sharePost()">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </div>
                </div>
                <div class="comment-input-wrap">
                    <img class="comment-avatar" id="comment-avatar-img" src="" alt="">
                    <input class="comment-input" id="comment-input" type="text" placeholder="Add a comment…" oninput="onCommentInput(this)" onkeydown="onCommentKey(event)">
                    <i class="fa-solid fa-paper-plane comment-send" id="comment-send" onclick="sendComment()"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- MUSIC MODAL -->
    <div class="music-modal" id="music-modal" onclick="closeMusicModal()">
        <div class="music-box" onclick="event.stopPropagation()">
            <div class="music-close" onclick="closeMusicModal()"><i class="fa-solid fa-xmark"></i></div>
            <div class="music-thumb-wrap">
                <img class="music-thumb" id="music-thumb" src="" alt="">
                <div class="music-play-big">
                    <div class="music-play-circle" id="music-play-pause">
                        <i class="fa-solid fa-play" id="music-play-icon"></i>
                    </div>
                </div>
            </div>
            <div class="music-title" id="music-title-display">Track Title</div>
            <div class="music-artist" id="music-artist-display">Artist</div>
            <input type="range" class="music-progress" id="music-progress" value="0" min="0" max="100" step="0.1">
            <div class="music-times"><span id="music-current">0:00</span><span id="music-duration">0:00</span></div>
            <div class="music-controls">
                <div class="music-ctrl" id="music-prev"><i class="fa-solid fa-backward"></i></div>
                <div class="music-ctrl" id="music-next"><i class="fa-solid fa-forward"></i></div>
            </div>
        </div>
    </div>

    <!-- PFP VIEWER -->
    <div class="pfp-viewer-backdrop" id="pfp-viewer" onclick="closePfpViewer()">
        <div class="pfp-viewer-box" onclick="event.stopPropagation()">
            <button class="pfp-back-btn" onclick="closePfpViewer()">
                <i class="fa-solid fa-chevron-left"></i> Back
            </button>
            <img id="pfp-viewer-img" src="" alt="Profile">
        </div>
    </div>

    <div class="page">
        <div class="top-bar">
            <div class="top-bar-brand">x<span>0</span>s.link</div>
        </div>

        <!-- FLOATING MENU -->
        <div class="floating-menu-wrap" style="position:absolute;top:56px;right:20px;">
            <div class="menu-btn" onclick="toggleMenu(event)"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            <div class="dropdown-menu" id="dropdown-menu">
                <div class="menu-item" onclick="shareProfile()"><span>Share</span><i class="fa-solid fa-share-nodes"></i></div>
                <div class="menu-item" onclick="toggleDarkMode()"><span>Appearance</span><i class="fa-solid fa-circle-half-stroke"></i></div>
                <div class="menu-item" onclick="openCollegeLinkSearch()"><span>Link College</span><i class="fa-solid fa-building-columns"></i></div>
            </div>
        </div>

        <div class="banner">
            <img class="banner-img" id="banner-img" src="" alt="Banner">
            <div class="banner-overlay"></div>

        <section class="profile-section">

    <!-- Load profiles data first, then colleges -->
    <script src="profiles.js">
    </script>
