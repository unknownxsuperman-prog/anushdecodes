<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Favourites · x0s</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#090909;--card:#141414;--card2:#1b1b1b;
  --border:#232323;--border2:rgba(255,255,255,.06);
  --accent:#007aff;--text:#fff;--muted:#666;--muted2:#3a3a3a;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.32,.72,0,1);
  --font:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{display:none;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes searchUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes searchDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,.25)}50%{box-shadow:0 0 0 8px rgba(0,122,255,0)}}

.wallpaper{width:100%;height:36vh;min-height:200px;max-height:280px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0a0a1a 0%,#0d1b2a 50%,#050510 100%);}
.wallpaper img{width:100%;height:100%;object-fit:cover;display:block;opacity:.72;}
.wallpaper-fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,9,9,0) 0%,rgba(9,9,9,0) 45%,rgba(9,9,9,.65) 78%,rgba(9,9,9,1) 100%);}

.top-bar{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:20;}
.tb-back,.tb-edit{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.38);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.85);font-size:.82rem;flex-shrink:0;transition:background .15s,all .18s;}
.tb-back:active{background:rgba(0,0,0,.65);}
.tb-title{flex:1;font-size:1.05rem;font-weight:700;letter-spacing:-.02em;color:#fff;}
.tb-edit.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tb-edit:active{transform:scale(.9);}

.content{padding:0 16px;margin-top:-56px;position:relative;z-index:10;padding-bottom:120px;}

.tabs{display:flex;gap:3px;background:#0f0f0f;border:1px solid rgba(255,255,255,.055);border-radius:18px;padding:4px;margin-bottom:20px;animation:slideUp .44s var(--spring) both;box-shadow:0 2px 4px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.5);}
.tab{flex:1;text-align:center;padding:11px 0;font-size:.72rem;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.28);cursor:pointer;border-radius:14px;transition:all .2s var(--ease);user-select:none;}
.tab i{margin-right:5px;font-size:.66rem;}
.tab.active{background:#141414;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 12px rgba(0,0,0,.4);}
.tab:active{transform:scale(.96);}

.panel{display:none;}
.panel.active{display:block;animation:slideUp .36s var(--spring) both;}

.sub-tabs{display:flex;gap:3px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:3px;margin-bottom:18px;}
.sub-tab{flex:1;text-align:center;padding:8px 0;font-size:.65rem;font-weight:600;color:rgba(255,255,255,.28);cursor:pointer;border-radius:9px;transition:all .2s;user-select:none;}
.sub-tab.active{background:rgba(255,255,255,.08);color:#fff;}
.sub-tab:active{transform:scale(.95);}

.section-lbl{display:block;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:rgba(255,255,255,.18);margin:20px 0 12px 2px;}
.section-lbl:first-child{margin-top:0;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}

.item-card{background:#141414;border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;transition:transform .15s var(--ease),border-color .15s;animation:rowIn .32s var(--ease) both;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.item-card:active{transform:scale(.96);border-color:rgba(255,255,255,.1);}

.card-art-wrap,.card-poster-wrap{position:relative;overflow:hidden;background:var(--card2);}
.card-art{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--card2);}
.card-poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--card2);}
.card-poster-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,9,.72) 0%,transparent 55%);pointer-events:none;}

.card-art-wrap.loading::after,.card-poster-wrap.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.05) 50%,transparent 100%);transform:translateX(-100%);animation:shimmer 1.5s ease infinite;}

.card-badge{position:absolute;top:7px;left:7px;z-index:3;padding:2px 8px;border-radius:6px;font-size:.5rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.7);}
.card-badge.music{background:rgba(0,200,150,.18);border-color:rgba(0,200,150,.14);color:#4dd9b0;}
.card-badge.movie{background:rgba(255,200,50,.16);border-color:rgba(255,200,50,.12);color:#ffd866;}
.card-badge.series{background:rgba(50,200,255,.18);border-color:rgba(50,200,255,.14);color:#66d9ff;}
.card-badge.anime{background:rgba(255,70,150,.2);border-color:rgba(255,70,150,.16);color:#ff6b9d;}

.card-rating{position:absolute;bottom:8px;right:8px;z-index:3;padding:2px 8px;border-radius:6px;font-size:.52rem;font-weight:700;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.72);}

.card-play{position:absolute;bottom:8px;right:8px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.66rem;cursor:pointer;transition:background .18s,transform .15s;}
.card-play:active{transform:scale(.85);}
.card-play.playing{background:var(--accent);border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite;}

.card-remove{position:absolute;top:6px;right:6px;z-index:10;width:24px;height:24px;border-radius:50%;background:rgba(255,59,48,.9);display:none;align-items:center;justify-content:center;color:#fff;font-size:.58rem;cursor:pointer;transition:transform .15s;}
.card-remove:active{transform:scale(.85);}
.edit-mode .card-remove{display:flex;}
.edit-mode .card-play,.edit-mode .card-rating{opacity:0;pointer-events:none;}

.card-info{padding:9px 10px 11px;}
.card-title{font-size:.72rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.card-sub{font-size:.58rem;color:rgba(255,255,255,.35);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{font-size:.52rem;font-weight:600;color:rgba(255,255,255,.18);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;gap:10px;color:rgba(255,255,255,.18);text-align:center;grid-column:1/-1;}
.empty i{font-size:1.8rem;opacity:.2;}
.empty p{font-size:.76rem;}
.empty span{font-size:.6rem;color:rgba(255,255,255,.1);margin-top:2px;}

.add-fab{position:fixed;bottom:20px;right:20px;z-index:80;width:52px;height:52px;border-radius:16px;background:#fff;color:#090909;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 20px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.4);transition:transform .18s var(--spring),opacity .18s,bottom .2s var(--ease);animation:slideUp .5s var(--spring) .2s both;}
.add-fab:active{transform:scale(.9);}

.player-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:rgba(20,20,20,.95);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:10px 14px 10px 12px;display:flex;align-items:center;gap:12px;z-index:90;box-shadow:0 4px 32px rgba(0,0,0,.7);transition:transform .32s var(--ease),opacity .32s var(--ease);}
.player-bar.hidden{transform:translateX(-50%) translateY(90px);opacity:0;pointer-events:none;}
.pb-progress{position:absolute;bottom:0;left:0;right:0;height:2px;border-radius:0 0 20px 20px;overflow:hidden;background:rgba(255,255,255,.06);}
.pb-fill{height:100%;width:0%;background:#fff;border-radius:0 0 20px 20px;transition:width .3s linear;}
.pb-art{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid rgba(255,255,255,.06);}
.pb-info{flex:1;min-width:0;}
.pb-title{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pb-artist{font-size:.58rem;color:rgba(255,255,255,.36);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pb-time{font-size:.5rem;font-weight:600;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:30px;text-align:right;}
.pb-controls{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.pb-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:.8rem;cursor:pointer;padding:4px;display:flex;align-items:center;transition:color .15s,transform .15s;}
.pb-btn:active{transform:scale(.82);}
.pb-play{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#090909;font-size:.7rem;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;}
.pb-play:active{transform:scale(.88);}

.search-overlay{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;}
.search-overlay.open{display:flex;animation:searchUp .42s var(--spring) forwards;}
.search-overlay.closing{display:flex;animation:searchDown .34s var(--spring) forwards;}
.search-top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(9,9,9,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.search-back{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.82rem;cursor:pointer;flex-shrink:0;}
.search-bar{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 13px;transition:border-color .2s;}
.search-bar:focus-within{border-color:rgba(255,255,255,.2);}
.search-bar i{color:rgba(255,255,255,.28);font-size:.82rem;flex-shrink:0;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:var(--font);font-size:.88rem;caret-color:#fff;}
.search-input::placeholder{color:rgba(255,255,255,.22);}
.search-type-row{display:flex;gap:3px;padding:10px 16px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.s-type{flex-shrink:0;padding:7px 14px;font-size:.65rem;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border-radius:10px;border:1px solid rgba(255,255,255,.06);transition:all .18s;white-space:nowrap;}
.s-type.active{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.12);}
.s-type:active{transform:scale(.95);}
.search-results{flex:1;overflow-y:auto;padding:4px 16px 40px;}
.s-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;animation:rowIn .22s var(--ease) both;}
.s-item:last-child{border-bottom:none;}
.s-item:active{opacity:.7;}
.s-img{width:46px;height:62px;border-radius:9px;object-fit:cover;background:var(--card2);flex-shrink:0;border:1px solid rgba(255,255,255,.06);}
.s-img.sq{height:46px;border-radius:10px;}
.s-info{flex:1;min-width:0;}
.s-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-sub{font-size:.62rem;color:rgba(255,255,255,.35);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-meta{font-size:.56rem;color:rgba(255,255,255,.18);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;}
.s-add{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:.72rem;flex-shrink:0;cursor:pointer;transition:all .15s;}
.s-add:active{transform:scale(.88);}
.s-add.added{background:rgba(0,200,100,.14);border-color:rgba(0,200,100,.2);color:#4dda90;}
.s-loading{padding:32px;text-align:center;color:rgba(255,255,255,.2);font-size:.76rem;}
.s-empty{display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:10px;color:rgba(255,255,255,.18);}
.s-empty i{font-size:1.8rem;opacity:.2;}
.s-empty p{font-size:.76rem;}
</style>
</head>
<body>

<div class="page" id="page">

  <div class="wallpaper">
    <img id="wp-img" src="" alt="">
    <div class="wallpaper-fade"></div>
    <div class="top-bar">
      <div class="tb-back" id="tb-back"><i class="fa-solid fa-chevron-left"></i></div>
      <div class="tb-title">Favourites</div>
      <div class="tb-edit" id="tb-edit"><i class="fa-solid fa-pen"></i></div>
    </div>
  </div>

  <div class="content" id="content">

    <div class="tabs">
      <div class="tab active" data-tab="music">Music</div>
      <div class="tab" data-tab="shows">Shows</div>
    </div>

    <div class="panel active" id="panel-music">
      <span class="section-lbl">Tracks</span>
      <div class="grid-3" id="grid-music"></div>
      <span class="section-lbl">Albums</span>
      <div class="grid-3" id="grid-album"></div>
    </div>

    <div class="panel" id="panel-shows">
      <div class="sub-tabs">
        <div class="sub-tab active" data-sub="movie">Movies</div>
        <div class="sub-tab" data-sub="series">Series</div>
        <div class="sub-tab" data-sub="anime">Anime</div>
      </div>
      <div class="grid-2" id="grid-shows"></div>
    </div>

  </div>

  <div class="add-fab" id="add-fab"><i class="fa-solid fa-plus"></i></div>

  <div class="player-bar hidden" id="player-bar">
    <div class="pb-progress"><div class="pb-fill" id="pb-fill"></div></div>
    <img class="pb-art" id="pb-art" src="" alt="">
    <div class="pb-info"><div class="pb-title" id="pb-title">—</div><div class="pb-artist" id="pb-artist">—</div></div>
    <div class="pb-time" id="pb-time">0:00</div>
    <div class="pb-controls">
      <button class="pb-btn" id="pb-prev"><i class="fa-solid fa-backward"></i></button>
      <button class="pb-play" id="pb-play"><i class="fa-solid fa-play" id="pb-icon"></i></button>
      <button class="pb-btn" id="pb-next"><i class="fa-solid fa-forward"></i></button>
    </div>
  </div>

</div>

<div class="search-overlay" id="search-overlay">
  <div class="search-top">
    <div class="search-back" id="search-back"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="search-input" id="s-input" type="text" placeholder="Search…" autocomplete="off">
    </div>
  </div>
  <div class="search-type-row">
    <div class="s-type active" data-stype="music">Tracks</div>
    <div class="s-type" data-stype="album">Albums</div>
    <div class="s-type" data-stype="movie">Movies</div>
    <div class="s-type" data-stype="series">Series</div>
    <div class="s-type" data-stype="anime">Anime</div>
  </div>
  <div class="search-results" id="s-results">
    <div class="s-empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add favourites</p></div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script src="xos-favourites-data.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   XOS FAVOURITES

   profiles.js        -> profile/account data per userid (unchanged)
   xos-favourites-data.js -> ONLY favourite names per userid:
       { userid: { userid, favourites: { music[], album[], movie[],
                                          series[], anime[] } } }

   This file does everything else:
   - looks up "?user=" to know whose favourites to show
   - decodes a bare name into a display card (art/artist/year/rating)
     via iTunes (music) and TMDB-with-fallback (shows)
   - search, add, remove
   - ALL interactivity is wired with addEventListener + event
     delegation (not inline onclick="..."), so a title containing an
     apostrophe (e.g. "Grey's Anatomy") can never break a button by
     corrupting an HTML attribute — that was the previous bug.
   ════════════════════════════════════════════════════════════ */

// ── State declared up top, before anything that could throw,
//    so every button handler below always has valid state to read ──
let currentTab = 'music';
let currentSub = 'movie';
let sType = 'music';
let editMode = false;
let searchOpen = false;
let sTimer = null;
let queue = [], qIdx = -1, playing = false, pTimer = null;

const params = new URLSearchParams(location.search);
const USERID = params.get('user') || 'nikhil';
const TMDB_KEY = '4f4e4e4f4e4e4f4e4f4e4f4e4f4e4f4e'; // placeholder — swap for a real key if you have one
const TMDB_IMG = 'https://image.tmdb.org/t/p/w342';

// ── Defensive fallback: if xos-favourites-data.js failed to load
//    (wrong path, blocked, etc), keep the page working in-memory
//    instead of every button silently dying. ──
if (!window.XOS_FAV) {
  console.error('[xos-favourites] xos-favourites-data.js did not load — using a temporary in-memory store. Check the <script src> path.');
  window.XOS_FAV = (function(){
    const mem = {};
    const empty = () => ({ music:[], album:[], movie:[], series:[], anime:[] });
    return {
      getUser(u){ return mem[u] || null; },
      getAllUsers(){ return mem; },
      get(u,t){ return mem[u] ? mem[u].favourites[t] : []; },
      set(u,t,names){ mem[u] = mem[u] || { userid:u, favourites: empty() }; mem[u].favourites[t] = names; },
      add(u,t,name){ mem[u] = mem[u] || { userid:u, favourites: empty() }; const l = mem[u].favourites[t]; if(l.some(n=>n.toLowerCase()===name.toLowerCase())) return false; l.push(name); return true; },
      remove(u,t,name){ if(!mem[u]) return; mem[u].favourites[t] = mem[u].favourites[t].filter(n=>n.toLowerCase()!==name.toLowerCase()); },
      has(u,t,name){ return mem[u] ? mem[u].favourites[t].some(n=>n.toLowerCase()===name.toLowerCase()) : false; },
      seedDefaults(u){ mem[u] = mem[u] || { userid:u, favourites: { music:['Blinding Lights'], album:['After Hours'], movie:['Inception'], series:['Breaking Bad'], anime:['Attack on Titan'] } }; }
    };
  })();
}

try { window.XOS_FAV.seedDefaults(USERID); } catch(e){ console.error('[xos-favourites] seedDefaults failed', e); }

const audio = document.getElementById('audio');

/* ── LOOKUP CACHE (name -> display info), persisted so repeat visits are instant ── */
const CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days
function cacheKey(type, name){ return `xos_fav_cache_${type}_${name.toLowerCase()}`; }
function cacheGet(type, name){
  try{
    const raw = localStorage.getItem(cacheKey(type, name));
    if(!raw) return null;
    const { info, t } = JSON.parse(raw);
    if(Date.now() - t > CACHE_TTL) return null;
    return info;
  }catch{ return null; }
}
function cacheSet(type, name, info){
  try{ localStorage.setItem(cacheKey(type, name), JSON.stringify({ info, t: Date.now() })); }catch{}
}

/* ── WALLPAPER (pulled from profiles.js if available) ── */
(function(){
  try{
    const banner = localStorage.getItem(`xos_edit_banner_${USERID}`) ||
      (window.XOS_PROFILES && window.XOS_PROFILES[USERID]?.banner) || '';
    const wp = document.getElementById('wp-img');
    if(banner){ try{ wp.src = JSON.parse(banner); }catch{ wp.src = banner; } }
    else {
      const fallbacks=['https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80','https://images.unsplash.com/photo-1470071459604-7b5ec3d8b6d4?w=800&q=80'];
      wp.src=fallbacks[Math.floor(Math.random()*fallbacks.length)];
    }
  }catch(e){ console.error('[xos-favourites] wallpaper setup failed', e); }
})();

/* ── TABS ── */
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active',el.id==='panel-'+t));
  if(t==='shows') renderShows(); else renderMusic();
}
function switchSub(s){
  currentSub=s;
  document.querySelectorAll('.sub-tab').forEach(el=>el.classList.toggle('active',el.dataset.sub===s));
  renderShows();
}

/* ══════════════ LOOKUPS (name -> display info) ══════════════ */

function hasTmdbKey(){
  return TMDB_KEY && !/^your[_-]?tmdb[_-]?key$/i.test(TMDB_KEY) && TMDB_KEY !== '4f4e4e4f4e4e4f4e4f4e4f4e4f4e4f4e';
}

async function lookupTrack(name){
  const cached = cacheGet('music', name);
  if(cached) return cached;
  let info = { title:name, artist:'Unknown artist', artwork:'', year:'', genre:'', stream:'' };
  try{
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=song&limit=1&media=music`);
    const d = await r.json();
    const item = d.results && d.results[0];
    if(item){
      info = {
        title: item.trackName || name,
        artist: item.artistName || 'Unknown artist',
        artwork: (item.artworkUrl100||'').replace('100x100','400x400'),
        year: item.releaseDate ? item.releaseDate.substring(0,4) : '',
        genre: item.primaryGenreName || '',
        stream: item.previewUrl || ''
      };
    }
  }catch(e){ /* keep fallback info */ }
  cacheSet('music', name, info);
  return info;
}

async function lookupAlbum(name){
  const cached = cacheGet('album', name);
  if(cached) return cached;
  let info = { title:name, artist:'Unknown artist', artwork:'', year:'', trackCount:0 };
  try{
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=album&limit=1&media=music`);
    const d = await r.json();
    const item = d.results && d.results[0];
    if(item){
      info = {
        title: item.collectionName || name,
        artist: item.artistName || 'Unknown artist',
        artwork: (item.artworkUrl100||'').replace('100x100','400x400'),
        year: item.releaseDate ? item.releaseDate.substring(0,4) : '',
        trackCount: item.trackCount || 0
      };
    }
  }catch(e){ /* keep fallback info */ }
  cacheSet('album', name, info);
  return info;
}

async function tmdbFind(name, type){
  if(!hasTmdbKey()) throw new Error('no tmdb key');
  const tmdbType = type==='movie' ? 'movie' : 'tv';
  const query = type==='anime' ? name+' anime' : name;
  const r = await fetch(`https://api.themoviedb.org/3/search/${tmdbType}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
  const d = await r.json();
  if(!r.ok || d.success===false) throw new Error(d.status_message || 'tmdb failed');
  const item = (d.results||[])[0];
  if(!item) throw new Error('no tmdb result');
  const year = (item.release_date || item.first_air_date || '').substring(0,4);
  return {
    title: item.title || item.name || name,
    subtitle: item.overview ? item.overview.substring(0,60)+'…' : '',
    artwork: item.poster_path ? TMDB_IMG+item.poster_path : '',
    year,
    rating: item.vote_average ? item.vote_average.toFixed(1) : '—'
  };
}

async function publicFind(name, type){
  if(type==='movie'){
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&media=movie&entity=movie&limit=1`);
    const d = await r.json();
    const item = (d.results||[])[0];
    if(!item) return null;
    return {
      title: item.trackName || name,
      subtitle: item.primaryGenreName || '',
      artwork: (item.artworkUrl100||'').replace('100x100','400x600'),
      year: item.releaseDate ? item.releaseDate.substring(0,4) : '',
      rating: item.contentAdvisoryRating || '—'
    };
  }
  if(type==='anime'){
    const r = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(name)}&limit=1`);
    const d = await r.json();
    const item = (d.data||[])[0];
    if(!item) return null;
    return {
      title: item.title_english || item.title || name,
      subtitle: (item.synopsis||'').substring(0,60)+(item.synopsis && item.synopsis.length>60?'…':''),
      artwork: item.images?.jpg?.image_url || '',
      year: item.year || (item.aired?.from||'').substring(0,4),
      rating: item.score ? item.score.toFixed(1) : '—'
    };
  }
  const r = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(name)}`);
  const d = await r.json();
  const first = (d||[])[0];
  if(!first) return null;
  const show = first.show;
  return {
    title: show.name || name,
    subtitle: (show.genres||[]).slice(0,2).join(', '),
    artwork: show.image?.medium || show.image?.original || '',
    year: show.premiered ? show.premiered.substring(0,4) : '',
    rating: show.rating?.average ? show.rating.average.toFixed(1) : '—'
  };
}

async function lookupShow(name, type){
  const cached = cacheGet(type, name);
  if(cached) return cached;
  let info;
  try{
    info = await tmdbFind(name, type);
  }catch(e){
    try{ info = await publicFind(name, type); }catch(e2){ info = null; }
  }
  if(!info) info = { title:name, subtitle:'', artwork:'', year:'', rating:'—' };
  cacheSet(type, name, info);
  return info;
}

/* ══════════════ RENDER FAVOURITES ══════════════ */

function skeletonGrid(count, poster){
  let html='';
  for(let i=0;i<count;i++){
    html += `<div class="item-card"><div class="${poster?'card-poster-wrap':'card-art-wrap'} loading">
      <div class="${poster?'card-poster':'card-art'}"></div>
    </div><div class="card-info"><div class="card-title">&nbsp;</div></div></div>`;
  }
  return html;
}

async function renderMusic(){
  await Promise.all([renderTracks(), renderAlbums()]);
}

async function renderTracks(){
  const names = window.XOS_FAV.get(USERID,'music');
  const el = document.getElementById('grid-music');
  if(!names.length){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-music"></i><p>No tracks yet</p><span>Tap + to add</span></div>'; return; }
  el.innerHTML = skeletonGrid(names.length,false);
  const infos = await Promise.all(names.map(n=>lookupTrack(n)));
  el.innerHTML = names.map((name,i)=>{
    const t = infos[i];
    const artIsPlaying = qIdx===i && playing;
    return `<div class="item-card" data-index="${i}">
      <div class="card-art-wrap">
        <img class="card-art" src="${t.artwork||'https://placehold.co/400x400/141414/444?text=♪'}" alt="" loading="lazy" onerror="this.src='https://placehold.co/400x400/141414/444?text=♪'">
        <div class="card-badge music">${esc(t.genre||'Track')}</div>
        <div class="card-play ${artIsPlaying?'playing':''}" data-play-index="${i}">
          <i class="fa-solid ${artIsPlaying?'fa-pause':'fa-play'}"></i>
        </div>
        <div class="card-remove" data-remove-type="music" data-remove-name="${escAttr(name)}"><i class="fa-solid fa-xmark"></i></div>
      </div>
      <div class="card-info">
        <div class="card-title">${esc(t.title)}</div>
        <div class="card-sub">${esc(t.artist)}</div>
        <div class="card-meta">${esc(t.year||'')}</div>
      </div>
    </div>`;
  }).join('');
  // sync queue with resolved stream data for playback
  queue = names.map((name,i)=>({ name, ...infos[i] }));
  updatePlayBtns();
}

/* ══════════════ SEARCH ══════════════ */

function openSearch(){
  if(currentTab==='music') switchSType('music'); else switchSType(currentSub);
  searchOpen=true;
  const el=document.getElementById('search-overlay');
  el.style.display='flex'; el.classList.remove('closing');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  setTimeout(()=>document.getElementById('s-input').focus(),400);
  history.pushState({modal:'search'},'');
}
function closeSearch(){
  if(!searchOpen) return;
  searchOpen=false;
  const el=document.getElementById('search-overlay');
  el.classList.remove('open'); el.classList.add('closing');
  history.back();
  setTimeout(()=>{el.style.display='none';el.classList.remove('closing');document.getElementById('s-input').value='';},360);
}
function switchSType(t){
  sType=t;
  document.querySelectorAll('.s-type').forEach(el=>el.classList.toggle('active',el.dataset.stype===t));
  const q=document.getElementById('s-input').value.trim();
  if(q) doSearch(q);
  else document.getElementById('s-results').innerHTML='<div class="s-empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add favourites</p></div>';
}
function onSearch(val){
  clearTimeout(sTimer);
  const el=document.getElementById('s-results');
  if(!val.trim()){el.innerHTML='<div class="s-empty"><i class="fa-solid fa-magnifying-glass"></i><p>Search to add favourites</p></div>';return;}
  el.innerHTML='<div class="s-loading">Searching…</div>';
  sTimer=setTimeout(()=>doSearch(val.trim()),380);
}

// Each result row's "add" button carries its data safely in data-* attributes
// (encodeURIComponent output has no quote characters, so it can never break
// the HTML it's embedded in — unlike the old inline-onclick approach).
async function doSearch(q){
  const el=document.getElementById('s-results');
  try{
    if(sType==='music'||sType==='album'){
      const entity = sType==='album' ? 'album' : 'song';
      const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=${entity}&limit=12&media=music`);
      const d = await r.json();
      const results = d.results||[];
      if(!results.length){ el.innerHTML='<div class="s-empty"><i class="fa-solid fa-face-meh"></i><p>No results</p></div>'; return; }
      el.innerHTML = results.map((item)=>{
        const isTrack = sType==='music';
        const title = (isTrack ? item.trackName : item.collectionName) || '—';
        const sub = item.artistName || '—';
        const meta = isTrack ? (item.primaryGenreName||'') : `${item.trackCount||'?'} tracks`;
        const year = item.releaseDate ? item.releaseDate.substring(0,4) : '';
        const art = (item.artworkUrl100||'').replace('100x100','400x400');
        const already = window.XOS_FAV.has(USERID, sType, title);
        const cacheInfo = isTrack
          ? { title, artist:sub, artwork:art, year, genre:item.primaryGenreName||'', stream:item.previewUrl||'' }
          : { title, artist:sub, artwork:art, year, trackCount:item.trackCount||0 };
        return `<div class="s-item">
          <img class="s-img sq" src="${art||'https://placehold.co/46x46/141414/444?text=♪'}" alt="" onerror="this.src='https://placehold.co/46x46/141414/444?text=♪'">
          <div class="s-info"><div class="s-title">${esc(title)}</div><div class="s-sub">${esc(sub)}</div><div class="s-meta">${esc(meta)}${year?' · '+year:''}</div></div>
          <div class="s-add ${already?'added':''}" data-add-type="${sType}" data-add-name="${encodeURIComponent(title)}" data-add-info="${encodeURIComponent(JSON.stringify(cacheInfo))}"><i class="fa-solid ${already?'fa-check':'fa-plus'}"></i></div>
        </div>`;
      }).join('');
    } else {
      let results = [];
      try{
        results = await tmdbSearchAll(q, sType);
      }catch(e){
        results = await publicSearchAll(q, sType);
      }
      if(!results.length){ el.innerHTML='<div class="s-empty"><i class="fa-solid fa-face-meh"></i><p>No results</p></div>'; return; }
      el.innerHTML = results.map((item)=>{
        const already = window.XOS_FAV.has(USERID, sType, item.title);
        const cacheInfo = { title:item.title, subtitle:item.subtitle||'', artwork:item.artwork||'', year:item.year||'', rating:item.rating||'—' };
        return `<div class="s-item">
          <img class="s-img" src="${item.artwork||'https://placehold.co/46x62/141414/444?text=🎬'}" alt="" onerror="this.src='https://placehold.co/46x62/141414/444?text=🎬'">
          <div class="s-info"><div class="s-title">${esc(item.title)}</div><div class="s-sub">⭐ ${esc(item.rating||'—')}</div><div class="s-meta">${sType}${item.year?' · '+item.year:''}</div></div>
          <div class="s-add ${already?'added':''}" data-add-type="${sType}" data-add-name="${encodeURIComponent(item.title)}" data-add-info="${encodeURIComponent(JSON.stringify(cacheInfo))}"><i class="fa-solid ${already?'fa-check':'fa-plus'}"></i></div>
        </div>`;
      }).join('');
    }
  }catch(e){
    el.innerHTML='<div class="s-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Search failed</p></div>';
  }
}

async function tmdbSearchAll(q, type){
  if(!hasTmdbKey()) throw new Error('no tmdb key');
  const tmdbType = type==='movie' ? 'movie' : 'tv';
  const query = type==='anime' ? q+' anime' : q;
  const r = await fetch(`https://api.themoviedb.org/3/search/${tmdbType}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
  const d = await r.json();
  if(!r.ok || d.success===false) throw new Error(d.status_message||'tmdb failed');
  return (d.results||[]).slice(0,12).map(item=>{
    const year = (item.release_date || item.first_air_date || '').substring(0,4);
    return {
      title: item.title || item.name || '—',
      subtitle: item.overview ? item.overview.substring(0,40)+'…' : '',
      artwork: item.poster_path ? TMDB_IMG+item.poster_path : '',
      year,
      rating: item.vote_average ? item.vote_average.toFixed(1) : '—'
    };
  });
}

    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=movie&entity=movie&limit=12`);
    const d = await r.json();
    return (d.results||[]).map(item=>({
      title: item.trackName || '—',

      year: item.releaseDate ? item.releaseDate.substring(0,4) : '',
      rating: item.contentAdvisoryRating || '—'
    }));
  }
  if(type==='anime'){
    const r = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=12`);
    const d = await r.json();
    return (d.data||[]).map(item=>({
      title: item.title_english || item.title || '—',
      subtitle: (item.synopsis||'').substring(0,40)+(item.synopsis && item.synopsis.length>40?'…':''),
      artwork: item.images?.jpg?.image_url || '',
      year: item.year || (item.aired?.from||'').substring(0,4),
      rating: item.score ? item.score.toFixed(1) : '—'
    }));

function addFav(type, title, info, btnEl){
  if(btnEl.classList.contains('added')) return;
  const added = window.XOS_FAV.add(USERID, type, title);
  if(added) cacheSet(type, title, info);

function esc(s){ return (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return esc(s); }

/* ══════════════ MUSIC PLAYER ══════════════ */
function playTrack(i){
  if(!queue[i]) return;
  if(qIdx===i && playing){ pauseAudio(); return; }
  if(qIdx===i && !playing){ resumeAudio(); return; }
  qIdx=i;
  loadTrack(queue[i]);
}
function loadTrack(t){
  audio.src=t.stream||''; audio.load();
  audio.play().catch(()=>{});
  playing=true;
  document.getElementById('pb-art').src=t.artwork||'';
  document.getElementById('pb-title').textContent=t.title||t.name||'—';
  document.getElementById('pb-artist').textContent=t.artist||'—';
  document.getElementById('pb-icon').className='fa-solid fa-pause';
  document.getElementById('player-bar').classList.remove('hidden');
  startProg(); updatePlayBtns();
}
function pauseAudio(){ audio.pause(); playing=false; document.getElementById('pb-icon').className='fa-solid fa-play'; clearInterval(pTimer); updatePlayBtns(); }
function resumeAudio(){ audio.play().catch(()=>{}); playing=true; document.getElementById('pb-icon').className='fa-solid fa-pause'; startProg(); updatePlayBtns(); }
function togglePlay(){ if(qIdx===-1){ playTrack(0); return; } playing?pauseAudio():resumeAudio(); }
function nextTrack(){ if(!queue.length) return; qIdx=(qIdx+1)%queue.length; loadTrack(queue[qIdx]); }
function prevTrack(){ if(!queue.length) return; qIdx=(qIdx-1+queue.length)%queue.length; loadTrack(queue[qIdx]); }

function updatePlayBtns(){
  document.querySelectorAll('[data-play-index]').forEach(el=>{
    const i=parseInt(el.dataset.playIndex);
    const active = i===qIdx && playing;
    el.classList.toggle('playing',active);
    el.innerHTML=`<i class="fa-solid ${active?'fa-pause':'fa-play'}"></i>`;
  });
}
function startProg(){
  clearInterval(pTimer);
  pTimer=setInterval(()=>{
    if(!audio.duration||isNaN(audio.duration)) return;
    const pct=(audio.currentTime/audio.duration)*100;
    document.getElementById('pb-fill').style.width=pct+'%';
    document.getElementById('pb-time').textContent=fmt(audio.currentTime);
  },250);
}
function fmt(s){ if(!s||isNaN(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
audio.addEventListener('ended', nextTrack);

function goBack(){
  if(searchOpen){ closeSearch(); return; }
  if(history.length>1) history.back();
  else location.href='anush-decodes.html?user='+USERID;
}
window.addEventListener('popstate',()=>{ if(searchOpen){ closeSearch(); } });

/* ══════════════ EVENT WIRING (delegation — robust against dynamic content) ══════════════ */
function wireEvents(){
  document.getElementById('tb-back').addEventListener('click', goBack);
  document.getElementById('tb-edit').addEventListener('click', toggleEdit);
  document.getElementById('add-fab').addEventListener('click', openSearch);
  document.getElementById('search-back').addEventListener('click', closeSearch);
  document.getElementById('s-input').addEventListener('input', (e)=>onSearch(e.target.value));
  document.getElementById('pb-play').addEventListener('click', togglePlay);
  document.getElementById('pb-prev').addEventListener('click', prevTrack);
  document.getElementById('pb-next').addEventListener('click', nextTrack);

  document.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=>switchTab(el.dataset.tab));
  });
  document.querySelectorAll('.sub-tab').forEach(el=>{
    el.addEventListener('click', ()=>switchSub(el.dataset.sub));
  });
  document.querySelectorAll('.s-type').forEach(el=>{
    el.addEventListener('click', ()=>switchSType(el.dataset.stype));
  });

  // delegated: card remove / play buttons (grids get re-rendered constantly)
  document.getElementById('content').addEventListener('click', (e)=>{
    const removeBtn = e.target.closest('[data-remove-type]');
    if(removeBtn){
      e.stopPropagation();
      removeItem(removeBtn.dataset.removeType, removeBtn.dataset.removeName);
      return;
    }
    const playBtn = e.target.closest('[data-play-index]');
    if(playBtn){
      e.stopPropagation();
      playTrack(parseInt(playBtn.dataset.playIndex));
    }
  });

  // delegated: search-result add buttons
  document.getElementById('s-results').addEventListener('click', (e)=>{
    const addBtn = e.target.closest('[data-add-type]');
    if(!addBtn) return;
    const type = addBtn.dataset.addType;
    const name = decodeURIComponent(addBtn.dataset.addName);
    const info = JSON.parse(decodeURIComponent(addBtn.dataset.addInfo));
    addFav(type, name, info, addBtn);
  });
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded',()=>{
  wireEvents();
  renderMusic();
  renderShows();
});
</script>
</body>
</html>
