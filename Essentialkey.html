<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>x0s | Cutoff Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #000; --accent: #007aff; --card: #0a0a0a; --border: #1a1a1a;
  --text: #fff; --muted: #666; --font: 'Space Grotesk', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── SEARCH HEADER ── */
.header { padding: 30px 16px 20px; background: #000; border-bottom: 1px solid var(--border); }
.search-input-wrap {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border: 1px solid var(--border); padding: 16px 20px; border-radius: 18px;
}
.search-input-wrap:focus-within { border-color: var(--accent); }
input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: var(--font); font-size: 1.1rem; }

/* ── RESULTS ── */
.results { flex: 1; overflow-y: auto; padding: 10px 16px; }
.college-card { 
  padding: 20px; border-bottom: 1px solid var(--border); cursor: pointer; 
  transition: background 0.2s; animation: slideIn 0.4s ease both;
}
.college-card:active { background: #0c0c0c; }
.c-name { font-size: 1rem; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
.c-id { font-size: 0.7rem; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }

/* ── OVERLAY VIEWER ── */
.viewer {
  position: fixed; inset: 0; z-index: 1000; background: #000;
  display: none; flex-direction: column; transform: translateY(100%);
  transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
}
.viewer.open { display: flex; transform: translateY(0); }
.viewer-nav { padding: 15px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.btn-close { width: 40px; height: 40px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }
.v-title { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-align: center; flex: 1; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── PDF RENDERER ── */
.pdf-container { flex: 1; overflow: auto; background: #111; display: flex; flex-direction: column; align-items: center; }
canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px; }

/* ── LOADER ── */
#loader { 
  position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1100; 
  display: none; flex-direction: column; align-items: center; justify-content: center; 
}
.spinner { width: 30px; height: 30px; border: 3px solid rgba(0,122,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div style="font-size: 0.8rem; color: var(--accent); letter-spacing: 0.1em; font-weight: 700;">SCANNING PDF ENGINE</div>
</div>

<div class="header">
  <div class="search-input-wrap">
    <i class="fa-solid fa-magnifying-glass" style="color: var(--muted);"></i>
    <input type="text" id="mainInput" placeholder="Search Colleges..." oninput="runSearch(this.value)">
  </div>
</div>

<div class="results" id="resArea"></div>

<div class="viewer" id="viewer">
  <div class="viewer-nav">
    <div class="btn-close" onclick="closeViewer()"><i class="fa-solid fa-xmark"></i></div>
    <div class="v-title" id="vTitle">...</div>
    <div style="width:40px"></div>
  </div>
  <div class="pdf-container" id="pdfArea">
    <!-- PDF Canvas will render here -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const PDF_URL = 'Cutoff.pdf'; // Matches your GitHub link
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function runSearch(val) {
  const q = val.toLowerCase().trim();
  const area = document.getElementById('resArea');
  if(!q) { area.innerHTML = ''; return; }

  const matches = (window.XOS_COLLEGES || []).filter(c => 
    c.name.toLowerCase().includes(q) || q === '#college'
  );

  area.innerHTML = matches.map(c => `
    <div class="college-card" onclick="processPDF('${c.name.split(',')[0].trim()}')">
      <div class="c-id">${c.id}</div>
      <div class="c-name">${c.name}</div>
    </div>
  `).join('');
}

async function processPDF(name) {
  const loader = document.getElementById('loader');
  const viewer = document.getElementById('viewer');
  const area = document.getElementById('pdfArea');
  const title = document.getElementById('vTitle');

  loader.style.display = 'flex';
  title.textContent = name;
  area.innerHTML = ''; // Clear previous

  try {
    const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
    let foundPageNum = 1;

    // Scan PDF logic (The "Drive" feel)
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const text = textContent.items.map(item => item.str).join(' ');
      
      if (text.toLowerCase().includes(name.toLowerCase())) {
        foundPageNum = i;
        break;
      }
    }

    // Render the specific page directly (Works on mobile!)
    const page = await pdf.getPage(foundPageNum);
    const viewport = page.getViewport({ scale: 2.0 }); // High quality
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    await page.render({ canvasContext: context, viewport: viewport }).promise;
    area.appendChild(canvas);

    // Show Viewer
    viewer.style.display = 'flex';
    requestAnimationFrame(() => viewer.classList.add('open'));
    
  } catch (e) {
    alert("PDF Engine Error: Check if Cutoff.pdf exists in root.");
    console.error(e);
  } finally {
    loader.style.display = 'none';
  }
  
  history.pushState({view: 'pdf'}, '');
}

function closeViewer() {
  const v = document.getElementById('viewer');
  v.classList.remove('open');
  setTimeout(() => v.style.display = 'none', 450);
}

window.addEventListener('popstate', closeViewer);
</script>

<script src="colleges.js"></script>
</body>
</html>
