<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>x0s | Cutoff Search</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #000000; --accent: #007aff; --card: #0a0a0a; --border: #1a1a1a;
  --text: #ffffff; --muted: #666666; --font: 'Space Grotesk', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* ── SEARCH BAR ── */
.header { padding: 20px 16px; background: rgba(0,0,0,0.9); z-index: 10; border-bottom: 1px solid var(--border); }
.search-box {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px;
}
.search-box:focus-within { border-color: var(--accent); }
.search-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: var(--font); font-size: 1rem; }

/* ── LIST ── */
.results { flex: 1; overflow-y: auto; padding: 10px 16px; }
.item { padding: 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
.item:active { background: #111; }
.item-name { font-size: 0.95rem; font-weight: 600; }
.item-id { font-size: 0.7rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }

/* ── PDF OVERLAY ── */
.viewer {
  position: fixed; inset: 0; z-index: 100; background: #000;
  display: none; flex-direction: column; transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}
.viewer.open { display: flex; transform: translateY(0); }
.viewer-top { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.close-btn { width: 36px; height: 36px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; }
.title { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.frame-wrap { flex: 1; background: #fff; position: relative; }
#pdf-iframe { width: 100%; height: 100%; border: none; }

/* Status Loader */
#status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #000; font-size: 0.8rem; pointer-events: none; }
</style>
</head>
<body>

<div class="header">
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass" style="color: var(--muted);"></i>
    <input type="text" class="search-input" placeholder="Search College Name..." oninput="doSearch(this.value)">
  </div>
</div>

<div class="results" id="list"></div>

<div class="viewer" id="viewer">
  <div class="viewer-top">
    <div class="close-btn" onclick="closeViewer()"><i class="fa-solid fa-xmark"></i></div>
    <div class="title" id="v-title">Scanning PDF...</div>
    <div style="width:36px"></div>
  </div>
  <div class="frame-wrap">
    <div id="status">x0s Engine: Locating Data...</div>
    <iframe id="pdf-iframe"></iframe>
  </div>
</div>

<!-- Load PDF.js library to handle the mobile search bug -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const PDF_FILE = 'Cutoff.pdf';
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function doSearch(q) {
  const container = document.getElementById('list');
  const query = q.toLowerCase().trim();
  if(!query) { container.innerHTML = ''; return; }

  const matches = (window.XOS_COLLEGES || []).filter(c => 
    c.name.toLowerCase().includes(query) || query === '#college'
  );

  container.innerHTML = matches.map(c => `
    <div class="item" onclick="smartOpen('${c.name.split(',')[0].trim()}')">
      <div class="item-id">${c.id}</div>
      <div class="item-name">${c.name}</div>
    </div>
  `).join('');
}

// THE CORE LOGIC: Find page number manually because mobile #search is broken
async function smartOpen(collegeName) {
  const viewer = document.getElementById('viewer');
  const iframe = document.getElementById('pdf-iframe');
  const title = document.getElementById('v-title');
  const status = document.getElementById('status');
  
  title.textContent = "Scanning: " + collegeName;
  status.style.display = 'block';
  viewer.style.display = 'flex';
  setTimeout(() => viewer.classList.add('open'), 10);

  try {
    const loadingTask = pdfjsLib.getDocument(PDF_FILE);
    const pdf = await loadingTask.promise;
    let targetPage = 1;

    // Scan the PDF text to find the college
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const strings = content.items.map(item => item.str).join(' ');
      
      if (strings.includes(collegeName)) {
        targetPage = i;
        break;
      }
    }

    // Now use #page=X which mobile browsers DO support
    iframe.src = `${PDF_FILE}#page=${targetPage}`;
    status.style.display = 'none';
    title.textContent = collegeName;
    
  } catch (err) {
    console.error(err);
    iframe.src = PDF_FILE; // Fallback
  }
  
  history.pushState({view: 'pdf'}, '');
}

function closeViewer() {
  const viewer = document.getElementById('viewer');
  viewer.classList.remove('open');
  setTimeout(() => {
    viewer.style.display = 'none';
    document.getElementById('pdf-iframe').src = '';
  }, 400);
}

window.addEventListener('popstate', closeViewer);
</script>

<script src="colleges.js"></script>
</body>
</html>
