<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>x0s | Search</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg: #000000;
  --accent: #007aff;
  --card: #0a0a0a;
  --border: #1a1a1a;
  --text: #ffffff;
  --muted: #666666;
  --font: 'Space Grotesk', sans-serif;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { 
  background: var(--bg); 
  color: var(--text); 
  font-family: var(--font); 
  height: 100vh; 
  overflow: hidden; 
  display: flex; 
  flex-direction: column; 
}

/* ── SEARCH UI ── */
.search-container {
  padding: 20px 16px;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.search-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 14px;
  transition: border-color 0.2s;
}

.search-wrapper:focus-within { border-color: var(--accent); }

.search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 1rem;
}

.search-input::placeholder { color: var(--muted); }

/* ── RESULTS ── */
.results-area {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px;
}

.college-item {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  animation: slideUp 0.4s var(--ease) both;
}

.college-item:active { background: rgba(255,255,255,0.05); }

.college-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
.college-id { font-size: 0.7rem; color: var(--accent); letter-spacing: 0.05em; font-weight: 700; }

/* ── PDF OVERLAY ── */
.pdf-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  display: none;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.4s var(--ease);
}

.pdf-overlay.open { display: flex; transform: translateY(0); }

.pdf-header {
  padding: 14px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.pdf-close {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); cursor: pointer;
}

.pdf-title { font-size: 0.85rem; font-weight: 600; color: var(--text); }

.pdf-frame-wrap { flex: 1; background: #fff; }
#pdf-iframe { width: 100%; height: 100%; border: none; }

@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="search-container">
  <div class="search-wrapper">
    <i class="fa-solid fa-magnifying-glass" style="color: var(--muted);"></i>
    <input type="text" class="search-input" id="main-search" placeholder="Search Colleges..." oninput="filterColleges(this.value)">
  </div>
</div>

<div class="results-area" id="results-list">
  <!-- Dynamic Results -->
</div>

<div class="pdf-overlay" id="pdf-overlay">
  <div class="pdf-header">
    <div class="pdf-close" onclick="closePdf()"><i class="fa-solid fa-xmark"></i></div>
    <div class="pdf-title" id="pdf-title">Cutoff 2025</div>
    <div style="width:36px;"></div>
  </div>
  <div class="pdf-frame-wrap">
    <iframe id="pdf-iframe" src=""></iframe>
  </div>
</div>

<script>
const MASTER_PDF_URL = "Cutoff.pdf";

function filterColleges(query) {
  const list = document.getElementById('results-list');
  const q = query.toLowerCase().trim();
  
  if (!q) {
    list.innerHTML = `<div style="text-align:center; margin-top:40px; color:var(--muted); font-size:0.8rem;">Type college name or #college</div>`;
    return;
  }

  const colleges = window.XOS_COLLEGES || [];
  const matches = colleges.filter(c => 
    c.name.toLowerCase().includes(q) || q === '#college'
  );

  list.innerHTML = matches.map(c => `
    <div class="college-item" onclick="openPdf('${c.name.split(',')[0].trim()}')">
      <div class="college-id">${c.id}</div>
      <div class="college-name">${c.name}</div>
    </div>
  `).join('');
}

function openPdf(collegeName) {
  const overlay = document.getElementById('pdf-overlay');
  const iframe = document.getElementById('pdf-iframe');
  
  // Highlighting fragment
  const searchParam = `#search="${encodeURIComponent(collegeName)}"`;
  iframe.src = MASTER_PDF_URL + searchParam;
  
  document.getElementById('pdf-title').textContent = collegeName;
  overlay.style.display = 'flex';
  
  requestAnimationFrame(() => {
    overlay.classList.add('open');
  });
  
  history.pushState({modal:'pdf'}, '');
}

function closePdf() {
  const overlay = document.getElementById('pdf-overlay');
  overlay.classList.remove('open');
  setTimeout(() => { 
    overlay.style.display = 'none'; 
    document.getElementById('pdf-iframe').src = ''; 
  }, 400);
}

// Handle Back Button
window.addEventListener('popstate', () => {
  closePdf();
});

// Init
filterColleges('');
</script>

<script src="colleges.js"></script>
</body>
</html>
