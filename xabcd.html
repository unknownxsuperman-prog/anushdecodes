<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>x0s.link</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#000;--card:#0a0a0a;--border:#1a1a1a;--border2:rgba(255,255,255,.06);
  --accent:#007aff;--text:#fff;--muted:#666;--muted2:#333;
  --glass:rgba(10,10,10,.85);--ease:cubic-bezier(.4,0,.2,1);
  --font:'Space Grotesk',sans-serif;
  --nav-h:62px;--top-h:54px;
}
.light{--bg:#fff;--card:#f5f5f7;--border:#e5e5e5;--border2:rgba(0,0,0,.06);--text:#000;--muted:#888;--muted2:#ddd;--glass:rgba(255,255,255,.9);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100%;overflow:hidden;}
::-webkit-scrollbar{display:none;}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:var(--top-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border2);
}
.light .top-bar{background:rgba(255,255,255,.75);}
.top-left{display:flex;align-items:center;gap:10px;}
.top-pfp{width:32px;height:32px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:opacity .18s;flex-shrink:0;}
.top-pfp:active{opacity:.7;}
.top-brand{font-size:1.38rem;font-weight:700;letter-spacing:-.03em;color:var(--text);position:absolute;left:50%;transform:translateX(-50%);}
.top-right{display:flex;align-items:center;gap:6px;}
.top-dots{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.9rem;cursor:pointer;border-radius:8px;
  transition:background .15s;position:relative;
}
.top-dots:active{background:rgba(255,255,255,.08);}

/* floating dropdown from three dot */
.top-dropdown{
  position:absolute;top:42px;right:0;
  background:rgba(15,15,15,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:6px;
  min-width:180px;
  box-shadow:0 12px 40px rgba(0,0,0,.7);
  display:none;z-index:300;
  animation:fadeInDrop .18s var(--ease);
}
.light .top-dropdown{background:rgba(245,245,247,.95);border-color:rgba(0,0,0,.1);}
.top-dropdown.open{display:block;}
@keyframes fadeInDrop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.top-dd-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  font-size:.78rem;font-weight:600;color:var(--text);
  cursor:pointer;transition:background .15s;
  white-space:nowrap;
}
.top-dd-item:active{background:rgba(255,255,255,.08);}
.light .top-dd-item:active{background:rgba(0,0,0,.06);}
.top-dd-item i{font-size:.85rem;width:16px;text-align:center;color:var(--muted);}
.top-dd-badge i.fa-certificate{background:linear-gradient(45deg,#BF953F,#FCF6BA,#B38728,#FBF5B7,#AA771C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.top-dd-divider{height:1px;background:rgba(255,255,255,.07);margin:4px 0;}
.light .top-dd-divider{background:rgba(0,0,0,.07);}

/* ── TABS ── */
.tabs{
  position:fixed;top:var(--top-h);left:0;right:0;z-index:59;
  display:flex;
  background:rgba(0,0,0,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border2);
}
.light .tabs{background:rgba(255,255,255,.7);}
.tab{flex:1;text-align:center;padding:13px 0 11px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative;transition:color .2s;}
.tab.active{color:var(--text);}
.tab.active::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--accent);border-radius:2px;}

/* ── FEED ── */
.feed{
  position:fixed;top:calc(var(--top-h) + 44px);bottom:var(--nav-h);
  left:0;right:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* ── POST ── */
.post{
  padding:14px 16px 0;border-bottom:1px solid var(--border2);
  cursor:pointer;
  transition:background .15s;
}
.post:active{background:rgba(255,255,255,.03);}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-avatar-wrap{position:relative;flex-shrink:0;}
.post-avatar{width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--border);}
/* verified badge — same as profile page */
@keyframes shimmer{0%{left:-100%}100%{left:100%}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(.95)}}
.post-verified{
  position:absolute;bottom:-2px;right:-2px;
  width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);border-radius:50%;
  overflow:hidden;
  animation:pulse 3s infinite ease-in-out;
}
.post-verified .fa-certificate{
  font-size:16px;position:absolute;
  background:linear-gradient(45deg,#BF953F,#FCF6BA,#B38728,#FBF5B7,#AA771C);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.post-verified .fa-check{font-size:7px;color:#000;position:relative;z-index:6;font-weight:900;}
.post-verified::after{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);
  animation:shimmer 2s infinite linear;z-index:7;
}
.post-meta{flex:1;}
.post-name{font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:5px;}
.post-handle{font-size:.72rem;color:var(--muted);}
.post-time{font-size:.68rem;color:var(--muted);}
.post-menu{color:var(--muted);font-size:.78rem;padding:4px 6px;letter-spacing:.05em;}

/* 3:4 image */
.post-media{
  width:100%;aspect-ratio:3/4;
  border-radius:14px;overflow:hidden;
  background:var(--card);margin-bottom:12px;
  position:relative;
}
.post-media img,.post-media video{width:100%;height:100%;object-fit:cover;display:block;}

.post-caption{font-size:.84rem;line-height:1.55;color:var(--text);margin-bottom:12px;font-weight:300;}

/* actions */
.post-actions{
  display:flex;align-items:center;
  padding:4px 0 12px;
  border-top:1px solid var(--border2);
  margin-top:2px;
}
.post-action{
  display:flex;align-items:center;gap:5px;
  padding:7px 10px 7px 0;
  font-size:.72rem;color:var(--muted);font-weight:500;
  cursor:pointer;transition:color .18s;user-select:none;
}
.post-action i{font-size:1rem;transition:transform .18s,color .18s;}
.post-action:active i{transform:scale(.82);}
.post-action.liked{color:#ff3b5c;}
.post-action.liked i{color:#ff3b5c;}
.post-action-spacer{flex:1;}
.post-action.saved i{color:var(--accent);}

@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.post-action.liked i{animation:heartPop .38s var(--ease);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border2);
  padding-bottom:env(safe-area-inset-bottom);
}
.light .bottom-nav{background:rgba(255,255,255,.85);}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 14px;cursor:pointer;
  color:var(--muted);font-size:1.18rem;
  transition:color .18s,transform .14s;
  position:relative;
}
.nav-item.active{color:var(--text);}
.nav-item:active{transform:scale(.88);}
.nav-notif-dot{
  position:absolute;top:4px;right:10px;
  width:7px;height:7px;background:#ff3b5c;border-radius:50%;
  border:1.5px solid var(--bg);
}

/* ── SLIDE DRAWER ── */
.drawer-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0);
  pointer-events:none;
  transition:background .32s var(--ease);
}
.drawer-backdrop.open{background:rgba(0,0,0,.6);pointer-events:all;}

.drawer{
  position:fixed;top:0;bottom:0;left:0;z-index:201;
  width:68vw;max-width:260px;
  background:var(--bg);
  transform:translateX(-100%);
  transition:transform .36s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  overflow-y:auto;
}
.drawer-backdrop.open .drawer{transform:translateX(0);}

.drawer-top{padding:20px 16px 14px;}
.drawer-pfp-wrap{position:relative;width:54px;height:54px;margin-bottom:10px;cursor:pointer;}
.drawer-pfp{width:100%;height:100%;border-radius:14px;object-fit:cover;border:1.5px solid var(--border);}
.drawer-pfp-badge{
  position:absolute;bottom:-2px;right:-2px;
  width:20px;height:20px;
  background:var(--bg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;border:2px solid var(--bg);
  animation:pulse 3s infinite ease-in-out;
}
.drawer-pfp-badge .fa-certificate{font-size:20px;position:absolute;background:linear-gradient(45deg,#BF953F,#FCF6BA,#B38728,#FBF5B7,#AA771C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.drawer-pfp-badge .fa-check{font-size:8px;color:#000;position:relative;z-index:6;font-weight:900;}
.drawer-pfp-badge::after{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);
  animation:shimmer 2s infinite linear;z-index:7;
}
.drawer-name{font-size:.92rem;font-weight:700;margin-bottom:2px;cursor:pointer;}
.drawer-handle{font-size:.68rem;color:var(--muted);margin-bottom:10px;cursor:pointer;}
.drawer-stats{display:flex;gap:14px;font-size:.68rem;color:var(--muted);margin-bottom:14px;}
.drawer-stats b{color:var(--text);font-weight:700;}

/* drawer brand top-right */
.drawer-brand{
  position:absolute;top:22px;right:16px;
  font-size:.82rem;font-weight:700;letter-spacing:-.02em;color:var(--muted);
}
.drawer-divider{height:1px;background:var(--border);margin:0 0 6px;}
.drawer-nav-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;font-size:.88rem;font-weight:600;
  cursor:pointer;color:var(--text);
  transition:background .15s;
}
.drawer-nav-item:active{background:rgba(255,255,255,.05);}
.drawer-nav-item i{font-size:1rem;width:20px;text-align:center;color:var(--text);}
.drawer-spacer{flex:1;}
.drawer-bottom{padding:16px 20px;border-top:1px solid var(--border);}

/* dark mode toggle */
.dm-toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 6px;
  border-top:1px solid var(--border);
  margin-top:8px;
}
.dm-toggle-label{font-size:.8rem;font-weight:600;color:var(--text);}
.dm-pill{
  width:46px;height:26px;border-radius:13px;
  background:var(--muted2);
  position:relative;cursor:pointer;
  transition:background .25s;border:none;
  flex-shrink:0;
}
.dm-pill.on{background:var(--accent);}
.dm-pill.on::after{transform:translateX(20px);}
.drawer-footer-brand{
  padding:6px 16px 20px;
  font-size:.62rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}

/* ══════════════════════════
   GUEST PROFILE MODAL
══════════════════════════ */
@keyframes guestUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes guestDown{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(24px) scale(.97)}}

.guest-backdrop{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:none;align-items:center;justify-content:center;
  padding:24px;
}
.guest-backdrop.open{display:flex;}
.guest-pill{
  width:100%;max-width:360px;
  background:rgba(18,18,20,.82);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  padding:28px 24px 24px;
  display:flex;flex-direction:column;align-items:center;
  position:relative;
  box-shadow:0 32px 80px rgba(0,0,0,.7);
  animation:guestUp .32s cubic-bezier(.32,.72,0,1) forwards;
}
.guest-pill.closing{animation:guestDown .24s var(--ease) forwards;}
.guest-tag{
  position:absolute;top:14px;right:16px;
  font-size:.6rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}
.guest-pfp-wrap{
  width:78px;height:78px;border-radius:50%;
  overflow:hidden;border:1.5px solid rgba(255,255,255,.12);
  margin-bottom:14px;background:rgba(255,255,255,.07);flex-shrink:0;
}
.guest-pfp-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.guest-name{font-size:1rem;font-weight:700;color:#fff;margin-bottom:4px;text-align:center;}
.guest-sub{font-size:.72rem;color:var(--muted);margin-bottom:22px;text-align:center;line-height:1.5;}
.guest-cta{
  width:100%;padding:13px 0;
  background:var(--accent);color:#fff;
  border:none;border-radius:14px;
  font-size:.88rem;font-weight:700;font-family:var(--font);
  cursor:pointer;letter-spacing:.01em;
  transition:opacity .18s;margin-bottom:10px;
}
.guest-cta:active{opacity:.82;}
.guest-skip{font-size:.72rem;color:var(--muted);cursor:pointer;padding:6px 0;transition:color .18s;}
.guest-skip:active{color:#fff;}

/* ══════════════════════════
   SEARCH OVERLAY
══════════════════════════ */
.search-overlay{
  position:fixed;inset:0;z-index:58;
  background:var(--bg);
  display:none;flex-direction:column;
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
}
.search-overlay.open{
  display:flex;transform:translateY(0);
}

.search-top{
  padding:14px 16px 10px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border2);
  flex-shrink:0;
}
.search-bar-wrap{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--border2);
  border-radius:14px;padding:11px 14px;
}
.search-icon{font-size:.82rem;color:var(--muted);flex-shrink:0;}
.search-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-size:.88rem;font-family:var(--font);
  caret-color:var(--accent);
}
.search-input::placeholder{color:var(--muted);}
.search-clear{
  color:var(--muted);font-size:.75rem;cursor:pointer;
  opacity:0;transition:opacity .18s;flex-shrink:0;
}
.search-clear.visible{opacity:1;}

.search-body{
  flex:1;overflow-y:auto;padding:18px 16px 100px;
}

.explore-label{
  font-size:.65rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:14px;
}

/* pill toggle */
.search-pill-nav{
  display:flex;gap:8px;margin-bottom:6px;
}
.spill{
  padding:8px 22px;border-radius:99px;
  font-size:.78rem;font-weight:600;cursor:pointer;
  background:var(--card);border:1px solid var(--border);
  color:var(--muted);transition:all .2s;
}
.spill.active{background:var(--text);color:var(--bg);border-color:var(--text);}

.search-tab-hint{
  font-size:.62rem;color:var(--muted);
  margin-bottom:18px;padding-left:2px;min-height:16px;
  transition:opacity .2s;
}

/* no results */
.no-results-wrap{
  display:flex;flex-direction:column;align-items:center;
  padding:48px 0 20px;
}
.no-results-txt{font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:4px;}
.no-results-sub{font-size:.72rem;color:var(--muted2, #444);}

/* college result card */
.college-card{
  display:flex;align-items:center;gap:12px;
  padding:12px 4px;border-bottom:1px solid var(--border2);
  cursor:pointer;transition:background .15s;
  border-radius:12px;
}
.college-card:active{background:rgba(255,255,255,.04);}
.college-pfp-wrap{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--card);border:1px solid var(--border);}
.college-pfp-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.college-info{flex:1;min-width:0;overflow:hidden;}
.college-card-name{
  font-size:.84rem;font-weight:600;
  white-space:nowrap;overflow:hidden;
  /* marquee only when overflowing — handled via JS class */
}
.college-card-name.marquee{
  animation:marquee 6s linear infinite;
  display:inline-block;
  padding-right:32px;
}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.college-card-name-wrap{overflow:hidden;max-width:100%;}
.college-card-sub{font-size:.66rem;color:var(--muted);margin-top:2px;}
.college-card-pills{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.college-mini-pill{
  padding:2px 8px;border-radius:99px;
  font-size:.58rem;font-weight:600;
  background:rgba(0,122,255,.12);
  border:1px solid rgba(0,122,255,.2);
  color:var(--accent);white-space:nowrap;
}
.college-card-arrow{color:var(--muted2, #444);font-size:.72rem;flex-shrink:0;}

/* ══════════════════════════
   COLLEGE PROFILE
══════════════════════════ */
.college-profile{
  position:fixed;inset:0;z-index:59;
  background:var(--bg);
  display:none;flex-direction:column;
  transform:translateX(100%);
  transition:transform .36s cubic-bezier(.32,.72,0,1);
  overflow-y:auto;
}
.college-profile.open{display:flex;transform:translateX(0);}
.top-back-btn{
  width:36px;height:36px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:.82rem;cursor:pointer;
}
.cp-pill{
  width:100%;max-width:360px;
  background:rgba(255,255,255,.045);
  backdrop-filter:blur(36px);-webkit-backdrop-filter:blur(36px);
  border:1px solid rgba(255,255,255,.09);
  border-radius:28px;padding:28px 22px 24px;
  position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 40px 80px rgba(0,0,0,.6);
}
.cp-pfp{width:60px;height:60px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);background:var(--card);}
.cp-name{font-size:.98rem;font-weight:700;margin-bottom:3px;}
.cp-caption{font-size:.7rem;color:var(--muted);font-weight:300;margin-bottom:8px;}
.cp-pills-row{display:flex;gap:6px;flex-wrap:wrap;}
.cp-pill-tag{
  padding:3px 10px;border-radius:99px;
  font-size:.62rem;font-weight:600;
  background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.2);
  color:var(--accent);
}
.pfp-row{display:flex;align-items:center;gap:14px;}
.divider{height:1px;background:var(--border);margin-bottom:20px;}
.cta-btn{
  width:100%;padding:13px 0;
  background:rgba(255,255,255,.9);color:#000;
  border:none;border-radius:30px;
  font-size:.88rem;font-weight:700;font-family:var(--font);
  cursor:pointer;transition:opacity .18s;
}
.cta-btn:active{opacity:.8;}
.guest-tag{
  position:absolute;top:15px;right:16px;
  font-size:.58rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}

/* ── PDF OVERLAY (NEW) ── */
.pdf-overlay {
  position: fixed; inset: 0; z-index: 500; background: #000;
  display: none; flex-direction: column; transform: translateY(100%);
  transition: transform .4s cubic-bezier(.32,.72,0,1);
}
.pdf-overlay.open { display: flex; transform: translateY(0); }
.pdf-top {
  padding: 14px 16px; background: rgba(0,0,0,.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
}
.pdf-title { font-size: .85rem; font-weight: 600; color: var(--text); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdf-frame-wrap { flex: 1; background: #111; overflow: hidden; }
#pdf-iframe { width: 100%; height: 100%; border: none; background: #fff; }

/* ZYNX STYLES (KEEPING ORIGINALS) */
@keyframes zynxUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes zynxDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes zHeartPop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes zMuteFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
@keyframes zDotPulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.35)}}

.zynx-overlay{
  position:fixed;inset:0;z-index:400;
  background:#000;
  display:none;flex-direction:column;
  transform:translateY(100%);
  will-change:transform;
}
.zynx-overlay.open{
  display:flex;
  animation:zynxUp .42s cubic-bezier(.32,.72,0,1) forwards;
}
.zynx-overlay.closing{
  display:flex;
  animation:zynxDown .38s cubic-bezier(.32,.72,0,1) forwards;
}
.zynx-top{position:absolute;top:0;left:0;right:0;z-index:10;padding:16px 18px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);pointer-events:none;}
.zynx-brand{font-size:1.3rem;font-weight:700;letter-spacing:-.03em;color:#fff;}
.zynx-feed{width:100%;height:calc(100% - var(--nav-h));overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.zynx-item{width:100%;height:100%;flex-shrink:0;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#000;}
.zynx-carousel{position:absolute;inset:0;display:flex;transition:transform .38s cubic-bezier(.25,.72,.35,1);will-change:transform;}
.zynx-slide{width:100%;height:100%;flex-shrink:0;position:relative;overflow:hidden;}
.zynx-slide img,.zynx-slide video{width:100%;height:100%;object-fit:cover;display:block;}
.zynx-tap-zone{position:absolute;inset:0;z-index:5;cursor:pointer;}
.z-mute-ind{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;pointer-events:none;opacity:0;z-index:20;border:1px solid rgba(255,255,255,.2);}
.z-mute-ind.flash{animation:zMuteFlash .65s ease forwards;}
.z-heart-ind{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);font-size:5rem;color:#ff3b5c;pointer-events:none;opacity:0;z-index:21;filter:drop-shadow(0 2px 16px rgba(255,59,92,.5));}
.z-heart-ind.flash{animation:zHeartPop .7s ease forwards;}
.zynx-info{position:absolute;bottom:0;left:0;right:72px;padding:16px 16px 18px;z-index:8;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 100%);padding-top:60px;}
.zynx-dots{display:flex;gap:4px;margin-top:8px;}
.zynx-dot{height:3px;border-radius:2px;background:rgba(255,255,255,.35);transition:width .25s var(--ease),background .25s;width:18px;}
.zynx-dot.active{background:#fff;width:28px;animation:zDotPulse .4s var(--ease);}
.zynx-actions{position:absolute;right:14px;bottom:18px;z-index:9;display:flex;flex-direction:column;align-items:center;gap:0;justify-content:flex-end;}
.z-action{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;user-select:none;padding:10px 0;}
.z-action i{font-size:1.5rem;color:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));transition:transform .18s,color .18s;}
.z-action:active i{transform:scale(.82);}
.z-action span{font-size:.64rem;color:rgba(255,255,255,.75);font-weight:600;}
.z-action.liked i{color:#ff3b5c;}
.z-action.saved i{color:var(--accent);}
.zynx-swipe-hint{position:absolute;bottom:calc(var(--nav-h) + 6px);left:50%;transform:translateX(-50%);font-size:.6rem;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;pointer-events:none;z-index:8;}
</style>
</head>

<div class="pdf-overlay" id="pdf-overlay">
  <div class="pdf-top">
    <div class="top-back-btn" onclick="closePdf()"><i class="fa-solid fa-xmark"></i></div>
    <div class="pdf-title" id="pdf-title">Cutoff Viewer</div>

<script>
/* ── PDF CONFIG ── */
const MASTER_PDF_URL = "Cutoff.pdf"; 
let pdfOpen = false;

function openPdf(query) {
  const overlay = document.getElementById('pdf-overlay');
  const iframe = document.getElementById('pdf-iframe');
  const searchParam = `#search="${encodeURIComponent(query)}"`;
  iframe.src = MASTER_PDF_URL + searchParam;
  document.getElementById('pdf-title').textContent = query;
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('open'));
  pdfOpen = true;
  history.pushState({modal:'pdf'}, '');
}

function closePdf(fromPop) {
  if(!pdfOpen) return;
  const overlay = document.getElementById('pdf-overlay');
  overlay.classList.remove('open');
  if(!fromPop) history.back();
  setTimeout(() => { overlay.style.display = 'none'; document.getElementById('pdf-iframe').src = ''; }, 400);
  pdfOpen = false;
}

/* ── RE-INJECTED COLLEGE PROFILE ── */
let collegeProfileOpen=false;
function openCollegeProfile(idx){
  const colleges=window.XOS_COLLEGES||[];
  const c=colleges[idx];
  if(!c) return;
  collegeProfileOpen=true;
  const displayName = c.name.split(',')[0].trim();
  const caption = c.name.split(',').slice(1).join(',').trim();

  document.getElementById('cp-pfp').src=c.pfp||'1000046129.png';
  document.getElementById('cp-name').innerHTML=`${displayName} <span style="font-size:.65rem;font-weight:600;color:var(--muted);">${c.id}</span>`;
  document.getElementById('cp-caption').textContent=caption||'Engineering College';
  
  const pillsRow=document.getElementById('cp-pills-row');
  pillsRow.innerHTML = `
    <span class="cp-pill-tag">${c.pill1}</span>
    <span class="cp-pill-tag" style="background:rgba(0,122,255,0.2); border:1px solid var(--accent); color:#fff; cursor:pointer;" 
          onclick="openPdf('${displayName}')">
      <i class="fa-solid fa-file-pdf" style="margin-right:4px;"></i> ${c.pill2}
    </span>`;

  const el=document.getElementById('college-profile');
  el.style.display='flex';
  requestAnimationFrame(()=>el.classList.add('open'));
  history.pushState({modal:'college'},'');
}

/* ── THE REST OF YOUR SCRIPTS (ZYNX SWIPE, SEARCH MARQUEE, ETC) ── */

  if(pdfOpen){ closePdf(true); return; }
  if(collegeProfileOpen){ closeCollegeProfile(true); return; }
  if(searchOpen){ closeSearch(true); return; }
  if(zynxOpen){ closeZynx(true); return; }
});

</script>
