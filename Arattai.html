<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xos1 // Link Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg: #000000;
            --accent: #007aff;
            --card: #0a0a0a;
            --border: #1a1a1a;
            --font-main: 'Space Grotesk', sans-serif;
        }

        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Slide-up Animation */
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .interface-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 600px;
        }

        /* xos1 Pill Design (Glassmorphism) */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Utility Card: Scale-down Active State */
        .pill:active {
            transform: scale(0.94);
        }

        .pill:hover {
            border-color: #333;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Custom PNG Mask Logic (Stroke Only) */
        .custom-png-icon {
            width: 18px;
            height: 18px;
            background-color: currentColor; /* Paints the PNG strokes with the current text color */
            
            /* The image path - Ensure it matches your file name exactly */
            -webkit-mask-image: url('arattai logo white.png');
            mask-image: url('arattai logo white.png');
            
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            display: inline-block;
        }

        /* Font Awesome Sizing */
        .pill i {
            font-size: 16px;
        }

        /* Hover Accents */
        .pill-instagram:hover { color: #e1306c; border-color: #e1306c; }
        .pill-x:hover { color: #ffffff; border-color: #ffffff; }
        .pill-github:hover { color: #ffffff; border-color: #404448; background: #24292e; }
        .pill-linkedin:hover { color: #0077b5; border-color: #0077b5; }
        
        /* Arattai Custom Accent */
        .pill-arattai:hover { 
            color: var(--accent); 
            border-color: var(--accent); 
        }

        /* xos1 Developer Badge */
        .badge {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--accent);
            opacity: 0.5;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="interface-wrapper">
        <div class="pill-container">
            
            <a href="https://instagram.com/" target="_blank" class="pill pill-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <a href="https://x.com/" target="_blank" class="pill pill-x">
                <i class="fa-brands fa-x-twitter"></i> X
            </a>

            <a href="https://github.com/" target="_blank" class="pill pill-github">
                <i class="fa-brands fa-github"></i> GitHub
            </a>

            <a href="https://linkedin.com/" target="_blank" class="pill pill-linkedin">
                <i class="fa-brands fa-linkedin-in"></i> LinkedIn
            </a>

            <a href="#" class="pill pill-arattai">
                <span class="custom-png-icon"></span> Arattai
            </a>

        </div>

        <div class="badge">SYSTEM.XOS1.STABLE</div>
    </div>

</body>
</html>
